<script>// ═══════════════════════════════════════════════════════════════════════
//  SVG Utilities
//  — SVG namespace constant, element creation, brightness helpers
// ───────────────────────────────────────────────────────────────────────

window.HAL = window.HAL || {};

window.HAL.svg = {
  // SVG namespace URI required by createElementNS
  ns: 'http://www.w3.org/2000/svg',

  // Create an SVG element with attributes from a dictionary
  el: function(tag, attrs) {
    var e = document.createElementNS(window.HAL.svg.ns, tag);
    if (attrs) {
      for (var k in attrs) e.setAttribute(k, String(attrs[k]));
    }
    return e;
  },

  // ── Brightness helpers ──────────────────────────────────────────────
  // Each renderer can import these to keep frame/data brightness
  // consistent and configurable from radiator.yaml.

  vis: function() {
    return window.HAL_CONFIG.visual || {};
  },

  // Merge card defaults + per-card overrides (no mutation)
  // Returns a new object; does not modify either input.
  mergeConfig: function(defaults, overrides) {
    var cfg = {};
    if (defaults) for (var k in defaults) cfg[k] = defaults[k];
    if (overrides) for (var k in overrides) cfg[k] = overrides[k];
    return cfg;
  },

  // One-stop shop for everything a card renderer needs.
  // Returns { el (SVG element), e (element creator), fg, fs, ns, cfg (merged config) }.
  //   data: the render(data, onDone) data argument
  //   defaults: card.config (optional) — merged with data.cfg to produce cfg
  cardHelpers: function(data, defaults) {
    var svgEl = this.getContainer(data);
    var cfg = defaults ? this.mergeConfig(defaults, data.cfg) : {};
    return {
      el:  svgEl,
      e:   this.el,
      fg:  this.fg,
      fs:  this.fs,
      ns:  this.ns,
      cfg: cfg,
    };
  },

  // Returns an rgba string with opacity = baseBrightness * multiplier.
  //   type: 'frame' or 'data' — selects from visual.frameBrightness or dataBrightness
  //   mult: brightness multiplier (e.g. 0.15 for subtle grid lines, 2.0 for header)
  fg: function(type, mult) {
    var v = window.HAL.svg.vis();
    var base = type === 'data' ? (v.dataBrightness || 0.8) : (v.frameBrightness || 0.4);
    var opacity = Math.min(1, Math.max(0, base * mult));
    return 'rgba(255,255,255,' + opacity.toFixed(2) + ')';
  },

  // Scale a base font size by visual.fontScale (default 1.0).
  // Call as fs(14) instead of hardcoding 'font-size': 14.
  fs: function(px) {
    var scale = window.HAL.svg.vis().fontScale || 1.0;
    return Math.round(px * scale);
  },

  // ── Container helper ────────────────────────────────────────────────
  // Returns the SVG element to render into. Inside a composite card child
  // zone, data._container is set; in standalone mode, falls back to the
  // root #card element.  Standalone call clears the card first.
  //
  //   data:      render(data, onDone) data argument — carries _container
  //              and _containerType ('svg'|'div'|'canvas') when set
  //   fallback:  optional element id (default '#card') for custom containers
  getContainer: function(data, fallback) {
    if (data && data._container) return data._container;
    var id = fallback || 'card';
    var el = document.getElementById(id);
    if (el) el.innerHTML = '';
    return el;
  },
};

<script>// ═══════════════════════════════════════════════════════════════════════
//  Animation Engine
//  — Executes a phase-based animation sequence for chart cards
//  — Each phase is: { action, groups, [order], [gap], [duration], [effect] }
//  — Groups are chart-type specific element collections (header, bands, etc.)
//
//  Actions: appear, disappear, flickerIn, flickerOut, wait, blank,
//           throb, fadeOut, done, draw
//  Orders:  sequential (default), simultaneous, reverse
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.anim = window.HAL.anim || {};

(function() {
  var cfg = window.HAL_CONFIG;

  // ── Element helpers ────────────────────────────────────────────────

  function setOpacity(el, val) {
    if (el instanceof Array) {
      for (var i = 0; i < el.length; i++) setOpacity(el[i], val);
      return;
    }
    el.style.opacity = val;
  }

  function flickerOne(el, dir, dur) {
    var cls = dir === 'in' ? 'blink-in' : 'blink-out';
    if (el instanceof Array) {
      for (var i = 0; i < el.length; i++) flickerOne(el[i], dir, dur);
      return;
    }
    var ms = dur || (window.HAL_CONFIG.timing && window.HAL_CONFIG.timing.flickerDuration) || 1000;
    el.style.animationDuration = ms + 'ms';
    el.classList.add(cls);
  }

  // Throb: snap visible → linear fade out → snap visible → repeat count times.
  // fadeMs: duration of each fade-out (default 1000ms).
  // count: number of throb cycles (default 2).
  function throbOne(el, count, fadeMs, cb) {
    if (el instanceof Array) {
      var done = 0, total = el.length;
      for (var i = 0; i < total; i++) {
        throbOne(el[i], count, fadeMs, function() { done++; if (done >= total && cb) cb(); });
      }
      return;
    }
    var cycles = count || 2;
    var fadeDur = fadeMs || 1000;
    var step = 0;
    var running = true;

    function fadeOut(onDone) {
      var start = performance.now();
      (function tick(now) {
        if (!running) return;
        var t = (now - start) / fadeDur;
        if (t >= 1) { el.style.opacity = '0'; onDone(); return; }
        el.style.opacity = 1 - t;
        requestAnimationFrame(tick);
      })(performance.now());
    }

    function next() {
      if (!running) return;
      step++;
      if (step > cycles) { el.style.opacity = '1'; running = false; if (cb) cb(); return; }
      el.style.opacity = '1';
      fadeOut(next);
    }

    next();
  }

  // ── Action implementations ─────────────────────────────────────────

  var actions = {

    appear: function(elements, phase, onDone) {
      var list = asArray(elements);
      if (list.length === 0) { if (onDone) onDone(); return; }
      var target = phase.opacity !== undefined ? phase.opacity : 1;
      if (phase.order === 'sequential') {
        appearSequence(list, phase.gap || 0, onDone);
      } else {
        setOpacity(list, target);
        if (onDone) onDone();
      }
    },

    disappear: function(elements, phase, onDone) {
      var list = asArray(elements);
      if (list.length === 0) { if (onDone) onDone(); return; }
      if (phase.order === 'sequential') {
        disappearSequence(list, phase.gap || 0, onDone);
      } else {
        setOpacity(list, 0);
        if (onDone) onDone();
      }
    },

    flickerIn: function(elements, phase, onDone) {
      var gap = phase.gap || window.HAL_CONFIG.timing.groupGap;
      var dur = phase.duration;
      if (phase.order === 'simultaneous') {
        var list = asArray(elements);
        for (var i = 0; i < list.length; i++) flickerOne(list[i], 'in', dur);
        var ms = dur || window.HAL_CONFIG.timing.flickerDuration || 1000;
        setTimeout(onDone, ms);
      } else {
        blinkSequence(asArray(elements), 'in', gap, onDone, dur);
      }
    },

    flickerOut: function(elements, phase, onDone) {
      var list = asArray(elements);
      if (list.length === 0) { if (onDone) onDone(); return; }
      if (phase.order === 'sequential') {
        var gap = phase.gap || window.HAL_CONFIG.timing.groupGap;
        var dur = phase.duration;
        blinkSequence(list, 'out', gap, onDone, dur);
      } else {
        var dur = phase.duration;
        for (var i = 0; i < list.length; i++) flickerOne(list[i], 'out', dur);
        var ms = dur || window.HAL_CONFIG.timing.flickerDuration || 1000;
        setTimeout(onDone, ms);
      }
    },

    throb: function(elements, phase, onDone) {
      var list = asArray(elements);
      var count = phase.count || 2;
      var fadeMs = phase.duration || 1000;
      if (phase.order === 'simultaneous') {

        for (var i = 0; i < list.length; i++) {

    // duration: ms per line (default 600)

      i++;

  function fadeSimultaneous(list, dur, onDone) {
    if (list.length === 0) { if (onDone) onDone(); return; }
    var remaining = list.length;
    for (var i = 0; i < list.length; i++) {

        remaining--;
        if (remaining <= 0 && onDone) onDone();
      });
    }

  function fadeSequence(list, dur, onDone) {
    var i = 0;
    function tick() {

      i++;

  function drawOne(el, dur, cb) {

      var done = 0, total = el.length;
      for (var i = 0; i < total; i++) {

      }
      return;
    }

      catch(e) { len = 0; }
    } else {
      var x1 = parseFloat(el.getAttribute('x1') || 0);
      var y1 = parseFloat(el.getAttribute('y1') || 0);
      var x2 = parseFloat(el.getAttribute('x2') || 0);
      var y2 = parseFloat(el.getAttribute('y2') || 0);

    var origDash = el.getAttribute('stroke-dasharray');
    el.setAttribute('stroke-dasharray', len);
    el.setAttribute('stroke-dashoffset', len);
    var start = performance.now();
    (function tick(now) {
      var t = (now - start) / dur;
      if (t >= 1) {
        el.setAttribute('stroke-dashoffset', '0');
        if (origDash !== null) {
          el.setAttribute('stroke-dasharray', origDash);

    })(performance.now());

  function drawSimultaneous(list, dur, onDone) {

    var remaining = list.length;
    for (var i = 0; i < list.length; i++) {
      drawOne(list[i], dur, function() {
        remaining--;
        if (remaining <= 0 && onDone) onDone();
      });
    }
  }

  function drawSequence(list, dur, gap, onDone) {
    var i = 0;
    function tick() {
      if (i >= list.length) { if (onDone) onDone(); return; }
      drawOne(list[i], dur, function() { i++; setTimeout(tick, gap); });
    }
    tick();
  }

  // ── Normalise element references ───────────────────────────────────

  function asArray(elements) {
    if (!elements) return [];
    if (elements instanceof Array) return elements;
    return [elements];
  }

  function resolveGroup(name, groupMap) {
    var g = groupMap[name];
    return g !== undefined ? g : [];
  }

// ── Public API ─────────────────────────────────────────────────────
  // Run a sequence of animation phases for a card.
  window.HAL.anim.run = function(card, groupMap, onDone, defaults) {
    var phases = (card.animation && card.animation.phases) || defaults || [];
    executePhases(phases, groupMap, 0, onDone);
  };

  // ── Phase sequencer ────────────────────────────────────────────────

  function executePhases(phases, groupMap, idx, onDone) {
    if (idx >= phases.length) { if (onDone) onDone(); return; }
    var phase = phases[idx];

    var elements = [];
    if (phase.groups) {
      for (var gi = 0; gi < phase.groups.length; gi++) {
        var resolved = resolveGroup(phase.groups[gi], groupMap);
        if (resolved instanceof Array) {
          var ordered = applyOrder(resolved, phase.order);
          for (var ei = 0; ei < ordered.length; ei++) elements.push(ordered[ei]);
        } else {
          elements.push(resolved);
        }
      }
    }

    var fn = actions[phase.action];
    if (!fn) { if (onDone) onDone(); return; }

    phase._groupMap = groupMap;
    fn(elements, phase, function() {
      executePhases(phases, groupMap, idx + 1, onDone);
    });
  }

  // ── Order helpers ──────────────────────────────────────────────────

  function applyOrder(list, order) {
    if (!order || order === 'sequential') return list;
    if (order === 'simultaneous') return list;
    if (order === 'reverse') {
      var copy = [];
      for (var i = list.length - 1; i >= 0; i--) copy.push(list[i]);

    }
    return list;
  }

})();

<script>// ═══════════════════════════════════════════════════════════════════════
//  Curve-Family Chart Card
//  — Multi-band curve charts with config-driven animation
//  — Each band is a row (e.g. API-GATEWAY) containing multiple curves
//  — Brightness uses fg('frame', mult) and fg('data', mult)
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['curve-family'] = {

  render: function(data, onDone) {
    var svgEl = window.HAL.svg.getContainer(data);
    var vis = window.HAL_CONFIG.visual || {};
    var vc = vis.chart || {};
    var x0 = vc.x0 || 80, y0 = vc.y0 || 70;
    var cw = vc.w || 700, ch = vc.h || 520;
    var strokes = vc.strokes || [1.5, 1.0, 0.7];
    var dashes = vc.dashes || [null, "4,3", "1,3"];
    var titleFont = (vis.fonts || {}).title || 'sans-serif';
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var ns = window.HAL.svg.ns;
    var e = window.HAL.svg.el;

    var groupsData = data.groups || [];
    var nGroups = groupsData.length;
    if (nGroups === 0) { if (onDone) onDone(); return; }

    // Use actual data point count from fetched data (not vc.actualPts)
    // so VictoriaMetrics can return arbitrary-density points.
    var actualPts = (groupsData[0].series && groupsData[0].series[0] && groupsData[0].series[0].values)
      ? groupsData[0].series[0].values.length
      : (vc.actualPts || 9);
    if (actualPts < 2) { if (onDone) onDone(); return; }

    var margin = 60;
    var gridW = cw;
    var gridH = ch / nGroups;
    var bandH = gridH;
    var leftAxis = 80;
    var rightLabel = 140;

    // ── Group map — collected by the renderer for the animation engine ──
    var groupMap = {};
    var curveGroups = [];       // bands (one <g> per band)
    var minLabels = [];         // min value text elements
    var maxLabels = [];         // max value text elements
    var gridLines = [];         // horizontal grid lines (band separators)
    var verticalLines = [];     // vertical data column lines (sweep targets)
    var groupLabels = [];       // band/group name text elements

    // ── Card background ───────────────────────────────────────────────
    var bg = e('rect', { x: 0, y: 0, width: data.w || 1000, height: data.h || 750, fill: data.color });
    svgEl.appendChild(bg);

    // ── Header (title) ────────────────────────────────────────────────
    var header = e('text', {
      x: 20, y: 25, fill: fg('frame', 1.9), 'font-size': fs(14), 'font-family': labelFont,
      'text-rendering': 'optimizeLegibility',
    });
    header.textContent = (data.title || '') + '  ' + (data.label || '');
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // ── Grid + bands ──────────────────────────────────────────────────
    var gridG = e('g');
    svgEl.appendChild(gridG);
    var bandG = e('g');
    svgEl.appendChild(bandG);

    for (var gi = 0; gi < nGroups; gi++) {
      var g = groupsData[gi];
      var bandTop = gi * gridH;
      var series = g.series || [];

      // Band separator
      if (gi > 0) {
        gridLines.push(e('line', {
          x1: x0, y1: bandTop, x2: x0 + gridW, y2: bandTop,
          stroke: fg('frame', 0.2), 'stroke-width': 1,
        }));
      }

      // Fixed rows: find global max across all series in this band
      var bandMax = 1;
      for (var si = 0; si < series.length; si++) {
        var sv = series[si].values || [];
        for (var vi = 0; vi < sv.length; vi++) {
          if (sv[vi] > bandMax) bandMax = sv[vi];
        }
      }

      // Group label
      var glabel = e('text', {
        x: 15, y: bandTop + bandH / 2 + 4, fill: fg('frame', 1.0),
        'font-size': fs(11), 'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      });
      glabel.textContent = g.name;
      glabel.style.opacity = '0';
      svgEl.appendChild(glabel);
      groupLabels.push(glabel);

      // Data columns (vertical grid lines — sweep targets)
      for (var vi = 0; vi < actualPts; vi++) {
        var px = x0 + (vi / (actualPts - 1)) * gridW;
        verticalLines.push(e('line', {
          x1: px, y1: bandTop, x2: px, y2: bandTop + bandH,
          stroke: fg('frame', 0.12), 'stroke-width': 1,
        }));
      }

      // ── Container for this band's curves — hidden initially ─────────
      var grp = document.createElementNS(ns, 'g');
      grp.style.opacity = '0';
      bandG.appendChild(grp);

      // Draw each series
      for (var si = 0; si < series.length; si++) {
        var sv = series[si].values || [];
        var pathParts = [];
        for (var vi = 0; vi < sv.length && vi < actualPts; vi++) {
          var px = x0 + (vi / (actualPts - 1)) * gridW;
          var py = bandTop + bandH - (sv[vi] / bandMax) * (bandH - 20) - 10;
          pathParts.push((vi === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1));
        }

        var strokeW = strokes[si % strokes.length] || 1.0;
        var dash = dashes[si % dashes.length];
        var pathAttrs = {
          d: pathParts.join(' '),
          fill: 'none',
          stroke: fg('data', 0.5 + si * 0.25),
          'stroke-width': strokeW,
        };
        if (dash) pathAttrs['stroke-dasharray'] = dash;
        grp.appendChild(e('path', pathAttrs));

        // Endpoint dot + value label
        var last = sv[Math.min(sv.length, actualPts) - 1];
        var lx = x0 + gridW;
        var ly = bandTop + bandH - (last / bandMax) * (bandH - 20) - 10;

        grp.appendChild(e('circle', {
          cx: lx, cy: ly, r: 2.5, fill: fg('data', 0.65),
        }));

        var serLabel = e('text', {
          x: lx + 6, y: ly + 3, fill: fg('data', 0.65),
          'font-size': fs(10), 'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
        });
        serLabel.textContent = series[si].label;
        grp.appendChild(serLabel);

        // Find min/max for value labels
        var minVal = sv[0], maxVal = sv[0];
        var minIdx = 0, maxIdx = 0;
        for (var mvi = 1; mvi < sv.length; mvi++) {
          if (sv[mvi] < minVal) { minVal = sv[mvi]; minIdx = mvi; }
          if (sv[mvi] > maxVal) { maxVal = sv[mvi]; maxIdx = mvi; }
        }

        var mlx = x0 + (minIdx / (actualPts - 1)) * gridW;
        var mly = bandTop + bandH - (minVal / bandMax) * (bandH - 20) - 10;
        var mn = e('text', {
          x: mlx, y: mly - 12, fill: fg('data', 1.1), 'font-size': fs(14),
          'font-family': labelFont, 'text-anchor': 'middle', 'text-rendering': 'optimizeLegibility',
        });
        mn.style.opacity = '0';
        mn.textContent = minVal.toFixed(1);
        svgEl.appendChild(mn);
        minLabels.push(mn);

        var mlx2 = x0 + (maxIdx / (actualPts - 1)) * gridW;
        var mly2 = bandTop + bandH - (maxVal / bandMax) * (bandH - 20) - 10;
        var mx = e('text', {
          x: mlx2, y: mly2 - 12, fill: fg('data', 1.1), 'font-size': fs(14),
          'font-family': labelFont, 'text-anchor': 'middle', 'text-rendering': 'optimizeLegibility',
        });
        mx.style.opacity = '0';
        mx.textContent = maxVal.toFixed(1);
        svgEl.appendChild(mx);
        maxLabels.push(mx);
      }

      curveGroups.push(grp);
    }

    // Add grid lines (behind everything)
    gridG.style.opacity = '0';
    for (var gli = 0; gli < gridLines.length; gli++) {
      gridG.appendChild(gridLines[gli]);
    }
    // Vertical lines — stored as array for sequential draw sweep
    // so executePhases expands each child into its own element for drawOne.
    var verticalG = e('g');
    svgEl.insertBefore(verticalG, bandG);
    for (var vli = 0; vli < verticalLines.length; vli++) {
      verticalG.appendChild(verticalLines[vli]);
    }

    // ── Footer ────────────────────────────────────────────────────────
    var footer = e('text', {
      x: 15, y: 740, fill: fg('frame', 0.85), 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Build the group map for the animation engine ──────────────────
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.verticalLines = verticalLines;
    groupMap.grid = gridG;
    groupMap.groupLabels = groupLabels;
    groupMap.bands = curveGroups;
    groupMap.minValues = minLabels;
    groupMap.maxValues = maxLabels;

    // ── Start the animation ───────────────────────────────────────────
    var defaults = [
      { action: 'appear',     groups: ['header', 'footer', 'grid', 'groupLabels'] },
      { action: 'wait',       duration: window.HAL_CONFIG.timing.initialPause || 5000 },
      { action: 'flickerIn',  groups: ['bands'], order: 'sequential', gap: window.HAL_CONFIG.timing.groupGap },
      { action: 'wait',       duration: 2000 },
      { action: 'appear',     groups: ['minValues'] },
      { action: 'appear',     groups: ['maxValues'] },
      { action: 'wait',       duration: window.HAL_CONFIG.timing.valueHold || 5000 },
      { action: 'disappear',  groups: ['maxValues'] },
      { action: 'disappear',  groups: ['minValues'] },
      { action: 'flickerOut', groups: ['bands'], order: 'sequential', gap: window.HAL_CONFIG.timing.groupGap },
      { action: 'wait',       duration: 300 },
      { action: 'disappear',  groups: ['header', 'footer', 'grid', 'groupLabels'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },

};

          paneG.appendChild(e('line', {
            x1: x0, y1: top, x2: x0 + cw, y2: top,
            stroke: fg('frame', 0.2), 'stroke-width': 0.5,
          }));
        }

        // Series label (left side)
        paneG.appendChild(e('text', {
          x: x0 - 65, y: top + paneH / 2 + 4,
          fill: fg('frame', 1.0), 'font-size': fs(10),
          'font-family': labelFont, 'text-anchor': 'end',
          'text-rendering': 'optimizeLegibility',
          textContent: series[si].label,
        }));

        // Max value (right side)
        paneG.appendChild(e('text', {
          x: x0 + cw + 10, y: top + 14,
          fill: fg('data', 0.7), 'font-size': fs(9),
          'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
          textContent: maxVal.toFixed(1),
        }));

        // Baseline grid
        paneG.appendChild(e('line', {
          x1: x0, y1: top + paneH, x2: x0 + cw, y2: top + paneH,
          stroke: fg('frame', 0.15), 'stroke-width': 0.5,
        }));

        // Curve path
        var pathParts = [];
        for (var vi = 0; vi < sv.length && vi < actualPts; vi++) {
          var px = x0 + (vi / (actualPts - 1)) * cw;
          var py = top + paneH - (sv[vi] / maxVal) * (paneH - 8) - 4;
          pathParts.push((vi === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1));
        }
        paneG.appendChild(e('path', {
          d: pathParts.join(' '),
          fill: 'none',
          stroke: fg('data', 0.8),
          'stroke-width': 1.5,
        }));

        paneGroups.push(paneG);
        seriesIdx++;
      }
    }

    // Animation
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.bands = paneGroups;

    var defaults = [
      { action: 'appear',     groups: ['header', 'footer'] },
      { action: 'wait',       duration: 1000 },
      { action: 'appear',     groups: ['bands'], order: 'sequential', gap: 300 },
      { action: 'wait',       duration: 8000 },
      { action: 'disappear',  groups: ['bands'], order: 'sequential', gap: 200 },
      { action: 'wait',       duration: 300 },
      { action: 'disappear',  groups: ['header', 'footer'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Curve-Family 3D — Isometric 3D terrain of three load curves
//  — X axis: time (left→right at 30°)
//  — Y axis: load value (vertical)
//  — Z axis: depth (front→back at 150°)
//  — All axes are equally scaled (true isometric, no vanishing point)
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['curve-family-3d'] = {

  render: function(data, onDone) {
    var svgEl = window.HAL.svg.getContainer(data);
    var vis = window.HAL_CONFIG.visual || {};
    var vc = vis.chart || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;
    var e = window.HAL.svg.el;

    // Build flat series list and sort by numeric label
    var groupsData = data.groups || [];
    var allSeries = [];
    for (var gi = 0; gi < groupsData.length; gi++) {
      var series = (groupsData[gi].series || []);
      for (var si = 0; si < series.length; si++) {
        allSeries.push({ label: series[si].label, values: series[si].values || [] });
      }
    }
    // Sort by numeric label so Z-order places smallest value at back, largest at front
    allSeries.sort(function(a, b) {
      var na = parseInt(String(a.label).replace(/[^0-9]/g, ''), 10) || 0;
      var nb = parseInt(String(b.label).replace(/[^0-9]/g, ''), 10) || 0;
      return na - nb;
    });
    if (allSeries.length === 0) { if (onDone) onDone(); return; }

    // Use actual data point count from fetched data.
    var actualPts = allSeries[0].values.length;
    if (actualPts < 2) { if (onDone) onDone(); return; }

    var groupMap = {};
    var curveGroups = [];

    // Background
    svgEl.appendChild(e('rect', { x: 0, y: 0, width: data.w || 1000, height: data.h || 750, fill: data.color }));

    // Header / footer
    var header = e('text', { x: 20, y: 25, fill: fg('frame', 1.9), 'font-size': fs(14), 'font-family': labelFont, 'text-rendering': 'optimizeLegibility' });
    header.textContent = (data.title || '') + '  ' + (data.label || '');
    header.style.opacity = '0';
    svgEl.appendChild(header);

    var footer = e('text', { x: 15, y: 740, fill: fg('frame', 0.85), 'font-size': fs(10), 'font-family': labelFont, 'text-rendering': 'optimizeLegibility' });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // Global max
    var globalMax = 1;
    for (var si = 0; si < allSeries.length; si++) {
      for (var vi = 0; vi < allSeries[si].values.length; vi++) {
        if (allSeries[si].values[vi] > globalMax) globalMax = allSeries[si].values[vi];
      }
    }
    globalMax = Math.ceil(globalMax * 1.3);
    if (globalMax < 2) globalMax = 2;

    // ── True isometric projection ─────────────────────────────────
    // All three axes have equal step sizes, rotated 30° from horizontal.
    //   isoStep = pixel distance per data-unit along any axis
    //   xSp = isoStep * cos(30°) ≈ 0.866  (horizontal component, X → right)
    //   zSp = isoStep * cos(30°) ≈ 0.866  (horizontal component, Z → left)
    //   diagSp = isoStep * sin(30°) = isoStep * 0.5  (vertical component, both axes → up)
    //
    //   sx = ox + (px - pz) * xSp
    //   sy = oy - py * ySp + (px + pz) * diagSp

    var isoStep = Math.min(70, 650 / (actualPts - 1));  // base step per data unit
    var xSp = isoStep * 0.866;
    var diagSp = isoStep * 0.5;
    var ySp = ((actualPts - 1) * isoStep) / globalMax;  // Y-axis same length as X-axis

    function project(px, py, pz) {
      return {
        sx: ox + px * xSp - pz * zSp,
        sy: oy - py * ySp + px * diagSp + pz * zDiagSp,
      };
    }

    var nCurves = allSeries.length;

    // Z has only (nCurves - 1) steps vs X's (actualPts - 1) steps.
    // Scale zSp so total Z depth ≈ 45% of total X extent, giving visible separation.
    var totalX = (actualPts - 1) * xSp;
    var zSteps = Math.max(nCurves - 1, 1);
    var zSp = (totalX * 0.45) / zSteps;      // 45% of X span, spread across Z steps
    var zDiagSp = (totalX * 0.45 * 0.5) / zSteps;  // matching vertical component

    // Chart bounds in projection space (before scale/translate) — computed AFTER nCurves
    var chartLeft  = - (nCurves - 1) * zSp;
    var chartRight = (actualPts - 1) * xSp;
    var chartTop   = - globalMax * ySp;
    var chartBottom = (actualPts - 1) * diagSp + (nCurves - 1) * zDiagSp;
    var chartCX = (chartLeft + chartRight) / 2;
    var chartCY = (chartTop + chartBottom) / 2;
    var ox = 500 - chartCX;
    var oy = 375 - chartCY;

    // ── Scaled chart area (68% of original, centered) ─────────────────
    var chartArea = e('g');
    chartArea.setAttribute('transform', 'translate(500,375) scale(0.68) translate(-500,-375)');
    svgEl.appendChild(chartArea);

    // ── Isometric grid ────────────────────────────────────────────
    // Split into three groups so animation can target them separately:
    //   radialLines — lines from origin (draw radially)
    //   gridLines   — remaining floor + Z lines (sweep sequentially)
    //   labels      — all text (appear instantly)
    var radialLines = [];
    var gridLines = [];
    var labelElements = [];

    // Wrapper groups for correct paint order (no opacity — the animation
    // engine manages visibility via the arrays above).
    var radialG = e('g');
    chartArea.appendChild(radialG);
    var gridG = e('g');
    chartArea.appendChild(gridG);
    var labelsG = e('g');
    chartArea.appendChild(labelsG);

    // Floor grid: X-Z plane at y=0
    // Lines along X axis (time) at each Z depth
    for (var zi = 0; zi < nCurves - 1; zi++) {
      var pL = project(0, 0, zi);
      var pR = project(actualPts - 1, 0, zi);
      var line = e('line', {
        x1: pL.sx, y1: pL.sy, x2: pR.sx, y2: pR.sy,
        stroke: fg('frame', 0.55 - zi * 0.1), 'stroke-width': 0.7 - zi * 0.15,
      });
      (zi === 0 ? radialG : gridG).appendChild(line);
      (zi === 0 ? radialLines : gridLines).push(line);
    }
    // Last Z baseline
    var pL = project(0, 0, nCurves - 1);
    var pR = project(actualPts - 1, 0, nCurves - 1);
    var lastBase = e('line', {
      x1: pL.sx, y1: pL.sy, x2: pR.sx, y2: pR.sy,
      stroke: fg('frame', 0.25), 'stroke-width': 0.4,
    });
    gridG.appendChild(lastBase);
    gridLines.push(lastBase);

    // Lines along Z axis at each time step
    for (var vi = 0; vi < actualPts; vi++) {
      var pF = project(vi, 0, 0);
      var pB = project(vi, 0, nCurves - 1);
      var line = e('line', {
        x1: pF.sx, y1: pF.sy, x2: pB.sx, y2: pB.sy,
        stroke: fg('frame', 0.5 - 0.1 * (vi / actualPts)), 'stroke-width': 0.5,
      });
      (vi === 0 ? radialG : gridG).appendChild(line);
      (vi === 0 ? radialLines : gridLines).push(line);
      // Time step label at the front edge
      var tsLabel = e('text', {
        x: pF.sx - 6, y: pF.sy + 14,
        fill: fg('frame', 0.35),
        'font-size': fs(7),
        'font-family': labelFont, 'text-anchor': 'middle',
        'text-rendering': 'optimizeLegibility',
        textContent: vi,
      });
      labelsG.appendChild(tsLabel);
      labelElements.push(tsLabel);
    }

    // X-axis label at the far end of the front baseline
    var pXLabel = project(actualPts - 1, 0, 0);
    var xLabel = e('text', {
      x: pXLabel.sx, y: pXLabel.sy + 22,
      fill: fg('frame', 0.45),
      'font-size': fs(8),
      'font-family': labelFont, 'text-anchor': 'middle',
      'text-rendering': 'optimizeLegibility',
      textContent: 'STEP',
    });
    labelsG.appendChild(xLabel);
    labelElements.push(xLabel);

    // Y-axis label at the top of the reference line
    var pYLabel = project(0, globalMax, 0);
    var yLabel = e('text', {
      x: pYLabel.sx - 16, y: pYLabel.sy + 3,
      fill: fg('frame', 0.5),
      'font-size': fs(8),
      'font-family': labelFont, 'text-anchor': 'end',
      'text-rendering': 'optimizeLegibility',
      textContent: 'LOAD',
    });
    labelsG.appendChild(yLabel);
    labelElements.push(yLabel);

    // Vertical Y-axis reference at the front-left corner (from origin = radial)
    var pY0 = project(0, 0, 0);
    var pY1 = project(0, globalMax, 0);
    var yLine = e('line', {
      x1: pY0.sx, y1: pY0.sy, x2: pY1.sx, y2: pY1.sy,
      stroke: fg('frame', 0.7), 'stroke-width': 1.5,
    });
    radialG.appendChild(yLine);
    radialLines.push(yLine);

    // Y-axis tick labels
    for (var li = 0; li <= 3; li++) {
      var lv = (globalMax / 3) * li;
      var pt = project(0, lv, 0);
      var tickLabel = e('text', {
        x: pt.sx - 10, y: pt.sy + 3,
        fill: fg('frame', 0.6),
        'font-size': fs(8),
        'font-family': labelFont, 'text-anchor': 'end',
        'text-rendering': 'optimizeLegibility',
        textContent: lv.toFixed(1),
      });
      labelsG.appendChild(tickLabel);
      labelElements.push(tickLabel);
    }

    // ── Curves ────────────────────────────────────────────────────
    for (var si = 0; si < nCurves; si++) {
      var sv = allSeries[si].values;
      if (sv.length === 0) continue;

      var isFront = (si === 0);
      var grp = e('g');
      grp.style.opacity = '0';
      chartArea.appendChild(grp);

      // Project all data points
      var pts = [];
      for (var vi = 0; vi < sv.length && vi < actualPts; vi++) {
        var p = project(vi, sv[vi], si);
        pts.push({ sx: p.sx, sy: p.sy, val: sv[vi] });
      }
      if (pts.length === 0) continue;

      // Drop-lines to the floor
      for (var pi = 0; pi < pts.length; pi++) {
        var base = project(pi, 0, si);
        grp.appendChild(e('line', {
          x1: base.sx, y1: base.sy, x2: pts[pi].sx, y2: pts[pi].sy,
          stroke: fg('data', isFront ? 0.25 : 0.08 + si * 0.04),
          'stroke-width': isFront ? 0.6 : 0.3,
        }));
      }

      // Data point markers
      for (var pi = 0; pi < pts.length; pi++) {
        grp.appendChild(e('circle', {
          cx: pts[pi].sx, cy: pts[pi].sy,
          r: isFront ? 3.5 : 2.0 - si * 0.3,
          fill: fg('data', 1.0 - si * 0.2),
        }));
      }

      // Curve path
      var pathD = '';
      for (var pi = 0; pi < pts.length; pi++) {
        pathD += (pi === 0 ? 'M' : 'L') + pts[pi].sx.toFixed(1) + ',' + pts[pi].sy.toFixed(1);
      }
      grp.appendChild(e('path', {
        d: pathD,
        fill: 'none',
        stroke: fg('data', 1.0 - si * 0.28),
        'stroke-width': 4.0 - si * 0.9,
      }));

      // Endpoint + label
      var last = pts[pts.length - 1];
      grp.appendChild(e('circle', {
        cx: last.sx, cy: last.sy,
        r: isFront ? 5 : 3 - si * 0.5,
        fill: fg('data', 1.0 - si * 0.15),
      }));
      grp.appendChild(e('text', {
        x: last.sx + 8, y: last.sy + 4,
        fill: fg('data', 1.0 - si * 0.2),
        'font-size': fs(isFront ? 12 : 9 - si),
        'font-family': labelFont,
        'text-rendering': 'optimizeLegibility',
        textContent: last.val.toFixed(2),
      }));

      // High / Low labels
      var highIdx = 0, lowIdx = 0;
      for (var pi = 1; pi < pts.length; pi++) {
        if (pts[pi].val > pts[highIdx].val) highIdx = pi;
        if (pts[pi].val < pts[lowIdx].val) lowIdx = pi;
      }
      if (highIdx !== lowIdx) {
        var hp = pts[highIdx], lp = pts[lowIdx];
        // High — short horizontal tick + label
        grp.appendChild(e('line', {
          x1: hp.sx - 8, y1: hp.sy, x2: hp.sx + 8, y2: hp.sy,
          stroke: fg('data', 1.0 - si * 0.15), 'stroke-width': 1.5,
        }));
        var ht = e('text', {
          x: hp.sx + 12, y: hp.sy,
          fill: fg('data', 1.0 - si * 0.15),
          'font-size': fs(isFront ? 15 : 12),
          'font-family': labelFont,
        });
        ht.textContent = 'H ' + hp.val.toFixed(1);
        grp.appendChild(ht);
        // Low — short horizontal tick + label
        grp.appendChild(e('line', {
          x1: lp.sx - 8, y1: lp.sy, x2: lp.sx + 8, y2: lp.sy,
          stroke: fg('data', 1.0 - si * 0.15), 'stroke-width': 1.5,
        }));
        var lt = e('text', {
          x: lp.sx + 12, y: lp.sy + 4,
          fill: fg('data', 1.0 - si * 0.15),
          'font-size': fs(isFront ? 15 : 12),
          'font-family': labelFont,
        });
        lt.textContent = 'L ' + lp.val.toFixed(1);
        grp.appendChild(lt);
      }

      // Connection to next curve (mesh surface)
      if (si < nCurves - 1) {
        var nextSv = allSeries[si + 1].values;
        for (var vi = 1; vi < sv.length && vi < actualPts; vi++) {
          var pA = project(vi, sv[vi], si);
          var pA0 = project(vi - 1, sv[vi - 1], si);
          var pB = project(vi, nextSv[Math.min(vi, nextSv.length - 1)], si + 1);
          var pB0 = project(vi - 1, nextSv[Math.min(vi - 1, nextSv.length - 1)], si + 1);
          // Triangle A
          grp.appendChild(e('polygon', {
            points: [
              pA0.sx.toFixed(1) + ',' + pA0.sy.toFixed(1),
              pA.sx.toFixed(1) + ',' + pA.sy.toFixed(1),
              pB.sx.toFixed(1) + ',' + pB.sy.toFixed(1),
            ].join(' '),
            fill: fg('data', 0.06 + si * 0.03),
            stroke: fg('frame', 0.04), 'stroke-width': 0.3,
          }));
          // Triangle B
          if (vi - 1 < nextSv.length && vi < nextSv.length) {
            grp.appendChild(e('polygon', {
              points: [
                pA0.sx.toFixed(1) + ',' + pA0.sy.toFixed(1),
                pB.sx.toFixed(1) + ',' + pB.sy.toFixed(1),
                pB0.sx.toFixed(1) + ',' + pB0.sy.toFixed(1),
              ].join(' '),
              fill: fg('data', 0.06 + si * 0.03),
              stroke: fg('frame', 0.04), 'stroke-width': 0.3,
            }));
          }
        }
      }

      curveGroups.push(grp);
    }

    // ── Series labels at start of each Z baseline ──
    for (var si = 0; si < nCurves; si++) {
      var p = project(0, 0, si);
      var sx = 500 + (p.sx - 500) * 0.68;
      var sy = 375 + (p.sy - 375) * 0.68;
      if (isNaN(sx) || isNaN(sy)) { sx = 10; sy = 80 + si * 25; }
      var t = e('text', {
        x: sx - 40, y: sy + 4,
        fill: '#ffffff',
        'font-size': '16',
        'font-family': 'monospace',
        'font-weight': 'bold',
        'text-rendering': 'optimizeLegibility',
      });
      t.textContent = String(allSeries[si].label || '--');
      svgEl.appendChild(t);
      labelElements.push(t);
    }

    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.radialLines = radialLines;
    groupMap.gridLines = gridLines;
    groupMap.labels = labelElements;
    groupMap.bands = curveGroups;

    var defaults = [
      { action: 'draw',    groups: ['radialLines'],               duration: 500 },
      { action: 'draw',    groups: ['gridLines'],  order: 'sequential', gap: 60, duration: 250 },
      { action: 'appear',  groups: ['labels'] },
      { action: 'wait',    duration: 500 },
      { action: 'appear',  groups: ['header', 'footer'] },
      { action: 'wait',    duration: 500 },
      { action: 'appear',  groups: ['bands'], order: 'sequential', gap: 400 },
      { action: 'wait',    duration: 8000 },
      { action: 'disappear', groups: ['bands'], order: 'sequential', gap: 200 },
      { action: 'wait',    duration: 300 },
      { action: 'disappear', groups: ['radialLines', 'gridLines', 'labels', 'header', 'footer'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Tabular Chart Card
//  — Displays structured label/value data rows
//  — Each row is a { label, value } pair; rows can be grouped visually
//  — Animation groups: header, footer, separators, rows
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards.tabular = {

  render: function(data, onDone) {
    var svgEl = window.HAL.svg.getContainer(data);
    var vis = window.HAL_CONFIG.visual || {};
    var titleFont = (vis.fonts || {}).title || 'sans-serif';
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var dataFont = (vis.fonts || {}).data || labelFont;
    var e = window.HAL.svg.el;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var rows = (data.rows || []);
    if (rows.length === 0) { if (onDone) onDone(); return; }

    // ── Card background ───────────────────────────────────────────────
    var bg = e('rect', { x: 0, y: 0, width: data.w || 1000, height: data.h || 750, fill: data.color });
    svgEl.appendChild(bg);

    // ── Layout ────────────────────────────────────────────────────────
    var hPad = 40;           // horizontal padding from left edge
    var rowH = 48;           // height per row
    var sepH = 2;            // separator height
    var labelX = hPad;       // label column X
    var valueX = 900;        // value column X (right-aligned)
    var startY = 90;         // first row Y
    var labelW = valueX - labelX - 20;  // width available for label text

    // ── Header ────────────────────────────────────────────────────────
    var header = e('text', {
      x: hPad, y: 45, fill: fg('frame', 1.9), 'font-size': fs(14),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
    });
    header.textContent = (data.title || '') + '  ' + (data.label || '');
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // ── Footer ────────────────────────────────────────────────────────
    var footer = e('text', {
      x: hPad, y: 735, fill: fg('frame', 0.85), 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Rows ──────────────────────────────────────────────────────────
    var rowElements = [];
    var separators = [];

    for (var i = 0; i < rows.length; i++) {
      var rowY = startY + i * rowH;

      // Row container (hidden initially for animation)
      var rowG = document.createElementNS(window.HAL.svg.ns, 'g');
      rowG.style.opacity = '0';

      // Separator line (not hidden — part of the background grid)
      if (i > 0) {
        var sep = e('line', {
          x1: hPad, y1: rowY - rowH / 2, x2: 960, y2: rowY - rowH / 2,
          stroke: fg('frame', 0.2), 'stroke-width': 1,
        });
        sep.style.opacity = '0';
        svgEl.appendChild(sep);
        separators.push(sep);
      }

      // Label
      var label = e('text', {
        x: labelX, y: rowY + 4, fill: fg('frame', 1.5), 'font-size': fs(18),
        'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      });
      label.textContent = rows[i].label;
      rowG.appendChild(label);

      // Value
      var valStr = String(rows[i].value);
      var val = e('text', {
        x: valueX, y: rowY + 4, fill: fg('data', 1.1), 'font-size': fs(20),
        'font-family': dataFont, 'text-anchor': 'end', 'text-rendering': 'optimizeLegibility',
      });
      val.textContent = valStr;
      rowG.appendChild(val);

      svgEl.appendChild(rowG);
      rowElements.push(rowG);
    }

    // ── Group map for animation engine ────────────────────────────────
    var groupMap = {};
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.separators = separators;
    groupMap.rows = rowElements;

    // ── Start the animation ───────────────────────────────────────────
    var defaults = [
      { action: 'appear',     groups: ['header', 'footer', 'separators'] },
      { action: 'wait',       duration: 1000 },

<script>// ═══════════════════════════════════════════════════════════════════════
//  Wireframe 3D HUD Chart Card

window.HAL.cards = window.HAL.cards || {};

  render: function(data, onDone) {
    var svgEl = window.HAL.svg.getContainer(data);
    var vis = window.HAL_CONFIG.visual || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var e = window.HAL.svg.el;
    var ns = window.HAL.svg.ns;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var objects = (data.objects || []);
    var connections = (data.connections || []);

    // ── Perspective projection helpers ─────────────────────────────────
    // Simple isometric-like projection: flatten 3D (x,y,z) to 2D (px,py)
    var cx = 500, cy = 380;  // vanishing / centre point
    var scale = 60;

    function project(x, y, z) {
      // Tilted perspective: x→right, y→depth (up on screen), z→up
      var px = cx + x * scale - y * scale * 0.3;
      var py = cy - z * scale + y * scale * 0.3;
      return { x: px, y: py, z: y };
    }

    // Background
    svgEl.appendChild(e('rect', { x: 0, y: 0, width: data.w || 1000, height: data.h || 750, fill: data.color }));

    // ── Header ────────────────────────────────────────────────────────

    var footer = e('text', {
      x: 20, y: 735, fill: fg('frame', 0.85), 'font-size': fs(10),

    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Perspective grid ──────────────────────────────────────────────
    var gridG = e('g');
    svgEl.appendChild(gridG);
    var gridLines = [];
    var clamp = 350;

    // Horizontal grid lines (depth bands)
    for (var d = -4; d <= 4; d++) {
      if (d === 0) continue;
      var p1 = project(-4, d, -3);
      var p2 = project(4, d, -3);
      if (p1.z < 0 || p2.z < 0) continue;
      gridLines.push(e('line', {

        stroke: fg('frame', 0.3), 'stroke-width': 0.5,

      p1 = project(-4, d, 3);
      p2 = project(4, d, 3);
      if (p1.z < 0 || p2.z < 0) continue;
      gridLines.push(e('line', {
        x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,

      var dx = Math.cos(rad) * 4;
      var dy = Math.sin(rad) * 4;
      var p0 = project(0, 0, 0);
      var p1 = project(dx, dy, 0);
      if (p1.z < 0) continue;
      gridLines.push(e('line', {
        x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y,
        stroke: fg('frame', 0.15), 'stroke-width': 0.5,
      }));
    }

    // Orbital rings (ellipses in perspective)
    for (var r = 1; r <= 3; r++) {
      var pathD = '';
      for (var a = 0; a <= 360; a += 10) {
        var rad = a * Math.PI / 180;
        var dx = Math.cos(rad) * r;
        var dy = Math.sin(rad) * r;

          stroke: fg('frame', 0.25), 'stroke-width': 0.5,

      }
    }

    gridG.style.opacity = '0';
    for (var gli = 0; gli < gridLines.length; gli++) {

      var o1 = objects[fr];
      var o2 = objects[to];
      var p1 = project(o1.x, o1.y, o1.z);
      var p2 = project(o2.x, o2.y, o2.z);
      var line = e('line', {
        x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
        stroke: fg('data', 0.38), 'stroke-width': 0.8,

      connG.appendChild(line);
      connElements.push(line);
    }

    // ── Data points ───────────────────────────────────────────────────
    var pointElements = [];
    var ptG = e('g');
    svgEl.appendChild(ptG);

    for (var oi = 0; oi < objects.length; oi++) {

      // Point marker (crosshair/diamond)

      grp.appendChild(e('circle', {
        cx: p.x, cy: p.y, r: size, fill: fg('data', 0.88),

      // Glow ring
      grp.appendChild(e('circle', {
        cx: p.x, cy: p.y, r: size + 3, fill: 'none',
        stroke: fg('data', 0.32), 'stroke-width': 1,
      }));

      // Label
      var lbl = e('text', {
        x: p.x + 10, y: p.y + 3,
        fill: fg('frame', 1.5), 'font-size': fs(10),
        'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      });
      lbl.textContent = obj.label || '';
      grp.appendChild(lbl);

      ptG.appendChild(grp);
      pointElements.push(grp);
    }

    // ── Group map ─────────────────────────────────────────────────────
    var groupMap = {};
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.grid = gridG;
    groupMap.connections = connG;
    groupMap.dataPoints = pointElements;

    // ── Animation ─────────────────────────────────────────────────────
    var defaults = [
      { action: 'appear',     groups: ['header', 'footer', 'grid'] },
      { action: 'wait',       duration: 1000 },
      { action: 'appear',     groups: ['connections'], order: 'simultaneous' },
      { action: 'wait',       duration: 600 },
      { action: 'appear',     groups: ['dataPoints'], order: 'sequential', gap: 400 },

      { action: 'disappear',  groups: ['connections'], order: 'simultaneous' },
      { action: 'wait',       duration: 300 },
      { action: 'disappear',  groups: ['header', 'footer', 'grid'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },

<script>// ═══════════════════════════════════════════════════════════════════════

//  Polar / Cyclic Chart Card

//  — Cyclic data renderer: concentric rings, radial spokes, data polygons

//  — Spoke count = values length of first series (any cyclic data fits)

//  — Reads series from data.groups[0].series, fallback to data.series

//  — Config-driven: color gradients, arcs with ticks, connector lines, legend

//  — Animation groups: header, footer, rings, spokes, dataPolygons, arcs, legend

// ═══════════════════════════════════════════════════════════════════════



window.HAL = window.HAL || {};

window.HAL.cards = window.HAL.cards || {};



window.HAL.cards['polar'] = {



  render: function(data, onDone) {

    var svgEl = window.HAL.svg.getContainer(data);

    var vis = window.HAL_CONFIG.visual || {};

    var vc = vis.chart || {};

    var labelFont = (vis.fonts || {}).label || 'monospace';

    var e = window.HAL.svg.el;

    var ns = window.HAL.svg.ns;

    var fg = window.HAL.svg.fg;

    var fs = window.HAL.svg.fs;



    var groupsData = data.groups || [];

    var series = (groupsData.length > 0 && groupsData[0].series)

      ? groupsData[0].series

      : (data.series || []);



    if (series.length === 0) { if (onDone) onDone(); return; }



    // ── Layout ────────────────────────────────────────────────────────

    var cx = data.cx || vc.cx || 500;

    var cy = data.cy || vc.cy || 400;

    var maxR = data.maxR || vc.maxR || 260;

    var minR = data.minR || vc.minR || 30;

    var radius = maxR - minR;



    var nSpokes = (series[0].values || []).length;

    if (nSpokes < 2) { if (onDone) onDone(); return; }

    var angleStep = (2 * Math.PI) / nSpokes;



    var spokeLabels = data.labels || [];



    // Value range

    var valMin = data.valMin;

    var valMax = data.valMax;

    if (valMin == null || valMax == null) {

      valMin = Infinity; valMax = -Infinity;

      for (var si = 0; si < series.length; si++) {

        var sv = series[si].values || [];

        for (var vi = 0; vi < sv.length; vi++) {

          if (sv[vi] != null) {

            if (sv[vi] < valMin) valMin = sv[vi];

            if (sv[vi] > valMax) valMax = sv[vi];

          }

        }

      }

    }

    // Add 15% padding so data points don't sit directly on minR/maxR
    var pad = (valMax - valMin) * 0.15 || 1.5;
    valMin -= pad;

    function valToR(v) {

    }

    for (var vi = 0; vi < nSpokes; vi++) {

      var vals = [];

      for (var si = 0; si < series.length; si++) {

        var sv = series[si].values || [];

        if (vi < sv.length && sv[vi] != null) vals.push(sv[vi]);

      }

      if (vals.length === 0) {

        spokeStats.push({ min: valMin, max: valMax, avg: (valMin+valMax)/2, mean: (valMin+valMax)/2 });

        continue;

      }

      vals.sort(function(a,b){return a-b;});

      var sum = 0;

      for (var i = 0; i < vals.length; i++) sum += vals[i];

      var avg = sum / vals.length;

      var mid = Math.floor(vals.length / 2);

      var mean = vals.length % 2 === 0 ? (vals[mid-1] + vals[mid]) / 2 : vals[mid];

      spokeStats.push({

        min: vals[0],

        max: vals[vals.length - 1],

        avg: avg,

    for (var vi = 0; vi < nSpokes; vi++) {

      if (spokeStats[vi].min < globalMin) globalMin = spokeStats[vi].min;

      if (spokeStats[vi].max > globalMax) globalMax = spokeStats[vi].max;

      globalAvgSum += spokeStats[vi].avg;

      globalAvgN++;

    }

    var globalAvg = globalAvgSum / globalAvgN;



    // ── Card background ───────────────────────────────────────────────

    svgEl.appendChild(e('rect', {

      x: 0, y: 0, width: data.w || 1000, height: data.h || 750,

      fill: data.color

    // ── Header ────────────────────────────────────────────────────────

    var headerFont = (vis.fonts || {}).title || labelFont;

    var headerSize = data.titleSize || 14;

      x: data.titleX || 20, y: data.titleY || 25,

    });

    header.textContent = (data.title || '') + '  ' + (data.label || '');

    header.style.opacity = '0';

    svgEl.appendChild(header);



    var subtitle = null;

    if (data.subtitle) {

      var subSize = data.subSize || 9;

      subtitle = e('text', {

        x: data.titleX || 20, y: (data.titleY || 25) + 20,

        fill: fg('frame', 0.85), 'font-size': fs(subSize),

        'font-family': labelFont, 'text-rendering': 'optimizeLegibility',

      });

      subtitle.textContent = data.subtitle;

      subtitle.style.opacity = '0';

      svgEl.appendChild(subtitle);

    }



    var footer = e('text', {

      x: 20, y: 735, fill: fg('frame', 0.85), 'font-size': fs(10),

      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',

    });

    footer.textContent = data.label || '';

    footer.style.opacity = '0';

    svgEl.appendChild(footer);



    // ── Polar→cartesian helper ────────────────────────────────────────

    function polar(r, angle) {

    var nRings = data.rings || 5;

      var ringColor = isOuter ? (data.outerRingColor || 'rgba(255,255,255,0.35)') : (data.ringColor || fg('frame', 0.08 + ri * 0.03));

      var ringWidth = ri === 0 ? (data.ringWidth0 || 0.3) : (data.ringWidth || 0.5);

      var ring = e('path', {

        d: pathD, fill: 'none', stroke: ringColor, 'stroke-width': ringWidth,

      });

      svgEl.appendChild(ring);

      ringElements.push(ring);



      if (ri > 0 && data.scaleLabels !== false) {

        var ringVal = valMin + (ri / nRings) * valRange;

        var lblP = polar(ringR, 0);

        var sl = e('text', {

          x: lblP.x + 4, y: lblP.y + 3,

        });

        sl.style.opacity = '0';



        scaleLabels.push(sl);

      }

    }



    // ── Spokes ────────────────────────────────────────────────────────

    var spokeElements = [];
    var monthLabelElements = [];



    var prevLabelIdx = -1;
    for (var si = 0; si < nSpokes; si++) {

        'stroke-width': data.spokeWidth || 0.3,

      });

      spoke.style.opacity = '0';

      svgEl.appendChild(spoke);

      spokeElements.push(spoke);



      var labelOffset = data.labelOffset || 22;

      var lp = polar(maxR + labelOffset, angle);

      var lblText = '';

      if (spokeLabels.length > 0 && spokeLabels.length !== nSpokes) {

        lblText = spokeLabels[labelIdx] || '';

      } else {

      }

    }

    for (var si = 0; si < scaleLabels.length; si++) svgEl.appendChild(scaleLabels[si]);
    for (var mi = 0; mi < monthLabelElements.length; mi++) svgEl.appendChild(monthLabelElements[mi]);

    // ── Per-year color palette ────────────────────────────────────────

    var colors = data.colors;

    if (!colors || colors.length === 0) {

      var n = series.length;

      colors = [];

      var coolColor = data.coolColor || { r: 100, g: 180, b: 255 };

      var warmColor = data.warmColor || { r: 255, g: 180, b: 80 };
