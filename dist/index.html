            x: lx, y: ly + 3, fill: fg('frame', 1.5), 'font-size': fs(9),
            'font-family': labelFont, 'text-anchor': 'middle', 'text-rendering': 'optimizeLegibility',
          });
          label.textContent = seg.name;
          ringG.appendChild(label);
        }
      }
      ringElements.push(ringG);
    }

    // ── Animation ─────────────────────────────────────────────────
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.rings = ringElements;

    var defaults = [
      { action: 'appear',    groups: ['header', 'footer'] },
      { action: 'wait',      duration: 500 },
      { action: 'appear',    groups: ['rings'], order: 'sequential', gap: 300 },
      { action: 'wait',      duration: 8000 },
      { action: 'disappear', groups: ['rings'], order: 'reverse', gap: 200 },
      { action: 'wait',      duration: 300 },
      { action: 'disappear', groups: ['header', 'footer'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Streamgraph Chart Card
//  — Flowing stacked ribbons centred on a baseline
//  — Each series is a smooth filled ribbon
//  — Animation groups: header, footer, ribbons
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['streamgraph'] = {

  render: function(data, onDone) {
    var svgEl = window.HAL.svg.getContainer(data);
    var vis = window.HAL_CONFIG.visual || {};
    var vc = vis.chart || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var e = window.HAL.svg.el;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var series = (data.series || []);
    if (series.length === 0) { if (onDone) onDone(); return; }

    // Use actual data point count from first series.
    var actualPts = series[0].values ? series[0].values.length : 20;
    if (actualPts < 2) { if (onDone) onDone(); return; }

    var groupMap = {};
    var ribbonGroups = [];

    // Layout
    var x0 = 80, y0 = 80, cw = 840, ch = 560;

    // Background
    svgEl.appendChild(e('rect', { x: 0, y: 0, width: data.w || 1000, height: data.h || 750, fill: data.color }));

    // Header
    var header = e('text', {
      x: 20, y: 25, fill: fg('frame', 1.9), 'font-size': fs(14),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
    });
    header.textContent = (data.title || '') + '  ' + (data.label || '');
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // Footer
    var footer = e('text', {
      x: 15, y: 740, fill: fg('frame', 0.85), 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Process data ──────────────────────────────────────────────
    // Extract and pad all series to actualPts
    var allVals = [];
    var maxVal = 0;
    for (var si = 0; si < series.length; si++) {
      var sv = series[si].values || [];
      var padded = [];
      for (var vi = 0; vi < actualPts; vi++) {
        var v = (vi < sv.length) ? Math.max(0, sv[vi]) : 0;
        padded.push(v);
        if (v > maxVal) maxVal = v;
      }
      allVals.push(padded);
    }
    if (maxVal === 0) maxVal = 1;

    // Stack values for centered baseline
    // Each layer: top = sum of all layers up to this one, bottom = sum of all layers below
    // Then shift everything so center = 0
    var layers = [];
    var totalStack = [];
    for (var vi = 0; vi < actualPts; vi++) {
      var t = 0;
      for (var si = 0; si < series.length; si++) t += allVals[si][vi];
      totalStack.push(t);
    }

    // Find global max stack for scaling
    var maxStack = 0;
    for (var vi = 0; vi < actualPts; vi++) {
      if (totalStack[vi] > maxStack) maxStack = totalStack[vi];
    }

    var yScale = (ch - 40) / (maxStack || 1);

    // Build layer paths
    // Each layer is a ribbon: top edge and bottom edge forming a closed path
    var layerPaths = [];
    for (var si = 0; si < series.length; si++) {
      var top = [];
      var bottom = [];
      // Calculate cumulative layers for this series
      var prevB = 0;
      for (var vi = 0; vi < actualPts; vi++) {
        var b = prevB;
        prevB += allVals[si][vi];
        // For centered streamgraph: bottom offset = b - totalStack[vi]/2
        var center = -totalStack[vi] / 2;
        var tb = (b + center) * yScale;
        var tt = (b + allVals[si][vi] + center) * yScale;
        var px = x0 + (vi / (actualPts - 1)) * cw;
        top.push({ x: px, y: y0 + ch / 2 + tt });
        bottom.push({ x: px, y: y0 + ch / 2 + tb });
      }

      // Layer data in correct order for polygon fill
      var pts = [];
      for (var pi = 0; pi < top.length; pi++) pts.push(top[pi]);
      for (var pi = top.length - 1; pi >= 0; pi--) pts.push(bottom[pi]);

      layerPaths.push({ points: pts, label: series[si].label || '' });
    }

    // ── Render ribbons ────────────────────────────────────────────
    // Draw in reverse (back to front) so first series is on top
    // applyOrder handles reversal
    for (var si = 0; si < series.length; si++) {
      var li = series.length - 1 - si;  // draw back layers first
      var layer = layerPaths[li];

      // Build SVG path with smooth (quadratic) curves
      // Use simple linear interpolation for now (fast, reliable)
      var pathD = '';
      for (var pi = 0; pi < layer.points.length; pi++) {
        var pt = layer.points[pi];
        pathD += (pi === 0 ? 'M ' : ' L ') + pt.x.toFixed(1) + ',' + pt.y.toFixed(1);
      }
      pathD += ' Z';

      var ribbonG = e('g');
      ribbonG.style.opacity = '0';
      var opacity = 0.55 + (li / series.length) * 0.35;
      var strokeOp = 0.2 + (li / series.length) * 0.3;
      ribbonG.appendChild(e('path', {
        d: pathD,
        fill: fg('data', opacity),
        stroke: fg('data', strokeOp),
        'stroke-width': 0.5,
      }));

      // End label
      var lastPt = layer.points[Math.floor(layer.points.length / 2)];
      var label = e('text', {
        x: lastPt.x + 8, y: lastPt.y + 3, fill: fg('data', 1.0),
        'font-size': fs(10), 'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      });
      label.textContent = layer.label;
      ribbonG.appendChild(label);

      svgEl.appendChild(ribbonG);
      ribbonGroups.push(ribbonG);
    }

    // ── Animation ─────────────────────────────────────────────────
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.ribbons = ribbonGroups;

    var defaults = [
      { action: 'appear',    groups: ['header', 'footer'] },
      { action: 'wait',      duration: 800 },
      { action: 'appear',    groups: ['ribbons'], order: 'sequential', gap: 400 },
      { action: 'wait',      duration: 8000 },
      { action: 'disappear', groups: ['ribbons'], order: 'reverse', gap: 250 },
      { action: 'wait',      duration: 300 },
      { action: 'disappear', groups: ['header', 'footer'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Hierarchical Edge Bundling Card
//  — Nodes arranged on a circle, curved connections bundled by hierarchy
//  — Connections between sibling sub-trees share more path = bundled
//  — Animation groups: header, footer, nodes, connections
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['edge-bundling'] = {

  render: function(data, onDone) {
    var svgEl = window.HAL.svg.getContainer(data);
    var vis = window.HAL_CONFIG.visual || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var e = window.HAL.svg.el;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var tree = data.tree;
    var connections = (data.connections || []);
    if (!tree || connections.length === 0) { if (onDone) onDone(); return; }

    var groupMap = {};
    var nodeElements = [];
    var connectionElements = [];

    // Layout
    var cx = 500, cy = 390;
    var nodeRadius = 250;  // circle radius for leaf nodes
    var bundleR = 120;     // inner radius for bundling (control point orbit)
    var dotR = 5;

    // Background
    svgEl.appendChild(e('rect', { x: 0, y: 0, width: data.w || 1000, height: data.h || 750, fill: data.color }));

    // Header
    var header = e('text', {
      x: 20, y: 25, fill: fg('frame', 1.9), 'font-size': fs(14),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
    });
    header.textContent = (data.title || '') + '  ' + (data.label || '');
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // Footer
    var footer = e('text', {
      x: 15, y: 740, fill: fg('frame', 0.85), 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Flatten hierarchy ─────────────────────────────────────────
    // Build node index with depth-first leaf order
    var leaves = [];
    var nodeById = {};

    function walk(node, depth, path) {
      var id = node.name;
      nodeById[id] = { node: node, depth: depth, path: path, children: [] };
      var kids = node.children || [];
      if (kids.length === 0) {
        leaves.push(id);
        return id;
      }
      for (var i = 0; i < kids.length; i++) {
        var childLeaf = walk(kids[i], depth + 1, path.concat(id));
        nodeById[id].children.push(childLeaf);
      }
      return nodeById[id].children[0]; // first leaf underneath
    }

    walk(tree, 0, []);
    var nLeaves = leaves.length;
    if (nLeaves === 0) { if (onDone) onDone(); return; }

    // Assign positions on the circle for each leaf
    var leafAngles = {};
    for (var li = 0; li < nLeaves; li++) {
      var angle = (li / nLeaves) * 2 * Math.PI - Math.PI / 2;
      leafAngles[leaves[li]] = angle;
    }

    function onCircle(angle, r) {
      return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
    }

    // Find deepest common ancestor depth for two leaves
    function commonDepth(a, b) {
      var infoA = nodeById[a];
      var infoB = nodeById[b];
      if (!infoA || !infoB) return 0;
      var pathA = infoA.path;
      var pathB = infoB.path;
      var depth = 0;
      var maxD = Math.min(pathA.length, pathB.length);
      for (var i = 0; i < maxD; i++) {
        if (pathA[i] === pathB[i]) depth = i + 1;
        else break;
      }
      return depth;
    }

    // ── Render nodes ──────────────────────────────────────────────
    var nodeG = e('g');
    nodeG.style.opacity = '0';
    svgEl.appendChild(nodeG);

    for (var li = 0; li < nLeaves; li++) {
      var angle = leafAngles[leaves[li]];
      var pos = onCircle(angle, nodeRadius);
      // Dot
      nodeG.appendChild(e('circle', {
        cx: pos.x, cy: pos.y, r: dotR,
        fill: fg('frame', 1.0), stroke: fg('frame', 0.3), 'stroke-width': 1,
      }));
      // Label
      var label = e('text', {
        x: pos.x + (Math.cos(angle) > 0 ? 10 : -10),
        y: pos.y + 4,
        fill: fg('frame', 1.0), 'font-size': fs(9),
        'font-family': labelFont,
        'text-anchor': Math.cos(angle) > 0 ? 'start' : 'end',
        'text-rendering': 'optimizeLegibility',
      });
      label.textContent = leaves[li];
      nodeG.appendChild(label);
      nodeElements.push({ dot: null, label: label });
    }

    // ── Render connections (bundled) ───────────────────────────────
    var connG = e('g');
    svgEl.appendChild(connG);

    for (var ci = 0; ci < connections.length; ci++) {
      var src = connections[ci].source;
      var tgt = connections[ci].target;
      if (!leafAngles[src] && leafAngles[tgt] === undefined) continue;

      var a1 = leafAngles[src];
      var a2 = leafAngles[tgt];

      // Control point radius based on common ancestor depth
      var depth = commonDepth(src, tgt);
      var maxDepth = 3;
      var bundleFrac = Math.min(1, depth / maxDepth);
      var cpR = bundleR + (nodeRadius - bundleR) * (1 - bundleFrac);
      if (cpR > nodeRadius - 10) cpR = nodeRadius - 10;

      // Control points at the bundle radius, midway between the two angles
      // Plus a radial offset to create the curve
      // Arc around the circle
      var midAngle = (a1 + a2) / 2;
      // Handle wrapping
      var diff = a2 - a1;
      if (diff > Math.PI) { a2 -= 2 * Math.PI; midAngle = (a1 + a2) / 2; }
      if (diff < -Math.PI) { a2 += 2 * Math.PI; midAngle = (a1 + a2) / 2; }
      diff = a2 - a1;

      // Control point 1: radial outward from source toward bundle
      var cp1x = cx + cpR * Math.cos(a1 + diff * 0.25);
      var cp1y = cy + cpR * Math.sin(a1 + diff * 0.25);
      // Control point 2: radial outward from target toward bundle
      var cp2x = cx + cpR * Math.cos(a2 - diff * 0.25);
      var cp2y = cy + cpR * Math.sin(a2 - diff * 0.25);

      var p1 = onCircle(a1, nodeRadius);
      var p2 = onCircle(a2, nodeRadius);

      var pathD = 'M ' + p1.x.toFixed(1) + ',' + p1.y.toFixed(1) +
                  ' C ' + cp1x.toFixed(1) + ',' + cp1y.toFixed(1) +
                  ' ' + cp2x.toFixed(1) + ',' + cp2y.toFixed(1) +
                  ' ' + p2.x.toFixed(1) + ',' + p2.y.toFixed(1);

      var op = 0.2 + (1 - bundleFrac) * 0.4;
      var line = e('path', {
        d: pathD,
        fill: 'none',
        stroke: fg('data', op),
        'stroke-width': 1.0 + (1 - bundleFrac) * 0.5,
      });
      connG.appendChild(line);
      connectionElements.push(line);
    }

    // ── Animation ─────────────────────────────────────────────────
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.nodes = nodeG;
    groupMap.connections = connectionElements;

    var defaults = [
      { action: 'appear',   groups: ['header', 'footer'] },
      { action: 'wait',     duration: 500 },
      { action: 'appear',   groups: ['nodes'] },
      { action: 'wait',     duration: 400 },
      { action: 'flickerIn', groups: ['connections'], order: 'sequential', gap: 200 },
      { action: 'wait',     duration: 8000 },
      { action: 'disappear', groups: ['connections'], order: 'reverse', gap: 150 },
      { action: 'wait',     duration: 300 },
      { action: 'disappear', groups: ['nodes'] },
      { action: 'wait',     duration: 300 },
      { action: 'disappear', groups: ['header', 'footer'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Inline Data Source Plugin
//  — Returns data embedded directly in radiator.yaml
//  — Only returns what the user explicitly wrote. No random/demo values.
// ═══════════════════════════════════════════════════════════════════════
//
//  Usage:
//    dataSource:
//      type: inline
//      groups:
//        - name: API-GATEWAY
//          series:
//            - label: p99
//              values: [60, 70, 85, 110]
//
//  Returns:
//    { groups: [...] }  (empty groups = no-data state)

window.HAL = window.HAL || {};
window.HAL.data = window.HAL.data || {};
window.HAL.data.sources = window.HAL.data.sources || {};

window.HAL.data.sources.inline = {
  name: 'inline',

  fetch: function(dataSource) {
    // Primary: canonical groups + series shape
    if (dataSource && dataSource.groups) {
      return { groups: dataSource.groups };
    }
    // Legacy shapes — kept for backward compat with existing cards
    if (dataSource && dataSource.columns) {
      return { columns: dataSource.columns, rows: dataSource.rows || [] };
    }
    if (dataSource && dataSource.objects) {
      return { objects: dataSource.objects, connections: dataSource.connections || [] };
    }
    if (dataSource && dataSource.series) {
      return { series: dataSource.series };
    }
    if (dataSource && dataSource.hierarchy) {
      return { hierarchy: dataSource.hierarchy };
    }
    if (dataSource && dataSource.tree) {
      return { tree: dataSource.tree, connections: dataSource.connections || [] };
    }
    if (dataSource && dataSource.rows) {
      return { rows: dataSource.rows };
    }
    // No data configured — returns empty groups
    return { groups: [] };
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  VictoriaMetrics Data Source Plugin
//  — Fetches time-series data from VictoriaMetrics PromQL API
//  — Works from any HTTP server (VM has open CORS,
//    Access-Control-Allow-Origin: *)
//
//  Usage in config.js:
//    { type: 'chart', ...
//      dataSource: {
//        type: 'victoria',
//        url: 'http://192.168.50.9:8428',
//        range: 300,            // time window in seconds (default 300)
//        step: 30,              // [optional] seconds between points.
//                               // If set, ALL points from VM are accepted
//                               // and the renderer adapts its grid spacing
//                               // to match the actual number of points.
//                               // If omitted, falls back to 'points' (default 60)
//                               // which computes step = range / (points - 1)
//        points: 60,            // [optional, used only when step is not set]
//                               // Target number of points (VM downsamples).
//                               // Sets step = range / (points - 1)
//        promql: '...',
//        map: {
//          group:  'name',        // Prometheus label → group name (band)
//          series: 'le',          // Prometheus label → series label, or null
//        },
//        alias: {                 // [optional] rename series labels
//          node_load1: "1 MIN",   //   exact match
//          node_load5: "5 MIN",
//          strip: "node_load"     //   or strip prefix from all series
//        }
//      }
//    }
//
//  If map.series is null, each group gets a single curve labelled 'value'.
//  If map.series is set (e.g. 'le' for percentiles), series with the same
//  group label are merged into one band, differentiated by the series label.
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.data = window.HAL.data || {};
window.HAL.data.sources = window.HAL.data.sources || {};

(function() {

  var plugin = {

    // ── Fetch ─────────────────────────────────────────────────────────
    // Returns a Promise that resolves to { groups: [ { name, series } ] }
    // or null if the config is invalid.
    fetch: function(dataSource) {
      if (!dataSource || !dataSource.url || !dataSource.promql) return null;

      var url = dataSource.url.replace(/\/+$/, '') + '/api/v1/query_range';
      var query = dataSource.promql;
      var map = dataSource.map || {};
      var groupLabel = map.group || 'group';
      var seriesLabel = map.series || null;

      // Configurable time window: range in seconds (default 300 = 5 min)
      var windowSec = dataSource.range || 300;
      var step;
      if (dataSource.step) {
        // User specified exact step — use it. ALL points are returned.
        step = dataSource.step;
      } else {
        // Fall back to points-based step for backward compatibility.
        var nPoints = dataSource.points || 60;
        step = Math.max(Math.floor(windowSec / (nPoints - 1)), 1);
      }

      var now = Date.now() / 1000;
      var start = now - windowSec;

      return fetch(url + '?' + [
        'query=' + encodeURIComponent(query),
        'start=' + start,
        'end=' + now,
        'step=' + step
      ].join('&'), { signal: AbortSignal.timeout(10000) })
        .then(function(r) { if (!r.ok) throw new Error('VM fetch failed: ' + r.status); return r.json(); })
        .then(function(json) { return plugin.transform(json, groupLabel, seriesLabel, dataSource); });
    },

    // ── Transform ─────────────────────────────────────────────────────
    // Parses a Prometheus query_range JSON response into the canonical
    // { groups: [ { name, series: [ { label, values } ] } ] } structure.
    transform: function(json, groupLabel, seriesLabel, dataSource) {
      if (!json || !json.data || !json.data.result) return null;

      var results = json.data.result;
      var groupMap = {};  // { groupName: { seriesName: [values] } }

      // Prepare alias map: exact matches take priority over strip
      var alias = (dataSource && dataSource.alias) || {};
      var strip = (typeof alias.strip === 'string') ? alias.strip : null;

      for (var i = 0; i < results.length; i++) {
        var metric = results[i].metric;
        var values = results[i].values;

        var grpName = metric[groupLabel] || 'unknown';
        var serName = seriesLabel ? (metric[seriesLabel] || 'value') : 'value';

        // Apply alias: exact match first, then strip prefix
        serName = alias[serName] || serName;
        if (strip && serName.indexOf(strip) === 0) {
          serName = serName.slice(strip.length);
        }

        var vals = [];
        for (var vi = 0; vi < values.length; vi++) {
          vals.push(parseFloat(values[vi][1]));
        }
        if (vals.length === 0) continue;

        if (!groupMap[grpName]) groupMap[grpName] = {};
        groupMap[grpName][serName] = vals;
      }

      // Flatten groupMap into the canonical array structure
      var groups = [];
      var grpNames = Object.keys(groupMap);
      for (var gi = 0; gi < grpNames.length; gi++) {
        var gn = grpNames[gi];
        var series = [];
        var serNames = Object.keys(groupMap[gn]);
        for (var si = 0; si < serNames.length; si++) {
          series.push({ label: serNames[si], values: groupMap[gn][serNames[si]] });
        }
        groups.push({ name: gn, series: series });
      }

      return { groups: groups };
    },

  };

  window.HAL.data.sources.victoria = plugin;
})();
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Data Fetcher — Source dispatch + error handling
//  - Routes fetch to the appropriate source plugin
//  - Returns { groups, error, stale, faultCard }
//  - Fault behaviour is configurable per-card + global default
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.data = window.HAL.data || {};

var DF = window.HAL.data;

/**
 * Fetch data for a card.
 *
 * @param {Object} card — Card config from the flattened radiator.yaml
 * @returns {Promise<{
 *   groups: Array<{name: string, series: Array<{label: string, values: number[]}>}>,
 *   error: ?{message: string, source: string},
 *   stale: boolean,
 *   faultCard: ?string   // 'non-function' | null
 * }>}
 */
DF.fetchCardData = function(card) {
  var df = card.dataFault || DF.defaultDataFault || { mode: 'skip' };
  var ds = card.dataSource || { type: 'inline' };
  var plugin = DF.sources[ds.type];

  if (!plugin) {
    return buildFaultResult(df, 'Unknown data source type: "' + ds.type + '"', ds.type);
  }

  try {
    var result = plugin.fetch(ds, card);

    // Handle synchronous result
    if (result && typeof result.then !== 'function') {
      return Promise.resolve(normalize(result, df));
    }

    // Handle async result
    return result.then(function(data) {
      return normalize(data, df);
    }).catch(function(err) {
      return buildFaultResult(df, err.message || String(err), ds.type);
    });
  } catch (err) {
    return buildFaultResult(df, err.message || String(err), ds.type);
  }
};

// ── Helpers ───────────────────────────────────────────────────────────

/**
 * Normalize a successful data packet.
 * Ensures it has the canonical shape even if the source returns a bare object.
 */
function normalize(data, df) {
  if (!data || typeof data !== 'object') {
    return buildFaultResult(df, 'Source returned invalid data', '?');
  }
  // Start from source data, then overlay canonical fields
  var out = {};
  for (var k in data) if (data[k] != null) out[k] = data[k];
  out.error = null;
  out.stale = data.stale || false;
  out.faultCard = null;
  if (!out.groups) out.groups = [];
  return out;
}

/**
 * Build a fault result based on the fault config.
 *   df = { mode: 'skip' | 'hide' | 'non-function', defaultDuration, card }
 */
function buildFaultResult(df, message, sourceType) {
  var mode = (df && df.mode) || 'skip';
  var out = {
    groups: [],
    error: { message: message, source: sourceType },
    stale: false,
    faultCard: null,
    _faultConfig: df || {},
  };

  if (mode === 'non-function') {
    out.faultCard = 'non-function';
    // Pass fault details through _faultConfig so the non-function card can
    // render the message + tooltip. The original card's config is preserved.
  }

  return out;
}

// Default global fault config — overridden by radiator.yaml dataFault at boot
DF.defaultDataFault = { mode: 'skip' };
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  App — Orchestrator
//  — Boots by fetching /api/config from the server
//  — Then cycles cards, handles keyboard controls
//  — Uses a generation counter to prevent stale callbacks from
//    racing with manual navigation
// ═══════════════════════════════════════════════════════════════════════

(function() {
  var svgEl = document.getElementById('card');

  // Fetch config from server, then boot the radiator
  fetch('/api/config').then(function(r) { return r.json(); }).then(function(cfg) {
    window.HAL_CONFIG = cfg;
    boot(cfg);
  }).catch(function(err) {
    // Fallback: use whatever config.js set if available
    if (window.HAL_CONFIG) {
      boot(window.HAL_CONFIG);
    } else {
      document.body.innerHTML += 'ERROR: cannot fetch config &ndash; ' + err;
    }
  });

  function boot(cfg) {
    if (!svgEl) { document.body.innerHTML += 'ERROR: no SVG element'; return; }
    if (!cfg || !cfg.cards || !cfg.cards.length) return;
    if (!window.HAL.cards || !window.HAL.cards.title) { document.body.innerHTML += 'ERROR: title renderer missing'; return; }

    // ── Set global data fault default ──────────────────────────────
    if (cfg.dataFault) {
      window.HAL.data.defaultDataFault = cfg.dataFault;
    }

    // ── Merge per-card dataFault (card-level overrides global) ─────
    for (var di = 0; di < cfg.cards.length; di++) {
      var card = cfg.cards[di];
      if (!card.dataFault && cfg.dataFault) {
        card.dataFault = cfg.dataFault;
      }
      // Composite zones inherit too
      if (card.type === 'composite' && card.zones) {
        for (var zj = 0; zj < card.zones.length; zj++) {
          var z = card.zones[zj];
          if (!z.dataFault && cfg.dataFault) {
            z.dataFault = cfg.dataFault;
          }
        }
      }
    }

    // ── Validate every card type has a registered renderer ─────────
    var missing = [];
    for (var i = 0; i < cfg.cards.length; i++) {
      var t = cfg.cards[i].type;
      if (t === 'composite') {
        var zones = cfg.cards[i].zones || [];
        for (var j = 0; j < zones.length; j++) {
          var ct = zones[j].chartType;
          if (ct && !window.HAL.cards[ct]) missing.push(ct + ' (zone ' + j + ' of card ' + i + ')');
        }
      }
      if (!window.HAL.cards[t]) missing.push(t + ' (card ' + i + ')');
    }
    if (missing.length > 0) {
      svgEl.style.display = 'none';
      var errEl = document.getElementById('boot-error');
      if (!errEl) {
        errEl = document.createElement('div');
        errEl.id = 'boot-error';
        document.body.insertBefore(errEl, document.body.firstChild);
      }
      errEl.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;' +
        'background:#0a0e12;color:#e8e8e8;font-family:monospace;font-size:14px;' +
        'overflow:auto;z-index:9999;display:flex;flex-direction:column;' +
        'align-items:center;justify-content:center;padding:40px;box-sizing:border-box;';
      errEl.innerHTML =
        '<div style="max-width:700px">' +
        '<h2 style="color:#ff6b7a;margin:0 0 8px">CONFIGURATION ERROR</h2>' +
        '<p style="color:#aaa;margin:0 0 20px">' + missing.length + ' card renderer(s) not found</p>' +
        '<div style="background:#161a20;border:1px solid #2a2e36;border-radius:6px;padding:16px;margin-bottom:20px">' +
        '<code style="white-space:pre-wrap;line-height:1.6">' +
        missing.join('\n') +
        '</code></div>' +
        '<p style="color:#888;font-size:13px;margin:0">' +
        'Each card type must have a corresponding renderer registered as ' +
        '<code>window.HAL.cards["&lt;type&gt;"]</code> in a .js file under ' +
        '<code>src/cards/</code>. The filename does not need to match the type name — ' +
        'the renderer registers itself by setting <code>window.HAL.cards[type]</code>.</p>' +
        '</div>';
      return;
    }

    var idx = 0, locked = false, autoTimer = null, zoom = 1.0;
    var wrap = document.getElementById('wrap');
    var gen = 0;  // incremented on every showCard → invalidates stale callbacks
    var currentCardType = null;  // tracks last-shown card type for _cleanup

    function clearAuto() {
      if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    }

    function clearCard(color) {
      if (color) document.body.style.background = color;
      svgEl.innerHTML = '';
    }

    // ── Guard: wraps a callback so it only fires if `myGen` still
    //     matches `gen`.  Prevents in-flight callbacks from a
    //     previous showCard from racing after a new transition.
    function guard(fn, myGen) {
      return function() {
        if (myGen !== gen) return;
        if (fn) fn();
      };
    }

    // ── Show a card by index ─────────────────────────────────────────
    function showCard(i, onDone) {
      clearAuto();
      gen++;
      var myGen = gen;
      var c = cfg.cards[i % cfg.cards.length];

      // Lifecycle: clean up the previous card's renderer before switching
      if (currentCardType && currentCardType !== c.type) {
        var prev = window.HAL.cards[currentCardType];
        if (prev && prev._cleanup) prev._cleanup();
      }

      clearCard(c.color);

      if (c.type !== 'title') {
        window.HAL.data.fetchCardData(c)
          .then(function(data) {
            if (myGen !== gen) return;  // stale: user navigated away
            // Merge data into card config — skip null/undefined only
            if (data) for (var k in data) if (data[k] != null) c[k] = data[k];

            // Fault handling
            var cardType = c.type;
            var df = c.dataFault || window.HAL.data.defaultDataFault || {};
            var mode = df.mode || 'skip';

            if (data && data.error && mode === 'skip') {
              // Skip: advance immediately, no render
              var sk = window.HAL.cards[cardType];
              if (sk && sk._cleanup) sk._cleanup();
              var cb = guard(onDone, myGen); cb && cb();
              return;
            }
            if (data && data.error && mode === 'non-function') {
              cardType = 'non-function';
            }
            // mode 'hide' falls through — renders card with error state

            try {
              var r = window.HAL.cards[cardType];
              if (r && r._cleanup) r._cleanup();
              currentCardType = cardType;
              var cb = guard(onDone, myGen);
              r && r.render ? r.render(c, cb) : cb && cb();
            } catch(e) { console.error('Card render error [', cardType, ']:', e); var cb = guard(onDone, myGen); cb && cb(); }
          })
          .catch(function(e) { console.error('Card fetch error [', c.type, ']:', e); var cb = guard(onDone, myGen); cb && cb(); });
      } else {
        window.HAL.cards.title.render(c);
        currentCardType = 'title';
        if (onDone) {
          autoTimer = setTimeout(guard(onDone, myGen), cfg.timing.titleCardDisplay * 1000);
        }
      }
    }

    // ── Advance to the next card in sequence ─────────────────────────
    function scheduleNext() {
      clearAuto();
      transitionTo((idx + 1) % cfg.cards.length);
    }

    // ── Navigate to a specific card ─────────────────────────────────
    function transitionTo(nextIdx) {
      idx = nextIdx;
      showCard(idx, cardDone);
    }

    // ── Auto-advance callback ────────────────────────────────────────
    var MIN_DISPLAY_MS = 2000;  // minimum time a card must be visible

    function cardDone() {
      if (locked) { showCard(idx, cardDone); return; }

      // If a card's animation / data fetch completed in under MIN_DISPLAY_MS it
      // had no meaningful content to show (e.g. a data source that was
      // unreachable).  Hold for the remaining time so the user sees
      // something instead of an instant flicker, then auto-advance.
      var elapsed = Date.now() - window.__cardStart;
      if (elapsed < MIN_DISPLAY_MS) {
        var myGen = gen;
        setTimeout(function() { if (myGen === gen) cardDone(); }, MIN_DISPLAY_MS - elapsed);
        return;
      }

      scheduleNext();
    }

    // ── Keyboard controls ────────────────────────────────────────────
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault(); locked = false;
        window.__cardStart = Date.now();
        transitionTo((idx - 1 + cfg.cards.length) % cfg.cards.length);
      }
      else if (e.key === 'ArrowRight') {
        e.preventDefault(); locked = false;
        window.__cardStart = Date.now();
        transitionTo((idx + 1) % cfg.cards.length);
      }
      else if (e.key === ' ') {
        e.preventDefault(); locked = !locked;
        window.__cardStart = Date.now();
        locked ? showCard(idx, cardDone) : scheduleNext();
      }
      else if (e.key === '=' || e.key === '+') {
        e.preventDefault();
        zoom = Math.min(zoom + 0.25, 3.0);
        if (wrap) { wrap.style.transform = 'scale(' + zoom + ')'; wrap.classList.add('zoomed'); }
      }
      else if (e.key === '-') {
        e.preventDefault();
        zoom = Math.max(zoom - 0.25, 0.25);
        if (zoom === 1.0) {
          if (wrap) { wrap.style.transform = ''; wrap.classList.remove('zoomed'); }
        } else {
          if (wrap) { wrap.style.transform = 'scale(' + zoom + ')'; wrap.classList.add('zoomed'); }
        }
      }
    });

    // ── Expose gotoCard for console / URL params
    window.HAL.gotoCard = transitionTo;

    // ── Boot sequence ──────────────────────────────────────────────────
    var startIdx = 0;
    try {
      var m = (window.location.search || '').match(/[?&]card=(\d+)/);
      if (m) startIdx = Math.min(Math.max(parseInt(m[1], 10), 0), cfg.cards.length - 1);
    } catch(e) {}
    window.__cardStart = Date.now();
    showCard(startIdx);
    autoTimer = setTimeout(function() { transitionTo((startIdx + 1) % cfg.cards.length); }, cfg.timing.initialPause || 5000);
  }
})();</script>
</body>
</html>
