<script>// ═══════════════════════════════════════════════════════════════════════
//  Trajectory Overlay Map
//  — Solar system orbits + a single trajectory path
//  — sqrt(r) scale for main view, linear zoom panel for inner planets
//  — Static waypoints from dataSource
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['trajectory'] = {

  render: function(data, onDone) {
    var svgEl = window.HAL.svg.getContainer(data);
    var vis = window.HAL_CONFIG.visual || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var e = window.HAL.svg.el;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    // ── Layout ────────────────────────────────────────────────────────
    var cx = 500, cy = 400;
    var maxR = 400;
    var maxAU = 65;

    // sqrt scale: inner planets spread out, outer planets still fit
    var sqrtFactor = maxR / Math.sqrt(maxAU);

    // Linear scale for zoom panel — shows inner solar system zoomed in
    var zoomCX = 830, zoomCY = 640;
    var zoomR = 110;
    var zoomAU = 1.8;  // show 0-1.8 AU (Mercury through Mars, zoomed in)
    var zoomScale = zoomR / zoomAU;

    // ── Solar system data ─────────────────────────────────────────────
    var planets = [
      { name: 'MERCURY', a: 0.387 },
      { name: 'VENUS',   a: 0.723 },
      { name: 'EARTH',   a: 1.000 },
      { name: 'MARS',    a: 1.524 },
      { name: 'JUPITER', a: 5.203 },
      { name: 'SATURN',  a: 9.537 },
      { name: 'URANUS',  a: 19.191 },
      { name: 'NEPTUNE', a: 30.069 },
      { name: 'PLUTO',   a: 39.482 },
    ];

    // Planet positions at V1 encounter dates (card coords: 0=top, CW)
    var epochPos = {
      mercury: 156.3, venus: 87.7,  earth: 106.4, mars: 86.3,
      jupiter: 346.4, saturn: 308.6, uranus: 306.0, neptune: 337.9, pluto: 256.4,
    };

    // ── Helpers ───────────────────────────────────────────────────────
    function polar(rAU, angle, cxp, cyp, sc) {
      var rad = (angle - 90) * Math.PI / 180;
      return {
        x: (cxp || cx) + rAU * (sc || sqrtFactor) * Math.cos(rad),
        y: (cyp || cy) + rAU * (sc || sqrtFactor) * Math.sin(rad),
      };
    }

    function grp(name) {
      var g = e('g');
      g.setAttributeNS(null, 'data-anim-group', name);
      return g;
    }

    // ── Background ────────────────────────────────────────────────────
    svgEl.appendChild(e('rect', {
      x: 0, y: 0, width: data.w || 1000, height: data.h || 750,
      fill: data.color || '#0f1923',
    }));

    // ── Glow filter defs ──────────────────────────────────────────────
    if (!svgEl.querySelector('#gfxGlow')) {
      var defs = e('defs');
      defs.innerHTML =
        '<filter id="txtGlow" x="-20%" y="-20%" width="140%" height="140%">'
        + '<feGaussianBlur stdDeviation="1.5" result="blur"/>'
        + '<feComposite in="SourceGraphic" in2="blur" operator="over"/>'
        + '</filter>'
        + '<filter id="gfxGlow" x="-20%" y="-20%" width="140%" height="140%">'
        + '<feGaussianBlur stdDeviation="2" result="blur"/>'
        + '<feComposite in="SourceGraphic" in2="blur" operator="over"/>'
        + '</filter>';
      svgEl.appendChild(defs);
    }

    // ── Zoom panel clip path ──────────────────────────────────────────
    var clipId = 'zoomClip_' + (Date.now());
    var clipPath = e('clipPath', { id: clipId });
    clipPath.appendChild(e('circle', { cx: zoomCX, cy: zoomCY, r: zoomR }));
    svgEl.appendChild(clipPath);

    // ── Header ────────────────────────────────────────────────────────
    var header = e('text', {
      x: 20, y: 25, fill: '#ffffff', 'font-size': fs(14),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    header.textContent = data.title || '';
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // ── Footer ────────────────────────────────────────────────────────
    var footer = e('text', {
      x: 20, y: 735, fill: '#ffffff', 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Trajectories from dataSource ──────────────────────────────────
    var trajectories = (data.dataSource && data.dataSource.trajectories) || [];

    // ── Group tracking ────────────────────────────────────────────────
    var groups = {};
    var planetGroupNames = [];
    var trajGroups = [];

    // ── Planet groups ─────────────────────────────────────────────────
    var planetGroups = [];
    for (var pi = 0; pi < planets.length; pi++) {
      var pName = planets[pi].name.toLowerCase();
      var pData = planets[pi];
      var angle = epochPos[pName];
      if (angle === undefined) continue;

      var gP = grp('planet_' + pi);
      var aAU = pData.a;
      var pChildren = [];

      // Orbit ring (solid circle, sqrt scale)
      var orbitR = Math.sqrt(aAU) * sqrtFactor;
      var orbit = e('circle', {
        cx: cx, cy: cy, r: orbitR.toFixed(1),
        fill: 'none', stroke: fg('frame', 0.3), 'stroke-width': 0.5,
      });
      orbit.style.opacity = '0';
      gP.appendChild(orbit);
      pChildren.push(orbit);

      // Zoom panel orbit (linear scale, only inner planets)
      if (aAU <= zoomAU) {
        var zR = aAU * zoomScale;
        var zOrbit = e('circle', {
          cx: zoomCX, cy: zoomCY, r: zR.toFixed(1),
          fill: 'none', stroke: fg('frame', 0.35), 'stroke-width': 0.4,
        });
        zOrbit.style.opacity = '0';
        zOrbit.setAttribute('clip-path', 'url(#' + clipId + ')');
        gP.appendChild(zOrbit);
        pChildren.push(zOrbit);
      }

      // Planet dot at V1 position (main view, sqrt scale)
      var dotP = polar(Math.sqrt(aAU), angle);
      var dot = e('circle', {
        cx: dotP.x, cy: dotP.y, r: 2.5, fill: '#ffffff',
        filter: 'url(#gfxGlow)',
      });
      dot.style.opacity = '0';
      gP.appendChild(dot);
      pChildren.push(dot);

      // Zoom panel dot (linear scale)
      if (aAU <= zoomAU) {
        var zDotP = polar(aAU, angle, zoomCX, zoomCY, zoomScale);
        var zDot = e('circle', {
          cx: zDotP.x, cy: zDotP.y, r: 2, fill: '#ffffff',
          filter: 'url(#gfxGlow)',
        });
        zDot.style.opacity = '0';
        zDot.setAttribute('clip-path', 'url(#' + clipId + ')');
        gP.appendChild(zDot);
        pChildren.push(zDot);
      }

      // Planet label — radially offset from dot (main view only)
      var labelP = polar(Math.sqrt(aAU) + (12 / sqrtFactor), angle);
      var hAnchor = (angle > 90 && angle < 270) ? 'end' : 'start';
      var label = e('text', {
        x: labelP.x, y: labelP.y, fill: '#ffffff', 'font-size': fs(6),
        'font-family': labelFont,
        'text-anchor': hAnchor, 'dominant-baseline': 'central',
        'text-rendering': 'optimizeLegibility',
        filter: 'url(#txtGlow)',
      });
      label.textContent = planets[pi].name;
      label.style.opacity = '0';
      gP.appendChild(label);
      pChildren.push(label);

      svgEl.appendChild(gP);
      planetGroups.push(gP);
      groups['planet_' + pi] = pChildren;
      planetGroupNames.push('planet_' + pi);
    }

    // ── Trajectory groups ─────────────────────────────────────────────
    for (var ti = 0; ti < trajectories.length; ti++) {
      var traj = trajectories[ti];
      var wps = traj.waypoints || [];
      if (wps.length < 2) continue;

      var gT = grp('traj_' + ti);
      var tChildren = [];

      // Main trajectory path (sqrt scale) — render all waypoints
      var d = '';
      var lastWp = null;
      for (var wi = 0; wi < wps.length; wi++) {
        lastWp = wps[wi];
        var pt = polar(Math.sqrt(wps[wi].r), wps[wi].angle);
        d += (wi === 0 || d === '' ? 'M' : 'L') + pt.x.toFixed(1) + ',' + pt.y.toFixed(1);
      }

      var path = e('path', {
        d: d, fill: 'none', stroke: '#ffffff', 'stroke-width': 1.5,
        filter: 'url(#gfxGlow)',
      });
      path.style.opacity = '0';
      gT.appendChild(path);
      tChildren.push(path);

      // Zoom panel trajectory (linear scale, only points within zoomAU)
      var zD = '';
      for (var wi = 0; wi < wps.length; wi++) {
        if (wps[wi].r > zoomAU) continue;
        var zPt = polar(wps[wi].r, wps[wi].angle, zoomCX, zoomCY, zoomScale);
        zD += (zD === '' ? 'M' : 'L') + zPt.x.toFixed(1) + ',' + zPt.y.toFixed(1);
      }
      if (zD) {
        var zPath = e('path', {
          d: zD, fill: 'none', stroke: '#ffffff', 'stroke-width': 1.2,
          filter: 'url(#gfxGlow)',
        });
        zPath.style.opacity = '0';
        zPath.setAttribute('clip-path', 'url(#' + clipId + ')');
        gT.appendChild(zPath);
        tChildren.push(zPath);
      }

      // Endpoint label
      if (traj.label && lastWp) {
        var lp = polar(Math.sqrt(lastWp.r), lastWp.angle);
        var lAnchor = (lastWp.angle > 90 && lastWp.angle < 270) ? 'end' : 'start';
        var lOffset = lAnchor === 'end' ? -8 : 8;
        var lLabel = e('text', {
          x: lp.x + lOffset, y: lp.y - 8, fill: '#ffffff', 'font-size': fs(7),
          'font-family': labelFont,
          'text-anchor': lAnchor, 'dominant-baseline': 'central',
          'text-rendering': 'optimizeLegibility',
          filter: 'url(#txtGlow)',
        });
        lLabel.textContent = traj.label;
        lLabel.style.opacity = '0';
        gT.appendChild(lLabel);
        tChildren.push(lLabel);
      }

      svgEl.appendChild(gT);
      trajGroups.push(gT);
      groups['traj_' + ti] = tChildren;
    }

    // ── Zoom panel border ─────────────────────────────────────────────
    var zoomBorder = e('circle', {
      cx: zoomCX, cy: zoomCY, r: zoomR,
      fill: 'none', stroke: fg('frame', 0.3), 'stroke-width': 1,
    });
    zoomBorder.style.opacity = '0';
    svgEl.appendChild(zoomBorder);
    groups['zoomPanel'] = [zoomBorder];

    // ── SOL in main view ──────────────────────────────────────────────
    var solG = grp('sol');
    var sChildren = [];
    var solDot = e('circle', {
      cx: cx, cy: cy, r: 4, fill: '#ffffff', filter: 'url(#gfxGlow)',
    });
    solDot.style.opacity = '0';
    solG.appendChild(solDot);
    sChildren.push(solDot);
    var solLabel = e('text', {
      x: cx + 8, y: cy + 2, fill: '#ffffff', 'font-size': fs(7),
      'font-family': labelFont,
      'dominant-baseline': 'central',
      'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    solLabel.textContent = 'SOL';
    solLabel.style.opacity = '0';
    solG.appendChild(solLabel);
    sChildren.push(solLabel);
    svgEl.appendChild(solG);
    groups['sol'] = sChildren;

    // ── Animation ─────────────────────────────────────────────────────
    var defaults = [
      { action: 'flickerIn', groups: ['header', 'footer'], order: 'simultaneous' },
      { action: 'flickerIn', groups: ['sol'], order: 'simultaneous' },
      { action: 'flickerIn', groups: ['zoomPanel'], order: 'simultaneous' },
      { action: 'flickerIn', groups: planetGroupNames, order: 'simultaneous' },
    ];
    for (var ti = 0; ti < trajGroups.length; ti++) {
      defaults.push({ action: 'draw', groups: ['traj_' + ti], order: 'sequential', gap: 100, duration: 2000 });
    }
    defaults.push({ action: 'wait', duration: 5000 });
    defaults.push({ action: 'done' });

    window.HAL.anim.run(data, groups, onDone, defaults);
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Wireframe 3D HUD Chart Card
//  — Perspective wireframe with orbital rings and data points
//  — Each object has 3D coordinates projected to 2D
//  — Connections draw lines between objects
//  — Animation groups: header, footer, grid, connections, dataPoints
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['wireframe'] = {

  render: function(data, onDone) {
    var svgEl = window.HAL.svg.getContainer(data);
    var vis = window.HAL_CONFIG.visual || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var e = window.HAL.svg.el;
    var ns = window.HAL.svg.ns;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var objects = (data.objects || []);
    var connections = (data.connections || []);

    // ── Perspective projection helpers ─────────────────────────────────
    // Simple isometric-like projection: flatten 3D (x,y,z) to 2D (px,py)
    var cx = 500, cy = 380;  // vanishing / centre point
    var scale = 60;

    function project(x, y, z) {
      // Tilted perspective: x→right, y→depth (up on screen), z→up
      var px = cx + x * scale - y * scale * 0.3;
      var py = cy - z * scale + y * scale * 0.3;
      return { x: px, y: py, z: y };
    }

    // Background
    svgEl.appendChild(e('rect', { x: 0, y: 0, width: data.w || 1000, height: data.h || 750, fill: data.color }));

    // ── Header ────────────────────────────────────────────────────────
    var header = e('text', {
      x: 20, y: 25, fill: fg('frame', 1.9), 'font-size': fs(14),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    header.textContent = (data.title || '') + '  ' + (data.label || '');
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // ── Footer ────────────────────────────────────────────────────────
    var footer = e('text', {
      x: 20, y: 735, fill: fg('frame', 0.85), 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Perspective grid ──────────────────────────────────────────────
    var gridG = e('g');
    svgEl.appendChild(gridG);
    var gridLines = [];
    var clamp = 350;

    // Horizontal grid lines (depth bands)
    for (var d = -4; d <= 4; d++) {
      if (d === 0) continue;
      var p1 = project(-4, d, -3);
      var p2 = project(4, d, -3);
      if (p1.z < 0 || p2.z < 0) continue;
      gridLines.push(e('line', {
        x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
        stroke: fg('frame', 0.3), 'stroke-width': 0.5,
      }));
      p1 = project(-4, d, 3);
      p2 = project(4, d, 3);
      if (p1.z < 0 || p2.z < 0) continue;
      gridLines.push(e('line', {
        x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
        stroke: fg('frame', 0.2), 'stroke-width': 0.5,
      }));
    }

    // Vertical grid lines (depth rays from center)
    for (var a = 0; a < 360; a += 30) {
      var rad = a * Math.PI / 180;
      var dx = Math.cos(rad) * 4;
      var dy = Math.sin(rad) * 4;
      var p0 = project(0, 0, 0);
      var p1 = project(dx, dy, 0);
      if (p1.z < 0) continue;
      gridLines.push(e('line', {
        x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y,
        stroke: fg('frame', 0.15), 'stroke-width': 0.5,
      }));
    }

    // Orbital rings (ellipses in perspective)
    for (var r = 1; r <= 3; r++) {
      var pathD = '';
      for (var a = 0; a <= 360; a += 10) {
        var rad = a * Math.PI / 180;
        var dx = Math.cos(rad) * r;
        var dy = Math.sin(rad) * r;
        var p = project(dx, dy, 0);
        if (p.z < 0) continue;
        pathD += (a === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
      }
      if (pathD) {
        gridLines.push(e('path', {
          d: pathD, fill: 'none',
          stroke: fg('frame', 0.25), 'stroke-width': 0.5,
        }));
      }
    }

    gridG.style.opacity = '0';
    for (var gli = 0; gli < gridLines.length; gli++) {
      gridG.appendChild(gridLines[gli]);
    }

    // ── Connections (lines between objects) ────────────────────────────
    var connElements = [];
    var connG = e('g');
    svgEl.appendChild(connG);
    connG.style.opacity = '0';

    for (var ci = 0; ci < connections.length; ci++) {
      var fr = connections[ci].from;
      var to = connections[ci].to;
      if (fr >= objects.length || to >= objects.length) continue;
      var o1 = objects[fr];
      var o2 = objects[to];
      var p1 = project(o1.x, o1.y, o1.z);
      var p2 = project(o2.x, o2.y, o2.z);
      var line = e('line', {
        x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
        stroke: fg('data', 0.38), 'stroke-width': 0.8,
        filter: 'url(#gfxGlow)',
      });
      connG.appendChild(line);
      connElements.push(line);
    }

    // ── Data points ───────────────────────────────────────────────────
    var pointElements = [];
    var ptG = e('g');
    svgEl.appendChild(ptG);

    for (var oi = 0; oi < objects.length; oi++) {
      var obj = objects[oi];
      var p = project(obj.x, obj.y, obj.z);

      var grp = document.createElementNS(ns, 'g');
      grp.style.opacity = '0';

      // Point marker (crosshair/diamond)
      var size = 5;
      grp.appendChild(e('circle', {
        cx: p.x, cy: p.y, r: size, fill: fg('data', 0.88),
        filter: 'url(#gfxGlow)',
      }));

      // Glow ring
      grp.appendChild(e('circle', {
        cx: p.x, cy: p.y, r: size + 3, fill: 'none',
        stroke: fg('data', 0.32), 'stroke-width': 1,
        filter: 'url(#gfxGlow)',
      }));

      // Label
      var lbl = e('text', {
        x: p.x + 10, y: p.y + 3,
        fill: fg('frame', 1.5), 'font-size': fs(10),
        'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
        filter: 'url(#txtGlow)',
      });
      lbl.textContent = obj.label || '';
      grp.appendChild(lbl);

      ptG.appendChild(grp);
      pointElements.push(grp);
    }

    // ── Group map ─────────────────────────────────────────────────────
    var groupMap = {};
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.grid = gridG;
    groupMap.connections = connG;
    groupMap.dataPoints = pointElements;

    // ── Animation ─────────────────────────────────────────────────────
    var defaults = [
      { action: 'appear',     groups: ['header', 'footer', 'grid'] },
      { action: 'wait',       duration: 1000 },
      { action: 'appear',     groups: ['connections'], order: 'simultaneous' },
      { action: 'wait',       duration: 600 },
      { action: 'appear',     groups: ['dataPoints'], order: 'sequential', gap: 400 },
      { action: 'wait',       duration: 8000 },
      { action: 'disappear',  groups: ['dataPoints'], order: 'sequential', gap: 250 },
      { action: 'wait',       duration: 400 },
      { action: 'disappear',  groups: ['connections'], order: 'simultaneous' },
      { action: 'wait',       duration: 300 },
      { action: 'disappear',  groups: ['header', 'footer', 'grid'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },

};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Animation Engine
//  — Executes a phase-based animation sequence for chart cards
//  — Each phase is: { action, groups, [order], [gap], [duration], [effect] }
//  — Groups are chart-type specific element collections (header, bands, etc.)
//
//  Actions: appear, disappear, flickerIn, flickerOut, wait, blank,
//           throb, fadeOut, done, draw
//  Orders:  sequential (default), simultaneous, reverse
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.anim = window.HAL.anim || {};

(function() {
  var cfg = window.HAL_CONFIG;

  // ── Element helpers ────────────────────────────────────────────────

  function setOpacity(el, val) {
    if (el instanceof Array) {
      for (var i = 0; i < el.length; i++) setOpacity(el[i], val);
      return;
    }
    el.style.opacity = val;
  }

  function flickerOne(el, dir, dur) {
    var cls = dir === 'in' ? 'blink-in' : 'blink-out';
    if (el instanceof Array) {
      for (var i = 0; i < el.length; i++) flickerOne(el[i], dir, dur);
      return;
    }
    var ms = dur || (window.HAL_CONFIG.timing && window.HAL_CONFIG.timing.flickerDuration) || 1000;
    el.style.animationDuration = ms + 'ms';
    el.classList.add(cls);
  }

  // Throb: snap visible → linear fade out → snap visible → repeat count times.
  // fadeMs: duration of each fade-out (default 1000ms).
  // count: number of throb cycles (default 2).
  function throbOne(el, count, fadeMs, cb) {
    if (el instanceof Array) {
      var done = 0, total = el.length;
      for (var i = 0; i < total; i++) {
        throbOne(el[i], count, fadeMs, function() { done++; if (done >= total && cb) cb(); });
      }
      return;
    }
    var cycles = count || 2;
    var fadeDur = fadeMs || 1000;
    var step = 0;
    var running = true;

    function fadeOut(onDone) {
      var start = performance.now();
      (function tick(now) {
        if (!running) return;
        var t = (now - start) / fadeDur;
        if (t >= 1) { el.style.opacity = '0'; onDone(); return; }
        el.style.opacity = 1 - t;
        requestAnimationFrame(tick);
      })(performance.now());
    }

    function next() {
      if (!running) return;
      step++;
      if (step > cycles) { el.style.opacity = '1'; running = false; if (cb) cb(); return; }
      el.style.opacity = '1';
      fadeOut(next);
    }

    next();
  }

  // ── Action implementations ─────────────────────────────────────────

  var actions = {

    appear: function(elements, phase, onDone) {
      var list = asArray(elements);
      if (list.length === 0) { if (onDone) onDone(); return; }
      var target = phase.opacity !== undefined ? phase.opacity : 1;
      if (phase.order === 'sequential') {
        appearSequence(list, phase.gap || 0, onDone);
      } else {
        setOpacity(list, target);
        if (onDone) onDone();
      }
    },

    disappear: function(elements, phase, onDone) {
      var list = asArray(elements);
      if (list.length === 0) { if (onDone) onDone(); return; }
      if (phase.order === 'sequential') {
        disappearSequence(list, phase.gap || 0, onDone);
      } else {
        setOpacity(list, 0);
        if (onDone) onDone();
      }
    },

    flickerIn: function(elements, phase, onDone) {
      var gap = phase.gap || window.HAL_CONFIG.timing.groupGap;
      var dur = phase.duration;
      if (phase.order === 'simultaneous') {
        var list = asArray(elements);
        for (var i = 0; i < list.length; i++) flickerOne(list[i], 'in', dur);
        var ms = dur || window.HAL_CONFIG.timing.flickerDuration || 1000;
        setTimeout(onDone, ms);
      } else {
        blinkSequence(asArray(elements), 'in', gap, onDone, dur);
      }
    },

    flickerOut: function(elements, phase, onDone) {
      var list = asArray(elements);
      if (list.length === 0) { if (onDone) onDone(); return; }
      if (phase.order === 'sequential') {
        var gap = phase.gap || window.HAL_CONFIG.timing.groupGap;
        var dur = phase.duration;
        blinkSequence(list, 'out', gap, onDone, dur);
      } else {
        var dur = phase.duration;
        for (var i = 0; i < list.length; i++) flickerOne(list[i], 'out', dur);
        var ms = dur || window.HAL_CONFIG.timing.flickerDuration || 1000;
        setTimeout(onDone, ms);
      }
    },

    throb: function(elements, phase, onDone) {
      var list = asArray(elements);
      var count = phase.count || 2;
      var fadeMs = phase.duration || 1000;
      if (phase.order === 'simultaneous') {
        var remaining = list.length;
        if (remaining === 0) { if (onDone) onDone(); return; }
        for (var i = 0; i < list.length; i++) {
          throbOne(list[i], count, fadeMs, function() {
            remaining--;
            if (remaining <= 0 && onDone) onDone();
          });
        }
      } else {
        var gap = phase.gap || 400;
        throbSequence(list, gap, count, fadeMs, onDone);
      }
    },

    wait: function(elements, phase, onDone) {
      setTimeout(onDone, phase.duration || 1000);
    },

    // Smooth fade to invisible over duration ms (default 2000).
    fadeOut: function(elements, phase, onDone) {
      var list = asArray(elements);
      var dur = phase.duration || 2000;
      if (phase.order === 'sequential') {
        fadeSequence(list, dur, onDone);
      } else {
        fadeSimultaneous(list, dur, onDone);
      }
    },

    // ── Stroke-draw animation ────────────────────────────────────────
    // Animates SVG <line> elements from zero-length to full length
    // using stroke-dasharray / stroke-dashoffset.
    // The line draws from (x1,y1) toward (x2,y2).
    //
    // order: simultaneous (default) — all lines draw in parallel
    //        sequential — lines draw one by one with gap ms between
    // duration: ms per line (default 600)
    draw: function(elements, phase, onDone) {
      var list = asArray(elements);
      if (list.length === 0) { if (onDone) onDone(); return; }
      var dur = phase.duration || 600;
      if (phase.order === 'sequential') {
        drawSequence(list, dur, phase.gap || 0, onDone);
      } else {
        drawSimultaneous(list, dur, onDone);
      }
    },

    done: function(elements, phase, onDone) {
      if (onDone) onDone();
    },

    // Hide ALL groups — just the card color remains. Ignores phase.groups.
    blank: function(elements, phase, onDone) {
      var map = phase._groupMap;
      if (map) {
        for (var k in map) setOpacity(asArray(map[k]), 0);
      }
      if (onDone) onDone();
    },

  };

  // ── Sequential blink helper ─────────────────────────────────────────

  function blinkSequence(list, dir, gap, onDone, dur) {
    var i = 0;
    function tick() {
      if (i >= list.length) { if (onDone) onDone(); return; }
      var ms = dur || window.HAL_CONFIG.timing.flickerDuration || 1000;
      flickerOne(list[i], dir, dur);
      i++;
      setTimeout(tick, ms + (gap || 0));
    }
    tick();
  }

  // Sequential appear (one element at a time with gap)
  function appearSequence(list, gap, onDone) {
    var i = 0;
    function tick() {
      if (i >= list.length) { if (onDone) onDone(); return; }
      setOpacity(list[i], 1);
      i++;
      setTimeout(tick, gap);
    }
    tick();
  }

  // Sequential disappear
  function disappearSequence(list, gap, onDone) {
    var i = 0;
    function tick() {
      if (i >= list.length) { if (onDone) onDone(); return; }
      setOpacity(list[i], 0);
      i++;
      setTimeout(tick, gap);
    }
    tick();
  }

  // Sequential throb
  function throbSequence(list, gap, count, fadeMs, onDone) {
    var i = 0;
    function tick() {
      if (i >= list.length) { if (onDone) onDone(); return; }
      throbOne(list[i], count, fadeMs);
      i++;
      setTimeout(tick, (count * fadeMs) + (gap || 0));
    }
    tick();
  }

  // Fade all simultaneously over duration ms.
  function fadeSimultaneous(list, dur, onDone) {
    if (list.length === 0) { if (onDone) onDone(); return; }
    var remaining = list.length;
    for (var i = 0; i < list.length; i++) {
      fadeOne(list[i], dur, function() {
        remaining--;
        if (remaining <= 0 && onDone) onDone();
      });
    }
  }

  // Fade sequentially.
  function fadeSequence(list, dur, onDone) {
    var i = 0;
    function tick() {
      if (i >= list.length) { if (onDone) onDone(); return; }
      fadeOne(list[i], dur, tick);
      i++;
    }
    tick();
  }

  // Fade a single element from 1→0 over duration ms.
  function fadeOne(el, dur, cb) {
    if (el instanceof Array) {
      var done = 0, total = el.length;
      for (var i = 0; i < total; i++) {
        fadeOne(el[i], dur, function() { done++; if (done >= total && cb) cb(); });
      }
      return;
    }
    var start = performance.now();
    (function tick(now) {
      var t = (now - start) / dur;
      if (t >= 1) { el.style.opacity = '0'; if (cb) cb(); return; }
      el.style.opacity = 1 - t;
      requestAnimationFrame(tick);
    })(performance.now());
  }

  // ── Stroke-draw helpers ──────────────────────────────────────────────

  function drawOne(el, dur, cb) {
    if (el instanceof Array) {
      var done = 0, total = el.length;
      for (var i = 0; i < total; i++) {
        drawOne(el[i], dur, function() { done++; if (done >= total && cb) cb(); });
      }
      return;
    }
    var len;
    if (el.getTotalLength) {
      try { len = el.getTotalLength(); }
      catch(e) { len = 0; }
    } else {
      var x1 = parseFloat(el.getAttribute('x1') || 0);
      var y1 = parseFloat(el.getAttribute('y1') || 0);
      var x2 = parseFloat(el.getAttribute('x2') || 0);
      var y2 = parseFloat(el.getAttribute('y2') || 0);
      len = Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1));
    }
    if (len < 0.5) { el.style.opacity = '1'; if (cb) cb(); return; }
    var origDash = el.getAttribute('stroke-dasharray');
    el.setAttribute('stroke-dasharray', len);
    el.setAttribute('stroke-dashoffset', len);
    var start = performance.now();
    (function tick(now) {
      var t = (now - start) / dur;
      if (t >= 1) {
        el.setAttribute('stroke-dashoffset', '0');
        if (origDash !== null) {
          el.setAttribute('stroke-dasharray', origDash);
        } else {
          el.removeAttribute('stroke-dasharray');
        }
        el.style.opacity = '1';   // show AFTER draw completes
        if (cb) cb();
        return;
      }
      el.setAttribute('stroke-dashoffset', len * (1 - t));
      requestAnimationFrame(tick);
    })(performance.now());
  }

  function drawSimultaneous(list, dur, onDone) {
    if (list.length === 0) { if (onDone) onDone(); return; }
    var remaining = list.length;
    for (var i = 0; i < list.length; i++) {
      drawOne(list[i], dur, function() {
        remaining--;
        if (remaining <= 0 && onDone) onDone();
      });
    }
  }

  function drawSequence(list, dur, gap, onDone) {
    var i = 0;
    function tick() {
      if (i >= list.length) { if (onDone) onDone(); return; }
      drawOne(list[i], dur, function() { i++; setTimeout(tick, gap); });
    }
    tick();
  }

  // ── Normalise element references ───────────────────────────────────

  function asArray(elements) {
    if (!elements) return [];
    if (elements instanceof Array) return elements;
    return [elements];
  }

  function resolveGroup(name, groupMap) {
    var g = groupMap[name];
    return g !== undefined ? g : [];
  }

// ── Public API ─────────────────────────────────────────────────────
  // Run a sequence of animation phases for a card.
  window.HAL.anim.run = function(card, groupMap, onDone, defaults) {
    var phases = (card.animation && card.animation.phases) || defaults || [];
    executePhases(phases, groupMap, 0, onDone);
  };

  // ── Phase sequencer ────────────────────────────────────────────────

  function executePhases(phases, groupMap, idx, onDone) {
    if (idx >= phases.length) { if (onDone) onDone(); return; }
    var phase = phases[idx];

    var elements = [];
    if (phase.groups) {
      for (var gi = 0; gi < phase.groups.length; gi++) {
        var resolved = resolveGroup(phase.groups[gi], groupMap);
        if (resolved instanceof Array) {
          var ordered = applyOrder(resolved, phase.order);
          for (var ei = 0; ei < ordered.length; ei++) elements.push(ordered[ei]);
        } else {
          elements.push(resolved);
        }
      }
    }

    var fn = actions[phase.action];
    if (!fn) { if (onDone) onDone(); return; }

    phase._groupMap = groupMap;
    fn(elements, phase, function() {
      executePhases(phases, groupMap, idx + 1, onDone);
    });
  }

  // ── Order helpers ──────────────────────────────────────────────────

  function applyOrder(list, order) {
    if (!order || order === 'sequential') return list;
    if (order === 'simultaneous') return list;
    if (order === 'reverse') {
      var copy = [];
      for (var i = list.length - 1; i >= 0; i--) copy.push(list[i]);
      return copy;
    }
    return list;
  }

})();
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  CSV Data Source Plugin
//  — Loads polar chart daily temperature data from a static CSV file
//  — Format: year, then 365 (or 366) comma-separated daily temperature values
//  — Each row = one year of daily temperatures
//  — Comment lines (#) and blank lines are ignored
//
//  Returns: { groups: [{ name, series: [{ label, values }] }], angles, unit }
//  where each series has 365 daily values matching the ERA5 source
// ═══════════════════════════════════════════════════════════════════════
//
//  CSV format:
//    year,values
//    2015,7.2,8.5,11.8,15.3,19.1,23.5,26.2,25.8,21.4,16.1,10.3,7.8
//    2016,6.8,8.2,12.1,15.8,19.5,23.8,26.5,26.1,21.7,16.3,10.5,7.5
//
//  Returns: { groups: [{ name: 'TEMPERATURE', series: [{ label, values }] }] }
//  where each series has 365 daily values interpolated from the 12 monthly means

window.HAL = window.HAL || {};
window.HAL.data = window.HAL.data || {};
window.HAL.data.sources = window.HAL.data.sources || {};

window.HAL.data.sources.csv = {
  name: 'csv',

  fetch: function(dataSource) {
    var url = dataSource.url || 'data/polar-temperature.csv';

    return fetch(url).then(function(r) {
      if (!r.ok) throw new Error('CSV fetch failed: ' + r.status);
      return r.text();
    }).then(function(text) {
      var lines = text.split('\n');
      var series = [];
      var headerRow = true;
      // Daily angles: 0 to 359 degrees, 365 steps
      var dailyAngles = [];
      for (var d = 0; d < 365; d++) {
        dailyAngles.push(Math.round(d * 360 / 365));
      }

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line || line.charAt(0) === '#') continue;

        var parts = line.split(',');
        for (var j = 0; j < parts.length; j++) {
          parts[j] = parts[j].trim();
        }

        if (headerRow) {
          headerRow = false;
          continue;
        }

        // First column is the year label, rest are daily values
        var label = parts[0];
        var values = [];
        for (var j = 1; j < parts.length; j++) {
          var v = parseFloat(parts[j]);
          if (!isNaN(v)) values.push(v);
        }
        if (values.length < 10) continue;

        series.push({
          label: label,
          values: values,
        });
      }

      return {
        groups: [{
          name: 'TEMPERATURE',
          series: series,
        }],
        angles: dailyAngles,
        unit: '°C',
      };
    });
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  ERA5 Data Source Plugin
//  — Fetches monthly ERA5-Land surface temperature means via Open-Meteo
//  — Proxied through serve.py /api/era5 (bypasses CORS)
//  — Averages across configured geographic locations
//  — Returns yearly-cyclic temperature data for any polar chart
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.data = window.HAL.data || {};
window.HAL.data.sources = window.HAL.data.sources || {};

(function() {

  window.HAL.data.sources.era5 = {
    name: 'era5',

    fetch: function(dataSource) {
      var params = [];
      var locations = (dataSource && dataSource.locations);
      if (locations) {
        params.push('locations=' + encodeURIComponent(JSON.stringify(locations)));
      }
      var now = new Date();
      var startYear = (dataSource && dataSource.startYear) || 2015;
      var endYear = (dataSource && dataSource.endYear) || now.getFullYear();
      params.push('startYear=' + startYear);
      params.push('endYear=' + endYear);

      var url = '/api/era5?' + params.join('&');

      return fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (!data || data.error) {
            return {
              error: data ? data.error : 'No response from ERA5 API',
              groups: []
            };
          }
          var years = Object.keys(data.yearlyTemps || {}).sort();
          var series = years.map(function(y) {
            var yd = data.yearlyTemps[y];
            // yd is { daily: [temps], monthly: [12 means] }
            var dailyVals = (yd && yd.daily) || [];
            var monthlyVals = (yd && yd.monthly) || [];
            var validDaily = dailyVals.filter(function(v){return v!=null;});
            return {
              label: y,
              values: dailyVals,
              _monthlyValues: monthlyVals,
              _partial: validDaily.length < 300
            };
          });

          return {
            yearlyTemps: data.yearlyTemps,
            groups: [{
              name: 'TEMPERATURE',
              series: series
            }]
          };
        })
        .catch(function(err) {
          return {
            error: 'ERA5 fetch failed: ' + (err.message || String(err)),
            groups: []
          };
        });
    }
  };

})();
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Inline Data Source Plugin
//  — Returns data embedded directly in radiator.yaml
//  — Only returns what the user explicitly wrote. No random/demo values.
// ═══════════════════════════════════════════════════════════════════════
//
//  Usage:
//    dataSource:
//      type: inline
//      groups:
//        - name: API-GATEWAY
//          series:
//            - label: p99
//              values: [60, 70, 85, 110]
//
//  Returns:
//    { groups: [...] }  (empty groups = no-data state)

window.HAL = window.HAL || {};
window.HAL.data = window.HAL.data || {};
window.HAL.data.sources = window.HAL.data.sources || {};

window.HAL.data.sources.inline = {
  name: 'inline',

  fetch: function(dataSource) {
    // Primary: canonical groups + series shape
    if (dataSource && dataSource.groups) {
      return { groups: dataSource.groups };
    }
    // Legacy shapes — kept for backward compat with existing cards
    if (dataSource && dataSource.columns) {
      return { columns: dataSource.columns, rows: dataSource.rows || [] };
    }
    if (dataSource && dataSource.objects) {
      return { objects: dataSource.objects, connections: dataSource.connections || [] };
    }
    if (dataSource && dataSource.series) {
      return { series: dataSource.series };
    }
    if (dataSource && dataSource.hierarchy) {
      return { hierarchy: dataSource.hierarchy };
    }
    if (dataSource && dataSource.tree) {
      return { tree: dataSource.tree, connections: dataSource.connections || [] };
    }
    if (dataSource && dataSource.rows) {
      return { rows: dataSource.rows };
    }
    // No data configured — returns empty groups
    return { groups: [] };
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Orbital Data Source Plugin
//  — Computes Keplerian orbital positions at runtime
//  — No API calls, no network, no stale data
//  — Built-in element tables for Solar System bodies + major moons
//
//  Usage in radiator.yaml:
//    dataSource:
//      type: orbital
//      center: sun           # center body name (lowercase)
//      bodies:
//        - name: earth
//          boldArc: 60       # display annotations only
//          markers:
//            - angle: 45
//              label: EARTH
//              style: solid
//
//  Returns:
//    {
//      center: 'SOL',
//      series: [
//        { label, r, bodyAngle, eccentricity, omega, boldArc, markers, value },
//        ...
//      ]
//    }
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.data = window.HAL.data || {};
window.HAL.data.sources = window.HAL.data.sources || {};

(function() {

  // ── J2000.0 epoch ──────────────────────────────────────────────────
  // 2000-01-01T12:00:00Z = Unix 946728000000
  var J2000_MS = 946728000000;
  var MS_PER_DAY = 86400000;

  // ── Keplerian element tables ───────────────────────────────────────
  // Sources: JPL planetary elements (J2000), JPL satellite ephemerides
  // Fields:
  //   a   — semi-major axis (AU for heliocentric, km for planetocentric)
  //   e   — eccentricity
  //   w   — argument of perihelion / periapsis (degrees)
  //   M0  — mean anomaly at J2000 epoch (degrees)
  //   n   — mean motion (degrees per day)
  //   isKm — true if a is in km (planetocentric), false if AU

  var PLANETS = {
    mercury: { a:0.387099, e:0.205635, w:29.127,  M0:174.79,  n:4.0923,  isKm:false },
    venus:   { a:0.723336, e:0.006777, w:55.186,  M0:50.416,  n:1.6021,  isKm:false },
    earth:   { a:1.000003, e:0.016709, w:102.937, M0:-2.481,  n:0.9856,  isKm:false },
    mars:    { a:1.523679, e:0.093401, w:286.502, M0:19.387,  n:0.5240,  isKm:false },
    jupiter: { a:5.202603, e:0.048498, w:273.867, M0:20.020,  n:0.0831,  isKm:false },
    saturn:  { a:9.554910, e:0.055546, w:339.391, M0:317.020, n:0.0337,  isKm:false },
    uranus:  { a:19.21845, e:0.046295, w:96.998,  M0:140.229, n:0.0119,  isKm:false },
    neptune: { a:30.11039, e:0.008988, w:264.763, M0:256.780, n:0.0060,  isKm:false },
  };

  var MOONS = {
    // Earth
    luna: { a:384400, e:0.0549, w:0.0, M0:0.0, n:13.176, isKm:true },

    // Mars
    phobos:  { a:9376,  e:0.0151, w:0.0, M0:0.0, n:1128.8, isKm:true },
    deimos:  { a:23464, e:0.0002, w:0.0, M0:0.0, n:285.2,  isKm:true },

    // Jupiter
    io:       { a:421800,  e:0.0041,  w:0.0, M0:0.0, n:203.49, isKm:true },
    europa:   { a:671100,  e:0.0094,  w:0.0, M0:0.0, n:101.37, isKm:true },
    ganymede: { a:1070400, e:0.0013,  w:0.0, M0:0.0, n:50.32,  isKm:true },
    callisto: { a:1882700, e:0.0074,  w:0.0, M0:0.0, n:21.57,  isKm:true },
    amalthea: { a:181400,  e:0.0032,  w:0.0, M0:0.0, n:722.5,  isKm:true },
    himalia:  { a:11460000,e:0.162,   w:0.0, M0:0.0, n:0.568,  isKm:true },
    elara:    { a:11740000,e:0.217,   w:0.0, M0:0.0, n:0.546,  isKm:true },
    pasiphae: { a:23624000,e:0.409,   w:0.0, M0:0.0, n:0.189,  isKm:true },

    // Saturn
    mimas:    { a:185540,  e:0.0196,  w:0.0, M0:0.0, n:381.99, isKm:true },
    enceladus:{ a:238040,  e:0.0047,  w:0.0, M0:0.0, n:262.73, isKm:true },
    tethys:   { a:294620,  e:0.0001,  w:0.0, M0:0.0, n:190.70, isKm:true },
    dione:    { a:377420,  e:0.0022,  w:0.0, M0:0.0, n:131.53, isKm:true },
    rhea:     { a:527070,  e:0.001,   w:0.0, M0:0.0, n:79.69,  isKm:true },
    titan:    { a:1221870, e:0.0288,  w:0.0, M0:0.0, n:22.57,  isKm:true },
    hyperion: { a:1481010, e:0.123,   w:0.0, M0:0.0, n:16.92,  isKm:true },
    iapetus:  { a:3560820, e:0.0293,  w:0.0, M0:0.0, n:4.537,  isKm:true },
    phoebe:   { a:12947600,e:0.163,   w:0.0, M0:0.0, n:0.654,  isKm:true },

    // Uranus
    miranda:  { a:129390,  e:0.0013,  w:0.0, M0:0.0, n:254.69, isKm:true },
    ariel:    { a:190900,  e:0.0012,  w:0.0, M0:0.0, n:142.84, isKm:true },
    umbriel:  { a:266000,  e:0.0039,  w:0.0, M0:0.0, n:86.87,  isKm:true },
    titania:  { a:435910,  e:0.0011,  w:0.0, M0:0.0, n:41.35,  isKm:true },
    oberon:   { a:583520,  e:0.0014,  w:0.0, M0:0.0, n:26.74,  isKm:true },

    // Neptune
    triton:   { a:354759,  e:0.0000,  w:0.0, M0:0.0, n:61.26,  isKm:true },
    nereid:   { a:5513800, e:0.7500,  w:0.0, M0:0.0, n:0.999,  isKm:true },
  };

  // ── Center lookup ──────────────────────────────────────────────────
  // Map center name → which element table to use
  var CENTER_TABLES = {
    sun:     'planets',
    sol:     'planets',
    earth:   'moons',
    jupiter: 'moons',
    saturn:  'moons',
    uranus:  'moons',
    neptune: 'moons',
    mars:    'moons',
  };

  // ── Alias map ──────────────────────────────────────────────────────
  // YAML name → element table key (all lowercase)
  var ALIASES = {
    mercury: 'mercury', venus: 'venus', earth: 'earth', mars: 'mars',
    jupiter: 'jupiter', saturn: 'saturn', uranus: 'uranus', neptune: 'neptune',
    luna: 'luna', moon: 'luna',
    phobos: 'phobos', deimos: 'deimos',
    io: 'io', europa: 'europa', eur: 'europa', ganymede: 'ganymede', gny: 'ganymede',
    callisto: 'callisto', amalthea: 'amalthea', himalia: 'himalia', elara: 'elara',
    pasiphae: 'pasiphae',
    mimas: 'mimas', enceladus: 'enceladus', tethys: 'tethys', dione: 'dione',
    rhea: 'rhea', titan: 'titan', hyperion: 'hyperion', iapetus: 'iapetus',
    phoebe: 'phoebe',
    miranda: 'miranda', ariel: 'ariel', umbriel: 'umbriel',
    titania: 'titania', oberon: 'oberon',
    triton: 'triton', nereid: 'nereid',
  };

  // ── Body label overrides ───────────────────────────────────────────
  // YAML name → display label
  var LABELS = {
    luna: 'LUNA', eur: 'EUR', gny: 'GNY',
  };

  // ── Kepler solver ──────────────────────────────────────────────────
  function solveKepler(el, daysSinceEpoch) {
    var M = el.M0 + el.n * daysSinceEpoch;
    M = ((M % 360) + 360) % 360;
    var Mrad = M * Math.PI / 180;
    var e = el.e;

    // Newton iteration for eccentric anomaly
    var E = Mrad;
    for (var iter = 0; iter < 12; iter++) {
      var dE = (E - e * Math.sin(E) - Mrad) / (1 - e * Math.cos(E));
      E = E - dE;
      if (Math.abs(dE) < 1e-12) break;
    }

    // True anomaly
    var cosE = Math.cos(E);
    var sinE = Math.sin(E);
    var nu = 2 * Math.atan2(
      Math.sqrt(1 + e) * Math.sin(E / 2),
      Math.sqrt(1 - e) * Math.cos(E / 2)
    );
    if (nu < 0) nu += 2 * Math.PI;

    // Distance
    var r = el.a * (1 - e * cosE);

    // Body angle = true anomaly + argument of periapsis
    var bodyAngle = ((nu * 180 / Math.PI) + el.w + 360) % 360;

    return { r: r, bodyAngle: bodyAngle, trueAnomalyDeg: nu * 180 / Math.PI };
  }

  // ── SVG pixel radius from distance ─────────────────────────────────
  // Planets: a in AU → sqrt(AU) scale
  // Moons:   a in km → sqrt(km/1000) scale
  function distanceToPixelR(a, isKm) {
    if (isKm) {
      return Math.sqrt(a / 1000) * 3.0;
    }
    return Math.sqrt(a) * 50;
  }

  // ── Lagrange point generator ────────────────────────────────────────
  // Computes L1-L5 positions relative to a body's position.
  // Uses the restricted 3-body approximation:
  //   L1 — between primary and secondary, r × 0.849
  //   L2 — beyond secondary,            r × 1.168
  //   L3 — opposite side                r (≈ same distance)
  //   L4 — 60° ahead in orbit           r (equilateral triangle)
  //   L5 — 60° behind in orbit          r (equilateral triangle)
  //
  // cfg can be boolean true (all defaults) or an object:
  //   { points: ['L4','L5'] }          — only specific points
  //   { labels: {L4:'L4',L5:'L5'} }    — custom labels (default L1..L5)
  function generateLagrange(r, bodyAngle, cfg) {
    var points = [];
    var want = { L1:true, L2:true, L3:true, L4:true, L5:true };
    var labels = { L1:'L1', L2:'L2', L3:'L3', L4:'L4', L5:'L5' };

    if (typeof cfg === 'object' && cfg !== null) {
      if (cfg.points) {
        want = { L1:false, L2:false, L3:false, L4:false, L5:false };
        for (var pi = 0; pi < cfg.points.length; pi++) want[cfg.points[pi]] = true;
      }
      if (cfg.labels) {
        for (var lk in cfg.labels) labels[lk] = cfg.labels[lk];
      }
    }

    var defs = [
      { key:'L1', angle: bodyAngle,            r: r * 0.849 },
      { key:'L2', angle: bodyAngle,            r: r * 1.168 },
      { key:'L3', angle: (bodyAngle + 180) % 360, r: r },
      { key:'L4', angle: (bodyAngle + 60)  % 360, r: r },
      { key:'L5', angle: (bodyAngle - 60 + 360) % 360, r: r },
    ];

    for (var di = 0; di < defs.length; di++) {
      if (want[defs[di].key]) {
        points.push({
          label: labels[defs[di].key],
          angle: defs[di].angle,
          r: defs[di].r,
        });
      }
    }
    return points;
  }

  // ── Fetch ──────────────────────────────────────────────────────────
  var plugin = {
    name: 'orbital',

    fetch: function(dataSource) {
      if (!dataSource || !dataSource.center || !dataSource.bodies) {
        return null;
      }

      var centerKey = dataSource.center.toLowerCase().replace(/[^a-z]/g, '');
      var tableType = CENTER_TABLES[centerKey] || 'planets';
      var table = tableType === 'planets' ? PLANETS : MOONS;

      var now = Date.now();
      var daysSinceJ2000 = (now - J2000_MS) / MS_PER_DAY;

      var result = {
        center: dataSource.center,
        series: [],
      };

      for (var bi = 0; bi < dataSource.bodies.length; bi++) {
        var body = dataSource.bodies[bi];
        var bodyName = (body.name || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        var elKey = ALIASES[bodyName];
        if (!elKey) {
          return { error: 'Unknown body: "' + body.name + '" around ' + dataSource.center, groups: [] };
        }

        var el = table[elKey];
        if (!el) {
          // Try the other table
          var otherTable = tableType === 'planets' ? MOONS : PLANETS;
          el = otherTable[elKey];
        }
        if (!el) {
          return { error: 'No ephemeris data for "' + body.name + '" around ' + dataSource.center, groups: [] };
        }

        var pos = solveKepler(el, daysSinceJ2000);

        // Value: approximate magnitude weight from radius
        var val = Math.round(Math.sqrt(el.a) * (el.isKm ? 0.08 : 3));
        if (val < 1) val = 1;
        if (val > 20) val = 20;

        // Compute data-unit radius for this body
        var bodyR = distanceToPixelR(el.a, el.isKm);

        // Build markers: user-defined first, then auto Lagrange points
        var markers = (body.markers || []).slice();

        if (body.lagrange) {
          var lgPoints = generateLagrange(bodyR, pos.bodyAngle, body.lagrange);
          markers = markers.concat(lgPoints);
        }

        result.series.push({
          label: (LABELS[bodyName] || bodyName.toUpperCase()),
          r: bodyR,
          bodyAngle: pos.bodyAngle,
          eccentricity: el.e,
          omega: el.w,
          boldArc: body.boldArc || 45,
          markers: markers,
          value: body.value || val,
        });
      }

      return result;
    },
  };

  window.HAL.data.sources.orbital = plugin;

})();
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  VictoriaMetrics Data Source Plugin
//  — Fetches time-series data from VictoriaMetrics PromQL API
//  — Works from any HTTP server (VM has open CORS,
//    Access-Control-Allow-Origin: *)
//
//  Usage in config.js:
//    { type: 'chart', ...
//      dataSource: {
//        type: 'victoria',
//        url: 'http://192.168.50.9:8428',
//        range: 300,            // time window in seconds (default 300)
//        step: 30,              // [optional] seconds between points.
//                               // If set, ALL points from VM are accepted
//                               // and the renderer adapts its grid spacing
//                               // to match the actual number of points.
//                               // If omitted, falls back to 'points' (default 60)
//                               // which computes step = range / (points - 1)
//        points: 60,            // [optional, used only when step is not set]
//                               // Target number of points (VM downsamples).
//                               // Sets step = range / (points - 1)
//        promql: '...',
//        map: {
//          group:  'name',        // Prometheus label → group name (band)
//          series: 'le',          // Prometheus label → series label, or null
//        },
//        alias: {                 // [optional] rename series labels
//          node_load1: "1 MIN",   //   exact match
//          node_load5: "5 MIN",
//          strip: "node_load"     //   or strip prefix from all series
//        }
//      }
//    }
//
//  If map.series is null, each group gets a single curve labelled 'value'.
//  If map.series is set (e.g. 'le' for percentiles), series with the same
//  group label are merged into one band, differentiated by the series label.
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.data = window.HAL.data || {};
window.HAL.data.sources = window.HAL.data.sources || {};

(function() {

  var plugin = {

    // ── Fetch ─────────────────────────────────────────────────────────
    // Returns a Promise that resolves to { groups: [ { name, series } ] }
    // or null if the config is invalid.
    fetch: function(dataSource) {
      if (!dataSource || !dataSource.url || !dataSource.promql) return null;

      var url = dataSource.url.replace(/\/+$/, '') + '/api/v1/query_range';
      var query = dataSource.promql;
      var map = dataSource.map || {};
      var groupLabel = map.group || 'group';
      var seriesLabel = map.series || null;

      // Configurable time window: range in seconds (default 300 = 5 min)
      var windowSec = dataSource.range || 300;
      var step;
      if (dataSource.step) {
        // User specified exact step — use it. ALL points are returned.
        step = dataSource.step;
      } else {
        // Fall back to points-based step for backward compatibility.
        var nPoints = dataSource.points || 60;
        step = Math.max(Math.floor(windowSec / (nPoints - 1)), 1);
      }

      var now = Date.now() / 1000;
      var start = now - windowSec;

      return fetch(url + '?' + [
        'query=' + encodeURIComponent(query),
        'start=' + start,
        'end=' + now,
        'step=' + step
      ].join('&'), { signal: AbortSignal.timeout(10000) })
        .then(function(r) { if (!r.ok) throw new Error('VM fetch failed: ' + r.status); return r.json(); })
        .then(function(json) { return plugin.transform(json, groupLabel, seriesLabel, dataSource); });
    },

    // ── Transform ─────────────────────────────────────────────────────
    // Parses a Prometheus query_range JSON response into the canonical
    // { groups: [ { name, series: [ { label, values } ] } ] } structure.
    transform: function(json, groupLabel, seriesLabel, dataSource) {
      if (!json || !json.data || !json.data.result) return null;

      var results = json.data.result;
      var groupMap = {};  // { groupName: { seriesName: [values] } }

      // Prepare alias map: exact matches take priority over strip
      var alias = (dataSource && dataSource.alias) || {};
      var strip = (typeof alias.strip === 'string') ? alias.strip : null;

      for (var i = 0; i < results.length; i++) {
        var metric = results[i].metric;
        var values = results[i].values;

        var grpName = metric[groupLabel] || 'unknown';
        var serName = seriesLabel ? (metric[seriesLabel] || 'value') : 'value';

        // Apply alias: exact match first, then strip prefix
        serName = alias[serName] || serName;
        if (strip && serName.indexOf(strip) === 0) {
          serName = serName.slice(strip.length);
        }

        var vals = [];
        for (var vi = 0; vi < values.length; vi++) {
          vals.push(parseFloat(values[vi][1]));
        }
        if (vals.length === 0) continue;

        if (!groupMap[grpName]) groupMap[grpName] = {};
        groupMap[grpName][serName] = vals;
      }

      // Flatten groupMap into the canonical array structure
      var groups = [];
      var grpNames = Object.keys(groupMap);
      for (var gi = 0; gi < grpNames.length; gi++) {
        var gn = grpNames[gi];
        var series = [];
        var serNames = Object.keys(groupMap[gn]);
        for (var si = 0; si < serNames.length; si++) {
          series.push({ label: serNames[si], values: groupMap[gn][serNames[si]] });
        }
        groups.push({ name: gn, series: series });
      }

      return { groups: groups };
    },

  };

  window.HAL.data.sources.victoria = plugin;
})();
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Data Fetcher — Source dispatch + error handling
//  - Routes fetch to the appropriate source plugin
//  - Returns { groups, error, stale, faultCard }
//  - Fault behaviour is configurable per-card + global default
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.data = window.HAL.data || {};

var DF = window.HAL.data;

/**
 * Fetch data for a card.
 *
 * @param {Object} card — Card config from the flattened radiator.yaml
 * @returns {Promise<{
 *   groups: Array<{name: string, series: Array<{label: string, values: number[]}>}>,
 *   error: ?{message: string, source: string},
 *   stale: boolean,
 *   faultCard: ?string   // 'non-function' | null
 * }>}
 */
DF.fetchCardData = function(card) {
  var df = card.dataFault || DF.defaultDataFault || { mode: 'skip' };
  var ds = card.dataSource || { type: 'inline' };
  var plugin = DF.sources[ds.type];

  if (!plugin) {
    return buildFaultResult(df, 'Unknown data source type: "' + ds.type + '"', ds.type);
  }

  try {
    var result = plugin.fetch(ds, card);

    // Handle synchronous result
    if (result && typeof result.then !== 'function') {
      return Promise.resolve(normalize(result, df));
    }

    // Handle async result
    return result.then(function(data) {
      return normalize(data, df);
    }).catch(function(err) {
      return buildFaultResult(df, err.message || String(err), ds.type);
    });
  } catch (err) {
    return buildFaultResult(df, err.message || String(err), ds.type);
  }
};

// ── Helpers ───────────────────────────────────────────────────────────

/**
 * Normalize a successful data packet.
 * Ensures it has the canonical shape even if the source returns a bare object.
 */
function normalize(data, df) {
  if (!data || typeof data !== 'object') {
    return buildFaultResult(df, 'Source returned invalid data', '?');
  }
  // Start from source data, then overlay canonical fields
  var out = {};
  for (var k in data) if (data[k] != null) out[k] = data[k];
  out.error = null;
  out.stale = data.stale || false;
  out.faultCard = null;
  if (!out.groups) out.groups = [];
  return out;
}

/**
 * Build a fault result based on the fault config.
 *   df = { mode: 'skip' | 'hide' | 'non-function', defaultDuration, card }
 */
function buildFaultResult(df, message, sourceType) {
  var mode = (df && df.mode) || 'skip';
  var out = {
    groups: [],
    error: { message: message, source: sourceType },
    stale: false,
    faultCard: null,
    _faultConfig: df || {},
  };

  if (mode === 'non-function') {
    out.faultCard = 'non-function';
    // Pass fault details through _faultConfig so the non-function card can
    // render the message + tooltip. The original card's config is preserved.
  }

  return out;
}

// Default global fault config — overridden by radiator.yaml dataFault at boot
DF.defaultDataFault = { mode: 'skip' };
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  App — Orchestrator
//  — Boots by fetching /api/config from the server
//  — Then cycles cards, handles keyboard controls
//  — Uses a generation counter to prevent stale callbacks from
//    racing with manual navigation
// ═══════════════════════════════════════════════════════════════════════

(function() {
  var svgEl = document.getElementById('card');

  // Fetch config from server, then boot the radiator
  fetch('/api/config').then(function(r) { return r.json(); }).then(function(cfg) {
    window.HAL_CONFIG = cfg;
    boot(cfg);
  }).catch(function(err) {
    // Fallback: use whatever config.js set if available
    if (window.HAL_CONFIG) {
      boot(window.HAL_CONFIG);
    } else {
      document.body.innerHTML += 'ERROR: cannot fetch config &ndash; ' + err;
    }
  });

  function boot(cfg) {
    // Hide loading screen
    var loadingEl = document.getElementById('loading');
    if (loadingEl) { loadingEl.style.opacity = '0'; setTimeout(function() { loadingEl.style.display = 'none'; }, 1000); }
    if (!svgEl) { document.body.innerHTML += 'ERROR: no SVG element'; return; }
    if (!cfg || !cfg.cards || !cfg.cards.length) return;
    if (!window.HAL.cards || !window.HAL.cards.title) { document.body.innerHTML += 'ERROR: title renderer missing'; return; }

    // ── Set global data fault default ──────────────────────────────
    if (cfg.dataFault) {
      window.HAL.data.defaultDataFault = cfg.dataFault;
    }

    // ── Merge per-card dataFault (card-level overrides global) ─────
    for (var di = 0; di < cfg.cards.length; di++) {
      var card = cfg.cards[di];
      if (!card.dataFault && cfg.dataFault) {
        card.dataFault = cfg.dataFault;
      }
      // Composite zones inherit too
      if (card.type === 'composite' && card.zones) {
        for (var zj = 0; zj < card.zones.length; zj++) {
          var z = card.zones[zj];
          if (!z.dataFault && cfg.dataFault) {
            z.dataFault = cfg.dataFault;
          }
        }
      }
    }

    // ── Validate every card type has a registered renderer ─────────
    var missing = [];
    for (var i = 0; i < cfg.cards.length; i++) {
      var t = cfg.cards[i].type;
      if (t === 'composite') {
        var zones = cfg.cards[i].zones || [];
        for (var j = 0; j < zones.length; j++) {
          var ct = zones[j].chartType;
          if (ct && !window.HAL.cards[ct]) missing.push(ct + ' (zone ' + j + ' of card ' + i + ')');
        }
      }
      if (!window.HAL.cards[t]) missing.push(t + ' (card ' + i + ')');
    }
    if (missing.length > 0) {
      svgEl.style.display = 'none';
      var errEl = document.getElementById('boot-error');
      if (!errEl) {
        errEl = document.createElement('div');
        errEl.id = 'boot-error';
        document.body.insertBefore(errEl, document.body.firstChild);
      }
      errEl.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;' +
        'background:#0a0e12;color:#e8e8e8;font-family:monospace;font-size:14px;' +
        'overflow:auto;z-index:9999;display:flex;flex-direction:column;' +
        'align-items:center;justify-content:center;padding:40px;box-sizing:border-box;';
      errEl.innerHTML =
        '<div style="max-width:700px">' +
        '<h2 style="color:#ff6b7a;margin:0 0 8px">CONFIGURATION ERROR</h2>' +
        '<p style="color:#aaa;margin:0 0 20px">' + missing.length + ' card renderer(s) not found</p>' +
        '<div style="background:#161a20;border:1px solid #2a2e36;border-radius:6px;padding:16px;margin-bottom:20px">' +
        '<code style="white-space:pre-wrap;line-height:1.6">' +
        missing.join('\n') +
        '</code></div>' +
        '<p style="color:#888;font-size:13px;margin:0">' +
        'Each card type must have a corresponding renderer registered as ' +
        '<code>window.HAL.cards["&lt;type&gt;"]</code> in a .js file under ' +
        '<code>src/cards/</code>. The filename does not need to match the type name — ' +
        'the renderer registers itself by setting <code>window.HAL.cards[type]</code>.</p>' +
        '</div>';
      return;
    }

    var idx = 0, locked = false, autoTimer = null, zoom = 1.0;
    var wrap = document.getElementById('wrap');
    var gen = 0;  // incremented on every showCard → invalidates stale callbacks
    var currentCardType = null;  // tracks last-shown card type for _cleanup
    var compositeContainers = [];  // zone _container elements from composite cards

    function clearAuto() {
      if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    }

    function clearCard(color) {
      if (color) document.body.style.background = color;
      svgEl.innerHTML = '';
      window.HAL.svg.addGlowFilter(svgEl);
      // Purge any leftover composite zone containers
      for (var ci = 0; ci < compositeContainers.length; ci++) {
        var cc = compositeContainers[ci];
        if (cc.parentNode) cc.parentNode.removeChild(cc);
      }
      compositeContainers = [];
    }

    // Register a composite zone container for cleanup on card switch
    window.HAL._registerContainer = function(el) {
      compositeContainers.push(el);
    };

    // ── Guard: wraps a callback so it only fires if `myGen` still
    //     matches `gen`.  Prevents in-flight callbacks from a
    //     previous showCard from racing after a new transition.
    function guard(fn, myGen) {
      return function() {
        if (myGen !== gen) return;
        if (fn) fn();
      };
    }

    // ── Show a card by index ─────────────────────────────────────────
    function showCard(i, onDone) {
      clearAuto();
      gen++;
      var myGen = gen;
      var c = cfg.cards[i % cfg.cards.length];

      // Lifecycle: clean up the previous card's renderer before switching
      if (currentCardType && currentCardType !== c.type) {
        var prev = window.HAL.cards[currentCardType];
        if (prev && prev._cleanup) prev._cleanup();
      }

      clearCard(c.color);

      if (c.type !== 'title') {
        window.HAL.data.fetchCardData(c)
          .then(function(data) {
            if (myGen !== gen) return;  // stale: user navigated away
            // Merge data into card config — skip null/undefined only
            if (data) for (var k in data) if (data[k] != null) c[k] = data[k];

            // Fault handling
            var cardType = c.type;
            var df = c.dataFault || window.HAL.data.defaultDataFault || {};
            var mode = df.mode || 'skip';

            if (data && data.error && mode === 'skip') {
              // Skip: advance immediately, no render
              var sk = window.HAL.cards[cardType];
              if (sk && sk._cleanup) sk._cleanup();
              var cb = guard(onDone, myGen); cb && cb();
              return;
            }
            if (data && data.error && mode === 'non-function') {
              cardType = 'non-function';
            }
            // mode 'hide' falls through — renders card with error state

            try {
              var r = window.HAL.cards[cardType];
              if (r && r._cleanup) r._cleanup();
              currentCardType = cardType;
              var cb = guard(onDone, myGen);
              r && r.render ? r.render(c, cb) : cb && cb();
            } catch(e) { console.error('Card render error [', cardType, ']:', e); var cb = guard(onDone, myGen); cb && cb(); }
          })
          .catch(function(e) { console.error('Card fetch error [', c.type, ']:', e); var cb = guard(onDone, myGen); cb && cb(); });
      } else {
        window.HAL.cards.title.render(c);
        currentCardType = 'title';
        if (onDone) {
          autoTimer = setTimeout(guard(onDone, myGen), cfg.timing.titleCardDisplay * 1000);
        }
      }
    }

    // ── Advance to the next card in sequence ─────────────────────────
    function scheduleNext() {
      clearAuto();
      transitionTo((idx + 1) % cfg.cards.length);
    }

    // ── Navigate to a specific card ─────────────────────────────────
    function transitionTo(nextIdx) {
      idx = nextIdx;
      showCard(idx, cardDone);
    }

    // ── Auto-advance callback ────────────────────────────────────────
    var MIN_DISPLAY_MS = 2000;  // minimum time a card must be visible (auto-advance only)
    var manualNav = false;     // set true during keyboard navigation

    function cardDone() {
      if (locked) { showCard(idx, cardDone); return; }

      // Only enforce minimum display time on auto-advance (not manual nav)
      if (!manualNav) {
        // If a card's animation / data fetch completed in under MIN_DISPLAY_MS it
        // had no meaningful content to show (e.g. a data source that was
        // unreachable).  Hold for the remaining time so the user sees
        // something instead of an instant flicker, then auto-advance.
        var elapsed = Date.now() - window.__cardStart;
        if (elapsed < MIN_DISPLAY_MS) {
          var myGen = gen;
          setTimeout(function() { if (myGen === gen) cardDone(); }, MIN_DISPLAY_MS - elapsed);
          return;
        }
      }

      manualNav = false;
      scheduleNext();
    }

    // ── Keyboard controls ────────────────────────────────────────────
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault(); locked = false; manualNav = true;
        window.__cardStart = Date.now();
        transitionTo((idx - 1 + cfg.cards.length) % cfg.cards.length);
      }
      else if (e.key === 'ArrowRight') {
        e.preventDefault(); locked = false; manualNav = true;
        window.__cardStart = Date.now();
        transitionTo((idx + 1) % cfg.cards.length);
      }
      else if (e.key === ' ') {
        e.preventDefault(); locked = !locked; manualNav = true;
        window.__cardStart = Date.now();
        locked ? showCard(idx, cardDone) : scheduleNext();
      }
      else if (e.key === '=' || e.key === '+') {
        e.preventDefault();
        zoom = Math.min(zoom + 0.25, 3.0);
        if (wrap) { wrap.style.transform = 'scale(' + zoom + ')'; wrap.classList.add('zoomed'); }
      }
      else if (e.key === '-') {
        e.preventDefault();
        zoom = Math.max(zoom - 0.25, 0.25);
        if (zoom === 1.0) {
          if (wrap) { wrap.style.transform = ''; wrap.classList.remove('zoomed'); }
        } else {
          if (wrap) { wrap.style.transform = 'scale(' + zoom + ')'; wrap.classList.add('zoomed'); }
        }
      }
    });

    // ── Expose gotoCard for console / URL params
    window.HAL.gotoCard = transitionTo;

    // ── Boot sequence ──────────────────────────────────────────────────
    var startIdx = 0;
    try {
      var m = (window.location.search || '').match(/[?&]card=(\d+)/);
      if (m) startIdx = Math.min(Math.max(parseInt(m[1], 10), 0), cfg.cards.length - 1);
    } catch(e) {}
    window.__cardStart = Date.now();
    showCard(startIdx);
    autoTimer = setTimeout(function() { transitionTo((startIdx + 1) % cfg.cards.length); }, cfg.timing.initialPause || 5000);
  }
})();</script>
