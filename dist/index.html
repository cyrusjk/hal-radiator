<script>// ═══════════════════════════════════════════════════════════════════════
//  Curve-Family Chart Card
//  — Multi-band curve charts with config-driven animation
//  — Each band is a row (e.g. API-GATEWAY) containing multiple curves
//  — Brightness uses fg('frame', mult) and fg('data', mult)
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['curve-family'] = {

  render: function(data, onDone) {
    var svgEl = window.HAL.svg.getContainer(data);
    var vis = window.HAL_CONFIG.visual || {};
    var vc = vis.chart || {};
    var x0 = vc.x0 || 80, y0 = vc.y0 || 70;
    var cw = vc.w || 700, ch = vc.h || 520;
    var strokes = vc.strokes || [1.5, 1.0, 0.7];
    var dashes = vc.dashes || [null, "4,3", "1,3"];
    var titleFont = (vis.fonts || {}).title || 'sans-serif';
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var ns = window.HAL.svg.ns;
    var e = window.HAL.svg.el;

    var groupsData = data.groups || [];
    var nGroups = groupsData.length;
    if (nGroups === 0) { if (onDone) onDone(); return; }

    // Use actual data point count from fetched data (not vc.actualPts)
    // so VictoriaMetrics can return arbitrary-density points.
    var actualPts = (groupsData[0].series && groupsData[0].series[0] && groupsData[0].series[0].values)
      ? groupsData[0].series[0].values.length
      : (vc.actualPts || 9);
    if (actualPts < 2) { if (onDone) onDone(); return; }

    var margin = 60;
    var gridW = cw;
    var gridH = ch / nGroups;
    var bandH = gridH;
    var leftAxis = 80;
    var rightLabel = 140;

    // ── Group map — collected by the renderer for the animation engine ──
    var groupMap = {};
    var curveGroups = [];       // bands (one <g> per band)
    var minLabels = [];         // min value text elements
    var maxLabels = [];         // max value text elements
    var gridLines = [];         // horizontal grid lines (band separators)
    var verticalLines = [];     // vertical data column lines (sweep targets)
    var groupLabels = [];       // band/group name text elements

    // ── Card background ───────────────────────────────────────────────
    var bg = e('rect', { x: 0, y: 0, width: data.w || 1000, height: data.h || 750, fill: data.color });
    svgEl.appendChild(bg);

    // ── Header (title) ────────────────────────────────────────────────
    var header = e('text', {
      x: 20, y: 25, fill: fg('frame', 1.9), 'font-size': fs(14), 'font-family': labelFont,
      'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    header.textContent = (data.title || '') + '  ' + (data.label || '');
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // ── Grid + bands ──────────────────────────────────────────────────
    var gridG = e('g');
    svgEl.appendChild(gridG);
    var bandG = e('g');
    svgEl.appendChild(bandG);

    for (var gi = 0; gi < nGroups; gi++) {
      var g = groupsData[gi];
      var bandTop = gi * gridH;
      var series = g.series || [];

      // Band separator
      if (gi > 0) {
        gridLines.push(e('line', {
          x1: x0, y1: bandTop, x2: x0 + gridW, y2: bandTop,
          stroke: fg('frame', 0.2), 'stroke-width': 1,
        }));
      }

      // Fixed rows: find global max across all series in this band
      var bandMax = 1;
      for (var si = 0; si < series.length; si++) {
        var sv = series[si].values || [];
        for (var vi = 0; vi < sv.length; vi++) {
          if (sv[vi] > bandMax) bandMax = sv[vi];
        }
      }

      // Group label
      var glabel = e('text', {
        x: 15, y: bandTop + bandH / 2 + 4, fill: fg('frame', 1.0),
        'font-size': fs(11), 'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
        filter: 'url(#txtGlow)',
      });
      glabel.textContent = g.name;
      glabel.style.opacity = '0';
      svgEl.appendChild(glabel);
      groupLabels.push(glabel);

      // Data columns (vertical grid lines — sweep targets)
      for (var vi = 0; vi < actualPts; vi++) {
        var px = x0 + (vi / (actualPts - 1)) * gridW;
        verticalLines.push(e('line', {
          x1: px, y1: bandTop, x2: px, y2: bandTop + bandH,
          stroke: fg('frame', 0.12), 'stroke-width': 1,
        }));
      }

      // ── Container for this band's curves — hidden initially ─────────
      var grp = document.createElementNS(ns, 'g');
      grp.style.opacity = '0';
      bandG.appendChild(grp);

      // Draw each series
      for (var si = 0; si < series.length; si++) {
        var sv = series[si].values || [];
        var pathParts = [];
        for (var vi = 0; vi < sv.length && vi < actualPts; vi++) {
          var px = x0 + (vi / (actualPts - 1)) * gridW;
          var py = bandTop + bandH - (sv[vi] / bandMax) * (bandH - 20) - 10;
          pathParts.push((vi === 0 ? 'M' : 'L') + px.toFixed(1) + ',' + py.toFixed(1));
        }

        var strokeW = strokes[si % strokes.length] || 1.0;
        var dash = dashes[si % dashes.length];
        var pathAttrs = {
          d: pathParts.join(' '),
          fill: 'none',
          stroke: fg('data', 0.5 + si * 0.25),
          'stroke-width': strokeW,
          filter: 'url(#gfxGlow)',
        };
        if (dash) pathAttrs['stroke-dasharray'] = dash;
        grp.appendChild(e('path', pathAttrs));

        // Endpoint dot + value label
        var last = sv[Math.min(sv.length, actualPts) - 1];
        var lx = x0 + gridW;
        var ly = bandTop + bandH - (last / bandMax) * (bandH - 20) - 10;

        grp.appendChild(e('circle', {
          cx: lx, cy: ly, r: 2.5, fill: fg('data', 0.65),
          filter: 'url(#gfxGlow)',
        }));

        var serLabel = e('text', {
          x: lx + 6, y: ly + 3, fill: fg('data', 0.65),
          'font-size': fs(10), 'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
          filter: 'url(#txtGlow)',
        });
        serLabel.textContent = series[si].label;
        grp.appendChild(serLabel);

        // Find min/max for value labels
        var minVal = sv[0], maxVal = sv[0];
        var minIdx = 0, maxIdx = 0;
        for (var mvi = 1; mvi < sv.length; mvi++) {
          if (sv[mvi] < minVal) { minVal = sv[mvi]; minIdx = mvi; }
          if (sv[mvi] > maxVal) { maxVal = sv[mvi]; maxIdx = mvi; }
        }

        var mlx = x0 + (minIdx / (actualPts - 1)) * gridW;
        var mly = bandTop + bandH - (minVal / bandMax) * (bandH - 20) - 10;
        var mn = e('text', {
          x: mlx, y: mly - 12, fill: fg('data', 1.1), 'font-size': fs(14),
          'font-family': labelFont, 'text-anchor': 'middle', 'text-rendering': 'optimizeLegibility',
          filter: 'url(#txtGlow)',
        });
        mn.style.opacity = '0';
        mn.textContent = minVal.toFixed(1);
        svgEl.appendChild(mn);
        minLabels.push(mn);

        var mlx2 = x0 + (maxIdx / (actualPts - 1)) * gridW;
        var mly2 = bandTop + bandH - (maxVal / bandMax) * (bandH - 20) - 10;
        var mx = e('text', {
          x: mlx2, y: mly2 - 12, fill: fg('data', 1.1), 'font-size': fs(14),
          'font-family': labelFont, 'text-anchor': 'middle', 'text-rendering': 'optimizeLegibility',
          filter: 'url(#txtGlow)',
        });
        mx.style.opacity = '0';
        mx.textContent = maxVal.toFixed(1);
        svgEl.appendChild(mx);
        maxLabels.push(mx);
      }

      curveGroups.push(grp);
    }

    // Add grid lines (behind everything)
    gridG.style.opacity = '0';
    for (var gli = 0; gli < gridLines.length; gli++) {
      gridG.appendChild(gridLines[gli]);
    }
    // Vertical lines — stored as array for sequential draw sweep
    // so executePhases expands each child into its own element for drawOne.
    var verticalG = e('g');
    svgEl.insertBefore(verticalG, bandG);
    for (var vli = 0; vli < verticalLines.length; vli++) {
      verticalG.appendChild(verticalLines[vli]);
    }

    // ── Footer ────────────────────────────────────────────────────────
    var footer = e('text', {
      x: 15, y: 740, fill: fg('frame', 0.85), 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Build the group map for the animation engine ──────────────────
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.verticalLines = verticalLines;
    groupMap.grid = gridG;
    groupMap.groupLabels = groupLabels;
    groupMap.bands = curveGroups;
    groupMap.minValues = minLabels;
    groupMap.maxValues = maxLabels;

    // ── Start the animation ───────────────────────────────────────────
    var defaults = [
      { action: 'appear',     groups: ['header', 'footer', 'grid', 'groupLabels'] },
      { action: 'wait',       duration: window.HAL_CONFIG.timing.initialPause || 5000 },
      { action: 'flickerIn',  groups: ['bands'], order: 'sequential', gap: window.HAL_CONFIG.timing.groupGap },
      { action: 'wait',       duration: 2000 },
      { action: 'appear',     groups: ['minValues'] },
      { action: 'appear',     groups: ['maxValues'] },
      { action: 'wait',       duration: window.HAL_CONFIG.timing.valueHold || 5000 },
      { action: 'disappear',  groups: ['maxValues'] },
      { action: 'disappear',  groups: ['minValues'] },
      { action: 'flickerOut', groups: ['bands'], order: 'sequential', gap: window.HAL_CONFIG.timing.groupGap },
      { action: 'wait',       duration: 300 },
      { action: 'disappear',  groups: ['header', 'footer', 'grid', 'groupLabels'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },

};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Dock Stack Card — 3D Box Stack Approach Animation
//  — 7 white-stroke boxes in 3D perspective, unwinding from rotation
//  — Front-to-back sequential fade in last N% of animation
//  — Static dock24 red markers + white center circle overlay
//  — No live data, purely decorative
//
//  Config (from radiator.yaml / prototypes.yaml):
//    chartType: dock-stack
//    color: "rgb(17,18,20)"     (background)
//    cfg:
//      duration: 40000          total animation ms
//      endDelay: 5000           additional ms on final frame before onDone
//      fadeWindow: 10           % of duration used for fade cascade
//
//  DESIGN SPEC: ~/sync/hermes/wiki/references/dock-stack-spec.md
//
//  Architecture:
//    A single position:fixed overlay div covers the viewport. Inside:
//    — CSS 3D scene using vw/vh units (scalable by definition)
//    — Overlay markers SVG (viewBox "0 0 640 360") fills the same space
//    The card SVG only gets a background rect.  Cleanup removes the
//    overlay div + injected keyframes when the animation ends.
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['dock-stack'] = {

  // ── Tunable defaults (as % of viewport width/height) ────────────
  config: {
    duration:       40000,   // total animation ms
    endDelay:       5000,    // ms to hold on final frame before onDone
    layerCount:     7,
    scale:          0.72,
    zFront:         32.5,    // vw
    zBack:          77.5,    // vw
    zOrigin:        47.5,    // vw — transform-origin Z
    fadeWindow:     10,      // % of duration for fade cascade
    opacityFront:   0.960,   // front layer base opacity
    opacityBack:    0.800,   // back layer base opacity
    rotateXStart:   20,      // deg
    rotateYStart:   4,       // deg
    rotateZStart:   540,     // deg
  },

  // ── Layer SVG template ────────────────────────────────────────────
  // viewBox "-145 -49 290 98", overflow visible.
  // Width 52vw matches the original spec; aspect-ratio drives height.
  _layerSvgHTML: [
    '<svg width="290" height="98" viewBox="-145 -49 290 98" xmlns="http://www.w3.org/2000/svg" overflow="visible"',
    '  style="display:block;width:52vw;height:auto;aspect-ratio:290/98;mix-blend-mode:plus-lighter">',
    '  <rect x="-145" y="-49" width="290" height="98" rx="12" ry="12"',
    '    fill="none" stroke="rgba(255,255,255,1)" stroke-width="2.0" stroke-linecap="round"/>',
    '  <circle cx="0" cy="0" r="8" fill="none" stroke="rgba(255,255,255,1)"',
    '    stroke-width="1.2" stroke-linecap="round"/>',
    '  <line x1="-16" y1="0" x2="16" y2="0" stroke="rgba(255,255,255,1)"',
    '    stroke-width="1.2" stroke-linecap="round"/>',
    '  <line x1="0" y1="-16" x2="0" y2="16" stroke="rgba(255,255,255,1)"',
    '    stroke-width="1.2" stroke-linecap="round"/>',
    '  <g stroke="rgba(255,255,255,1)" stroke-width="1" stroke-linecap="round" fill="none">',
    '    <line x1="-148" y1="0" x2="-142" y2="0"/>',
    '    <line x1="-136" y1="0" x2="-130" y2="0"/>',
    '    <line x1="-124" y1="0" x2="-118" y2="0"/>',
    '    <line x1="-112" y1="0" x2="-106" y2="0"/>',
    '    <line x1="-100" y1="0" x2="-94" y2="0"/>',
    '    <line x1="-88"  y1="0" x2="-82" y2="0"/>',
    '    <line x1="-76"  y1="0" x2="-70" y2="0"/>',
    '    <line x1="-64"  y1="0" x2="-58" y2="0"/>',
    '    <line x1="-63" y1="-3" x2="-63" y2="3"/>',
    '    <line x1="-52"  y1="0" x2="-46" y2="0"/>',
    '    <line x1="-40"  y1="0" x2="-34" y2="0"/>',
    '    <line x1="34"   y1="0" x2="40"  y2="0"/>',
    '    <line x1="46"   y1="0" x2="52"  y2="0"/>',
    '    <line x1="58"   y1="0" x2="64"  y2="0"/>',
    '    <line x1="63" y1="-3" x2="63" y2="3"/>',
    '    <line x1="70"   y1="0" x2="76"  y2="0"/>',
    '    <line x1="82"   y1="0" x2="88"  y2="0"/>',
    '    <line x1="94"   y1="0" x2="100" y2="0"/>',
    '    <line x1="106"  y1="0" x2="112" y2="0"/>',
    '    <line x1="118"  y1="0" x2="124" y2="0"/>',
    '    <line x1="130"  y1="0" x2="136" y2="0"/>',
    '    <line x1="142"  y1="0" x2="148" y2="0"/>',
    '  </g>',
    '  <g stroke="rgba(255,255,255,1)" stroke-width="1" stroke-linecap="round" fill="none">',
    '    <line x1="0" y1="-52" x2="0" y2="-46"/>',
    '    <line x1="0" y1="-40" x2="0" y2="-34"/>',
    '    <line x1="0" y1="34" x2="0" y2="40"/>',
    '    <line x1="0" y1="46" x2="0" y2="52"/>',
    '  </g>',
    '</svg>'
  ].join('\n'),

  // ── Render ────────────────────────────────────────────────────────
  render: function(data, onDone) {
    var bgColor = data.color || '#1a1a1a';

    // ── Cleanup previous run ────────────────────────────────────────
    this._cleanup();

    // ── Local config (don't mutate this.config) ──────────────────────
    var cfg = window.HAL.svg.mergeConfig(this.config, data.cfg);

    // ── Background rect on the card SVG ─────────────────────────────
    var e = window.HAL.svg.el;
    var svgEl = window.HAL.svg.getContainer(data);
    svgEl.appendChild(e('rect', { x: 0, y: 0, width: 1000, height: 750, fill: bgColor }));

    // ── Overlay container — position:fixed, covers viewport ────────
    var overlay = document.createElement('div');
    overlay.id = 'dock-stack-overlay';
    overlay.style.cssText =
      'position:fixed;z-index:5;pointer-events:none;overflow:hidden;' +
      'top:0;left:0;width:100vw;height:100vh;';
    document.body.appendChild(overlay);

    // ── 3D CSS scene ──────────────────────────────────────────────
    var scene = document.createElement('div');
    scene.id = 'dock-stack-3d';
    scene.style.cssText =
      'position:absolute;top:0;left:0;width:100%;height:100%;' +
      'perspective:187.5vw;' +
      'perspective-origin:50% 50%;overflow:hidden;';

    // Stack-wrap (scale + translate, separated from rotation)
    var uid = this._uid();
    var sw = document.createElement('div');
    sw.style.cssText = 'width:100%;height:100%;transform-style:preserve-3d;';
    sw.style.animation = 'dock-shift-' + uid + ' ' + cfg.duration + 'ms linear forwards';
    scene.appendChild(sw);

    // Stack (rotation)
    var st = document.createElement('div');
    st.style.cssText = 'width:100%;height:100%;transform-style:preserve-3d;' +
      'transform-origin:50% 50% ' + cfg.zOrigin + 'vw;';
    st.style.animation = 'dock-unwind-' + uid + ' ' + cfg.duration + 'ms linear forwards';
    sw.appendChild(st);

    // ── Build layers ────────────────────────────────────────────────
    var N = cfg.layerCount;
    for (var i = 0; i < N; i++) {
      var z = this._zPos(i, cfg);
      var op = this._opacity(i, cfg);
      var ly = document.createElement('div');
      ly.style.cssText =
        'position:absolute;top:50%;left:50%;' +
        'translate:-50% -50%;transform-style:preserve-3d;' +
        'transform:translate3d(0, 0, ' + z + 'vw);' +
        'opacity:' + op.toFixed(3) + ';';
      ly.style.animation = 'dock-fade-' + uid + '-L' + i + ' ' + cfg.duration + 'ms linear forwards';
      ly.innerHTML = this._layerSvgHTML;
      st.appendChild(ly);
    }

    overlay.appendChild(scene);

    // ── Overlay markers SVG ─────────────────────────────────────────
    // Appended AFTER the 3D scene so markers render ON TOP.
    // viewBox "0 0 640 360" scaled to fill the viewport via
    // position:fixed (same coordinate space as the 3D scene).
    var markSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    markSvg.setAttribute('viewBox', '0 0 640 360');
    markSvg.style.cssText = 'display:block;width:100vw;height:100vh;';
    markSvg.innerHTML =
      '<g stroke="rgba(220,120,125,0.8)" stroke-linecap="round" fill="none" opacity="0.8">' +
      '<g stroke-width="2.3">' +
      '<line x1="353.2" y1="213.2" x2="374.4" y2="234.4"/>' +
      '<line x1="380.8" y1="240.8" x2="384.0" y2="244.0"/>' +
      '<line x1="390.7" y1="250.7" x2="473.6" y2="333.6"/>' +
      '<line x1="286.8" y1="213.2" x2="265.6" y2="234.4"/>' +
      '<line x1="259.2" y1="240.8" x2="256.0" y2="244.0"/>' +
      '<line x1="249.3" y1="250.7" x2="166.4" y2="333.6"/>' +
      '<line x1="286.8" y1="146.8" x2="265.6" y2="125.6"/>' +
      '<line x1="259.2" y1="119.2" x2="256.0" y2="116.0"/>' +
      '<line x1="249.3" y1="109.3" x2="166.4" y2="26.4"/>' +
      '<line x1="353.2" y1="146.8" x2="374.4" y2="125.6"/>' +
      '<line x1="380.8" y1="119.2" x2="384.0" y2="116.0"/>' +
      '<line x1="390.7" y1="109.3" x2="473.6" y2="26.4"/>' +
      // horizontal & vertical guide lines
      '<line x1="175" y1="180" x2="151" y2="180"/>' +
      '<line x1="320" y1="35" x2="320" y2="11"/>' +
      '<line x1="465" y1="180" x2="489" y2="180"/>' +
      '<line x1="320" y1="325" x2="320" y2="349"/>' +
      '</g>' +
      '<g stroke-width="1.8">' +
      '<path d="M 470.0 172.0 Q 471.5 180.0 470.0 188.0"/>' +
      '<path d="M 328.0 330.0 Q 320.0 331.5 312.0 330.0"/>' +
      '<path d="M 170.0 188.0 Q 168.5 180.0 170.0 172.0"/>' +
      '<path d="M 312.0 30.0 Q 320.0 28.5 328.0 30.0"/>' +
      '<path d="M 443.7 268.4 Q 428.2 288.2 408.4 303.7"/>' +
      '<path d="M 231.6 303.7 Q 211.8 288.2 196.3 268.4"/>' +
      '<path d="M 196.3 91.6 Q 211.8 71.8 231.6 56.3"/>' +
      '</g>' +
      '</g>' +
      '<circle cx="320" cy="180" r="30" fill="none" stroke="rgba(255,255,255,1)" stroke-width="2.3"/>';
    overlay.appendChild(markSvg);

    this._overlay = overlay;
    this._uidStr = uid;

    // ── Inject keyframes (vw/vh values) ─────────────────────────────
    this._injectStyles(cfg, uid);

    // ── Timer ──────────────────────────────────────────────────────
    var endDelay = data.endDelay != null ? data.endDelay : cfg.endDelay;
    var totalMs = cfg.duration + endDelay;
    var that = this;
    var timer = setTimeout(function() {
      that._cleanup();
      if (onDone) onDone();
    }, totalMs);

    this._timer = timer;
  },

  // ── Unique ID per render for keyframe names ─────────────────────
  _uid: (function() { var n = 0; return function() { return 'ds' + (n++); }; })(),

  // ── Z position (vw), i=0 is back, i=N-1 is front ────────────────
  _zPos: function(i, cfg) {
    var N = cfg.layerCount;
    if (N <= 1) return cfg.zFront;
    return cfg.zFront + (cfg.zBack - cfg.zFront) * (i / (N - 1));
  },

  // ── Opacity, i=0 is back, i=N-1 is front ─────────────────────────
  _opacity: function(i, cfg) {
    var N = cfg.layerCount;
    if (N <= 1) return cfg.opacityFront;
    var t = i / (N - 1);
    return cfg.opacityFront - t * (cfg.opacityFront - cfg.opacityBack);
  },

  // ── Fade keyframe start% — front (larger i) fades first ─────────
  _fadePct: function(i, cfg) {
    var N = cfg.layerCount;
    if (N <= 1) return 100 - cfg.fadeWindow;
    var slot = cfg.fadeWindow / N;
    return 100 - cfg.fadeWindow + (N - 1 - i) * slot;
  },

  // ── Inject @keyframes — all values in vw/vh ─────────────────────
  _injectStyles: function(cfg, uid) {
    var style = document.createElement('style');
    style.id = 'dock-stack-keyframes-' + uid;

    var css = '';
    css += '@keyframes dock-shift-' + uid + ' {\n' +
      '  0%   { transform: scale(' + cfg.scale + ') translate(-10vw, -25vh); }\n' +
      '  100% { transform: scale(' + cfg.scale + ') translate(0, 0); }\n' +
      '}\n';

    css += '@keyframes dock-unwind-' + uid + ' {\n' +
      '  0%   { transform: rotateX(' + cfg.rotateXStart + 'deg) rotateY(' + cfg.rotateYStart + 'deg) rotateZ(' + cfg.rotateZStart + 'deg); }\n' +
      '  100% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); }\n' +
      '}\n';

    var N = cfg.layerCount;
    for (var i = 0; i < N; i++) {
      var pct = this._fadePct(i, cfg);
      var op = this._opacity(i, cfg).toFixed(3);
      var slot = cfg.fadeWindow / N;
      var fadeEnd = Math.min(pct + slot, 100).toFixed(3);
      css += '@keyframes dock-fade-' + uid + '-L' + i + ' {\n' +
        '  0%, ' + pct + '% { opacity: ' + op + '; }\n' +
        '  ' + fadeEnd + '% { opacity: 0; }\n' +
        '  100% { opacity: 0; }\n' +
        '}\n';
    }

    style.textContent = css;
    document.head.appendChild(style);
  },

  // ── Remove overlay div ────────────────────────────────────────────
  _removeVisuals: function() {
    if (this._overlay) {
      var p = this._overlay.parentNode;
      if (p) p.removeChild(this._overlay);
      this._overlay = null;
    }
  },

  // ── Full cleanup: overlay + styles + timer ───────────────────────
  _cleanup: function() {
    this._removeVisuals();

    if (this._uidStr) {
      var style = document.getElementById('dock-stack-keyframes-' + this._uidStr);
      if (style) style.parentNode.removeChild(style);
      this._uidStr = null;
    }

    if (this._timer) {
      clearTimeout(this._timer);
      this._timer = null;
    }
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Hierarchical Edge Bundling Card
//  — Nodes arranged on a circle, curved connections bundled by hierarchy
//  — Connections between sibling sub-trees share more path = bundled
//  — Animation groups: header, footer, nodes, connections
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['edge-bundling'] = {

  render: function(data, onDone) {
    var svgEl = window.HAL.svg.getContainer(data);
    var vis = window.HAL_CONFIG.visual || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var e = window.HAL.svg.el;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var tree = data.tree;
    var connections = (data.connections || []);
    if (!tree || connections.length === 0) { if (onDone) onDone(); return; }

    var groupMap = {};
    var nodeElements = [];
    var connectionElements = [];

    // Layout
    var cx = 500, cy = 390;
    var nodeRadius = 250;  // circle radius for leaf nodes
    var bundleR = 120;     // inner radius for bundling (control point orbit)
    var dotR = 5;

    // Background
    svgEl.appendChild(e('rect', { x: 0, y: 0, width: data.w || 1000, height: data.h || 750, fill: data.color }));

    // Header
    var header = e('text', {
      x: 20, y: 25, fill: fg('frame', 1.9), 'font-size': fs(14),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    header.textContent = (data.title || '') + '  ' + (data.label || '');
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // Footer
    var footer = e('text', {
      x: 15, y: 740, fill: fg('frame', 0.85), 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Flatten hierarchy ─────────────────────────────────────────
    // Build node index with depth-first leaf order
    var leaves = [];
    var nodeById = {};

    function walk(node, depth, path) {
      var id = node.name;
      nodeById[id] = { node: node, depth: depth, path: path, children: [] };
      var kids = node.children || [];
      if (kids.length === 0) {
        leaves.push(id);
        return id;
      }
      for (var i = 0; i < kids.length; i++) {
        var childLeaf = walk(kids[i], depth + 1, path.concat(id));
        nodeById[id].children.push(childLeaf);
      }
      return nodeById[id].children[0]; // first leaf underneath
    }

    walk(tree, 0, []);
    var nLeaves = leaves.length;
    if (nLeaves === 0) { if (onDone) onDone(); return; }

    // Assign positions on the circle for each leaf
    var leafAngles = {};
    for (var li = 0; li < nLeaves; li++) {
      var angle = (li / nLeaves) * 2 * Math.PI - Math.PI / 2;
      leafAngles[leaves[li]] = angle;
    }

    function onCircle(angle, r) {
      return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
    }

    // Find deepest common ancestor depth for two leaves.
    // Returns null if either node is unknown (caller should skip).
    function commonDepth(a, b) {
      var infoA = nodeById[a];
      var infoB = nodeById[b];
      if (!infoA || !infoB) return null;
      var pathA = infoA.path;
      var pathB = infoB.path;
      var depth = 0;
      var maxD = Math.min(pathA.length, pathB.length);
      for (var i = 0; i < maxD; i++) {
        if (pathA[i] === pathB[i]) depth = i + 1;
        else break;
      }
      return depth;
    }

    // ── Render nodes ──────────────────────────────────────────────
    var nodeG = e('g');
    nodeG.style.opacity = '0';
    svgEl.appendChild(nodeG);

    for (var li = 0; li < nLeaves; li++) {
      var angle = leafAngles[leaves[li]];
      var pos = onCircle(angle, nodeRadius);
      // Dot
      nodeG.appendChild(e('circle', {
        cx: pos.x, cy: pos.y, r: dotR,
        fill: fg('frame', 1.0), stroke: fg('frame', 0.3), 'stroke-width': 1,
        filter: 'url(#gfxGlow)',
      }));
      // Label
      var label = e('text', {
        x: pos.x + (Math.cos(angle) > 0 ? 10 : -10),
        y: pos.y + 4,
        fill: fg('frame', 1.0), 'font-size': fs(9),
        'font-family': labelFont,
        'text-anchor': Math.cos(angle) > 0 ? 'start' : 'end',
        'text-rendering': 'optimizeLegibility',
        filter: 'url(#txtGlow)',
      });
      label.textContent = leaves[li];
      nodeG.appendChild(label);
      nodeElements.push({ dot: null, label: label });
    }

    // ── Render connections (bundled) ───────────────────────────────
    var connG = e('g');
    svgEl.appendChild(connG);

    for (var ci = 0; ci < connections.length; ci++) {
      var src = connections[ci].source;
      var tgt = connections[ci].target;
      if (leafAngles[src] === undefined || leafAngles[tgt] === undefined) continue;

      var a1 = leafAngles[src];
      var a2 = leafAngles[tgt];

      // Control point radius based on common ancestor depth
      var depth = commonDepth(src, tgt);
      if (depth === null) continue;  // edge case: node not in tree
      var maxDepth = 3;
      var bundleFrac = Math.min(1, depth / maxDepth);
      var cpR = bundleR + (nodeRadius - bundleR) * (1 - bundleFrac);
      if (cpR > nodeRadius - 10) cpR = nodeRadius - 10;

      // Control points at the bundle radius, midway between the two angles
      // Plus a radial offset to create the curve
      // Arc around the circle
      var midAngle = (a1 + a2) / 2;
      // Handle wrapping
      var diff = a2 - a1;
      if (diff > Math.PI) { a2 -= 2 * Math.PI; midAngle = (a1 + a2) / 2; }
      if (diff < -Math.PI) { a2 += 2 * Math.PI; midAngle = (a1 + a2) / 2; }
      diff = a2 - a1;

      // Control point 1: radial outward from source toward bundle
      var cp1x = cx + cpR * Math.cos(a1 + diff * 0.25);
      var cp1y = cy + cpR * Math.sin(a1 + diff * 0.25);
      // Control point 2: radial outward from target toward bundle
      var cp2x = cx + cpR * Math.cos(a2 - diff * 0.25);
      var cp2y = cy + cpR * Math.sin(a2 - diff * 0.25);

      var p1 = onCircle(a1, nodeRadius);
      var p2 = onCircle(a2, nodeRadius);

      var pathD = 'M ' + p1.x.toFixed(1) + ',' + p1.y.toFixed(1) +
                  ' C ' + cp1x.toFixed(1) + ',' + cp1y.toFixed(1) +
                  ' ' + cp2x.toFixed(1) + ',' + cp2y.toFixed(1) +
                  ' ' + p2.x.toFixed(1) + ',' + p2.y.toFixed(1);

      var op = 0.2 + (1 - bundleFrac) * 0.4;
      var line = e('path', {
        d: pathD,
        fill: 'none',
        stroke: fg('data', op),
        'stroke-width': 1.0 + (1 - bundleFrac) * 0.5,
        filter: 'url(#gfxGlow)',
      });
      connG.appendChild(line);
      connectionElements.push(line);
    }

    // ── Animation ─────────────────────────────────────────────────
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.nodes = nodeG;
    groupMap.connections = connectionElements;

    var defaults = [
      { action: 'appear',   groups: ['header', 'footer'] },
      { action: 'wait',     duration: 500 },
      { action: 'appear',   groups: ['nodes'] },
      { action: 'wait',     duration: 400 },
      { action: 'flickerIn', groups: ['connections'], order: 'sequential', gap: 200 },
      { action: 'wait',     duration: 8000 },
      { action: 'disappear', groups: ['connections'], order: 'reverse', gap: 150 },
      { action: 'wait',     duration: 300 },
      { action: 'disappear', groups: ['nodes'] },
      { action: 'wait',     duration: 300 },
      { action: 'disappear', groups: ['header', 'footer'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  NON FUNCTION Card — Fault state display
//  — Flickering "NON FUNCTION" text with a descriptive tooltip
//  — Referenced from 2001: A Space Odyssey at ~23:50
//  — Triggered by dataFault mode: 'non-function'
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['non-function'] = {

  config: {
    duration: 5000,
    flickerRate: 100,     // ms per flicker cycle
  },

  // ── Shared singleton style element ─────────────────────────────
  _ensureStyle: function() {
    if (document.getElementById('nf-shared-style')) return;
    var style = document.createElement('style');
    style.id = 'nf-shared-style';
    style.textContent =
      '@keyframes nf-flicker {\n' +
      '  0%{opacity:1} 10%{opacity:0.2} 16%{opacity:1} 28%{opacity:0.3}\n' +
      '  34%{opacity:1} 42%{opacity:0.1} 50%{opacity:1} 55%{opacity:0.4}\n' +
      '  60%{opacity:1} 75%{opacity:0.2} 82%{opacity:1} 90%{opacity:0.5}\n' +
      '  100%{opacity:1}\n' +
      '}\n' +
      '.nf-anim { animation: nf-flicker 100ms infinite; }';
    document.head.appendChild(style);
  },

  render: function(data, onDone) {
    var svgEl = window.HAL.svg.getContainer(data);
    var cfg = data.cfg || {};
    var e = window.HAL.svg.el;

    // Background — use the card's color or dark navy
    var bg = data.color || 'rgb(14,21,48)';
    svgEl.appendChild(e('rect', {
      x: 0, y: 0, width: 1000, height: 750, fill: bg,
    }));

    // "NON FUNCTION" text — centered, flickering
    var titleFont = window.HAL_CONFIG.visual.fonts.title;
    var textEl = e('text', {
      x: 500, y: 400, 'text-anchor': 'middle', fill: 'rgb(255,200,50)',
      'font-family': titleFont, 'font-size': 80, 'font-weight': 'bold',
      'letter-spacing': 30,
      opacity: 1,
      filter: 'url(#txtGlow)',
    });
    textEl.textContent = 'NON FUNCTION';
    textEl.classList.add('nf-anim');
    svgEl.appendChild(textEl);

    // Error message — smaller, below the main text
    var err = data.error ? data.error.message : '';
    if (err) {
      var labelFont = window.HAL_CONFIG.visual.fonts.label;
      var errEl = e('text', {
        x: 500, y: 480, 'text-anchor': 'middle', fill: 'rgb(255,100,100)',
        'font-family': labelFont, 'font-size': 22, 'letter-spacing': 2,
        opacity: 0.8,
        filter: 'url(#txtGlow)',
      });
      errEl.textContent = err;
      svgEl.appendChild(errEl);
    }

    // Ensure the shared keyframe style exists
    this._ensureStyle();

    // ── Tooltip (title attribute on the overlay) ───────────────
    var tooltipText = 'Source: ' + (data.error ? data.error.source : 'unknown');
    if (err) tooltipText += ' — ' + err;

    // Create a transparent overlay for the tooltip
    var tipEl = e('rect', {
      x: 0, y: 0, width: 1000, height: 750, fill: 'transparent',
    });
    tipEl.setAttributeNS(null, 'title', tooltipText);
    svgEl.appendChild(tipEl);

    // ── Timer ──────────────────────────────────────────────────
    var dur = cfg.duration || 5000;
    var timer = setTimeout(function() {
      onDone();
    }, dur);

    // Store timer so _cleanup can cancel it
    this._nfTimer = timer;
  },

  // Cancel timer; shared style stays (cleaned up only if never needed again)
  _cleanup: function() {
    if (this._nfTimer) {
      clearTimeout(this._nfTimer);
      this._nfTimer = null;
    }
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Orbital Mechanics Map
//  — Per-orbit groups: line_N, bold_N, moon_N  (sequential pop-in)
//  — Global groups: markers, labels
//  — Reference axis + central body
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['orbital'] = {

  render: function(data, onDone) {
    var svgEl = window.HAL.svg.getContainer(data);
    var vis = window.HAL_CONFIG.visual || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var e = window.HAL.svg.el;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var series = (data.series || []);
    if (series.length === 0) { if (onDone) onDone(); return; }

    // ── Layout ────────────────────────────────────────────────────────
    var cx = 500, cy = 400;
    var maxR = 280;
    var centerLabel = data.center || (data.dataSource && data.dataSource.center) || '';

    var maxRData = 0;
    for (var si = 0; si < series.length; si++) {
      if (series[si].r > maxRData) maxRData = series[si].r;
    }
    if (maxRData === 0) maxRData = 1;

    // Background
    svgEl.appendChild(e('rect', { x: 0, y: 0, width: data.w || 1000, height: data.h || 750, fill: data.color }));

    // ── Glow filter defs ──────────────────────────────────────────────
    if (!svgEl.querySelector('#glowGrad')) {
      var defs = e('defs');
      defs.innerHTML = '<radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">'
        + '<stop offset="0%" stop-color="rgba(255,255,255,1)"/>'
        + '<stop offset="29%" stop-color="rgba(255,255,255,1)"/>'
        + '<stop offset="100%" stop-color="rgba(255,255,255,0)"/>'
        + '</radialGradient>';
      svgEl.appendChild(defs);
    }
    // ── Header ────────────────────────────────────────────────────────
    var header = e('text', {
      x: 20, y: 25, fill: '#ffffff', 'font-size': fs(14),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    header.textContent = data.title || '';
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // ── Footer ────────────────────────────────────────────────────────
    var footer = e('text', {
      x: 20, y: 735, fill: '#ffffff', 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Group factory ──────────────────────────────────────────────────
    function grp(name) {
      var g = e('g');
      g.setAttributeNS(null, 'data-anim-group', name);
      return g;
    }

    // ── Polar → Cartesian (supports eccentric orbits) ────────────────
    function polar(r, a, ecc, omega) {
      // r = semi-major axis (or radius for circle)
      // a = angle in card coords (0=top, CW)
      // ecc = eccentricity (0 = circle)
      // omega = argument of periapsis in card coords
      if (ecc) {
        var nu = (a - (omega || 0)) * Math.PI / 180;
        r = r * (1 - ecc * ecc) / (1 + ecc * Math.cos(nu));
      }
      var rad = (a - 90) * Math.PI / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    function arcPath(r, a1, a2, steps, ecc, omega) {
      steps = steps !== undefined ? steps : 24;
      if (a2 < a1) a2 += 360;
      var d = '';
      for (var i = 0; i <= steps; i++) {
        var a = a1 + (a2 - a1) * (i / steps);
        var p = polar(r, a, ecc, omega);
        d += (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
      }
      return d;
    }

    function arcRange(a1, a2) {
      var aa1 = ((a1 % 360) + 360) % 360;
      var aa2 = ((a2 % 360) + 360) % 360;
      return { s: aa1, e: aa1 <= aa2 ? aa2 : aa2 + 360 };
    }

    // ── Per-orbit target radius ───────────────────────────────────────
    function orbitR(ri) { return (series[ri].r / maxRData) * maxR; }

    // ── Static groups ─────────────────────────────────────────────────
    var gHeader  = grp('header');
    var gFooter  = grp('footer');
    var gCenter  = grp('centerBody');
    var gCenterL = grp('centerLabel');
    var gAxis    = grp('axis');
    var gMarkers = grp('markers');
    var gLabels  = grp('labels');

    gHeader.appendChild(header);
    gFooter.appendChild(footer);
    svgEl.appendChild(gHeader);
    svgEl.appendChild(gFooter);
    svgEl.appendChild(gCenter);
    svgEl.appendChild(gCenterL);
    svgEl.appendChild(gAxis);
    svgEl.appendChild(gMarkers);
    svgEl.appendChild(gLabels);

    // ── Center body ───────────────────────────────────────────────────
    var centerR = data.centerR || (series.length > 6 ? 10 : 14);
    var centerDot = e('circle', {
      cx: cx, cy: cy, r: centerR, fill: '#ffffff', stroke: 'none',
      filter: 'url(#gfxGlow)',
    });
    centerDot.style.opacity = '0';
    gCenter.appendChild(centerDot);

    if (centerLabel) {
      var cl = e('text', {
        x: cx, y: cy + 22, fill: '#ffffff',
        'font-size': fs(8), 'font-family': labelFont,
        'text-anchor': 'middle', 'dominant-baseline': 'central',
        'text-rendering': 'optimizeLegibility',
        filter: 'url(#txtGlow)',
      });
      cl.textContent = centerLabel;
      cl.style.opacity = '0';
      gCenterL.appendChild(cl);
    }

    // ── Reference axis ────────────────────────────────────────────────
    var axis = e('line', {
      x1: cx, y1: cy, x2: cx + maxR + 30, y2: cy,
      stroke: fg('frame', 0.4), 'stroke-width': 0.6,
    });
    axis.style.opacity = '0';
    gAxis.appendChild(axis);

    // ── Per-orbit rendering ───────────────────────────────────────────
    var outerThreshold = 100;
    var allOrbitGroups = [];

    for (var si = 0; si < series.length; si++) {
      var s = series[si];
      var rScaled = orbitR(si);
      var isOuter = rScaled > outerThreshold;
      var bAngle = s.bodyAngle || 0;
      var ecc = s.eccentricity || 0;
      var omega = s.omega || 0;
      var markers = (s.markers || []).slice();
      // Markers with 'style' define orbit segments; style-less markers are data annotations only
      var segMarkers = markers.filter(function(m) { return m.style; });
      segMarkers.sort(function(a, b) { return a.angle - b.angle; });

      // Create per-orbit groups line_{si}, bold_{si}, moon_{si}, glow_{si}
      var gLine = grp('line_' + si);
      var gBold = grp('bold_' + si);
      var gMoon  = grp('moon_' + si);
      var gGlow  = grp('glow_' + si);
      svgEl.appendChild(gLine);
      svgEl.appendChild(gBold);
      svgEl.appendChild(gMoon);
      svgEl.appendChild(gGlow);
      allOrbitGroups.push({ line: gLine, bold: gBold, moon: gMoon, glow: gGlow, si: si });

      // ── Segmented orbit lines ─────────────────────────────────
      if (segMarkers.length >= 2) {
        for (var mi = 0; mi < segMarkers.length; mi++) {
          var mk  = segMarkers[mi];
          var nxt = segMarkers[(mi + 1) % segMarkers.length];
          var rng = arcRange(mk.angle, nxt.angle);
          var style = mk.style || 'solid';
          var seg = e('path', {
            d: arcPath(rScaled, rng.s, rng.e, 72, ecc, omega),
            fill: 'none',
            stroke: style === 'dashed' ? fg('frame', 0.45) : fg('frame', 0.65),
            'stroke-width': style === 'dashed' ? 0.7 : 0.9,
          });
          if (style === 'dashed') seg.setAttribute('stroke-dasharray', '4,4');
          seg.style.opacity = '0';
          gLine.appendChild(seg);
        }
      } else {
        var fallback = e('path', {
          d: arcPath(rScaled, 0, 360, 240, ecc, omega),
          fill: 'none', stroke: fg('frame', 0.6), 'stroke-width': 0.8,
        });
        fallback.style.opacity = '0';
        gLine.appendChild(fallback);
      }

      // ── Bold trailing arc ─────────────────────────────────────
      var boldDeg = s.boldArc || 60;
      var boldRng = arcRange(bAngle - boldDeg, bAngle);
      var boldArc = e('path', {
        d: arcPath(rScaled, boldRng.s, boldRng.e, 20, ecc, omega),
        fill: 'none', stroke: fg('frame', 1.5), 'stroke-width': 2.2,
        filter: 'url(#gfxGlow)',
      });
      boldArc.style.opacity = '0';
      // Append bold to the per-orbit line group so they appear together
      gBold.appendChild(boldArc);

      // ── Moon body dot + label ─────────────────────────────────
      var adjBodyR = ecc ? rScaled * (1 - ecc*ecc) / (1 + ecc * Math.cos((bAngle - omega) * Math.PI / 180)) : rScaled;
      var bp = polar(adjBodyR, bAngle);
      var bodyR = Math.max(4, Math.min(10, (s.value || 5) / 10));
      var dot = e('circle', {
        cx: bp.x, cy: bp.y, r: bodyR,
        fill: '#ffffff', stroke: 'none',
        filter: 'url(#gfxGlow)',
      });
      dot.style.opacity = '0';
      gMoon.appendChild(dot);

      var labelOffset = bodyR + 10;
      var lp = polar(adjBodyR + labelOffset, bAngle);
      var anchor = (bAngle > 90 && bAngle < 270) ? 'end' : 'start';
      var ml = e('text', {
        x: lp.x, y: lp.y,
        fill: '#ffffff', 'font-size': fs(7),
        'font-family': labelFont, 'text-anchor': anchor,
        'dominant-baseline': 'central',
        'text-rendering': 'optimizeLegibility',
        filter: 'url(#txtGlow)',
      });
      ml.textContent = s.label || '';
      ml.style.opacity = '0';
      gMoon.appendChild(ml);

      // ── Data marker dots + labels (global marker/label groups) ─
      for (var mi2 = 0; mi2 < markers.length; mi2++) {
        var mk2 = markers[mi2];
        var adjMrk = ecc ? rScaled * (1 - ecc*ecc) / (1 + ecc * Math.cos((mk2.angle - omega) * Math.PI / 180)) : rScaled;
        // Optional marker-level r override (data units, scaled to display)
        var mkR = mk2.r != null ? (mk2.r / maxRData) * maxR : adjMrk;
        var mp = polar(mkR, mk2.angle);
        var isBodyPos = Math.abs(mk2.angle - bAngle) < 0.5 && mk2.r == null;

        // Marker dot (skip at body position)
        if (!isBodyPos) {
          var md = e('circle', {
            cx: mp.x, cy: mp.y, r: 2.5,
            fill: fg('frame', 0.7), stroke: 'none',
            filter: 'url(#gfxGlow)',
          });
          md.style.opacity = '0';
          gMarkers.appendChild(md);
        }

        // Glow highlight — opaque white center, fades to transparent
        if (mk2.glow) {
          var glowCfg = typeof mk2.glow === 'object' ? mk2.glow : {};
          var gh = e('circle', {
            cx: mp.x, cy: mp.y, r: glowCfg.r || 17,
            fill: 'url(#glowGrad)',
            stroke: 'none',
            filter: 'url(#gfxGlow)',
          });
          gh.style.opacity = '0';
          gGlow.appendChild(gh);
        }

        // Label + leader
        if (mk2.label && !isBodyPos) {
          var LABEL_OFFSET = 16;
          var tp = polar(mkR + LABEL_OFFSET, mk2.angle);
          var txt;

          if (isOuter) {
            // Perpendicular to orbit tangent = radial, outward
            var radialAngle = mk2.angle - 90;
            txt = e('text', {
              x: tp.x, y: tp.y,
              fill: '#ffffff', 'font-size': fs(5),
              'font-family': labelFont,
              'text-anchor': 'start', 'dominant-baseline': 'central',
              'text-rendering': 'optimizeLegibility',
              filter: 'url(#txtGlow)',
            });
            txt.setAttribute('transform', 'rotate(' + radialAngle + ',' + tp.x + ',' + tp.y + ')');
          } else {
            var ha = mk2.angle > 90 && mk2.angle < 270 ? 'end' : 'start';
            txt = e('text', {
              x: tp.x, y: tp.y,
              fill: '#ffffff', 'font-size': fs(5),
              'font-family': labelFont,
              'text-anchor': ha, 'dominant-baseline': 'central',
              'text-rendering': 'optimizeLegibility',
              filter: 'url(#txtGlow)',
            });
          }
          txt.textContent = mk2.label;
          txt.style.opacity = '0';
          gLabels.appendChild(txt);

          var lead = e('line', {
            x1: mp.x, y1: mp.y, x2: tp.x, y2: tp.y,
            stroke: fg('frame', 0.25), 'stroke-width': 0.4,
          });
          lead.style.opacity = '0';
          gLabels.appendChild(lead);
        }
      }
    }

    // ── Collect animation groups ──────────────────────────────────────
    function collectGroup(name) {
      var arr = [];
      var els = svgEl.querySelectorAll('g[data-anim-group="' + name + '"]');
      for (var i = 0; i < els.length; i++) {
        for (var ci = 0; ci < els[i].children.length; ci++) {
          arr.push(els[i].children[ci]);
        }
      }
      return arr;
    }

    var groups = {
      header:      [header],
      footer:      [footer],
      centerBody:  [centerDot],
      centerLabel: centerLabel ? [cl] : [],
      axis:        [axis],
      markers:     collectGroup('markers'),
      labels:      collectGroup('labels'),
    };

    // Per-orbit groups
    for (var oi = 0; oi < allOrbitGroups.length; oi++) {
      var og = allOrbitGroups[oi];
      groups['line_' + og.si] = [];
      // Collect children from gLine element
      for (var ci = 0; ci < og.line.children.length; ci++) {
        groups['line_' + og.si].push(og.line.children[ci]);
      }
      groups['bold_' + og.si] = [];
      for (var ci = 0; ci < og.bold.children.length; ci++) {
        groups['bold_' + og.si].push(og.bold.children[ci]);
      }
      groups['moon_' + og.si] = [];
      for (var ci = 0; ci < og.moon.children.length; ci++) {
        groups['moon_' + og.si].push(og.moon.children[ci]);
      }
      groups['glow_' + og.si] = [];
      for (var ci = 0; ci < og.glow.children.length; ci++) {
        groups['glow_' + og.si].push(og.glow.children[ci]);
      }
    }

    // ── Run animation ─────────────────────────────────────────────────
    window.HAL.anim.run(data, groups, onDone);
  }
};

<script>// ═══════════════════════════════════════════════════════════════════════
//  Polar / Cyclic Chart Card
//  — Cyclic data renderer: concentric rings, radial spokes, data polygons
//  — Spoke count = values length of first series (any cyclic data fits)
//  — Reads series from data.groups[0].series, fallback to data.series
//  — Config-driven: color gradients, arcs with ticks, connector lines, legend
//  — Animation groups: header, footer, rings, spokes, dataPolygons, arcs, legend
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

// ── Pure helpers extracted from the renderer for testability ─────────

// Polar → Cartesian: angle in radians, 0 = top, CW
function polarPt(cx, cy, r, angleRad) {
  return { x: cx + r * Math.sin(angleRad), y: cy - r * Math.cos(angleRad) };
}

// Build ring path (concentric circle)
function ringPath(cx, cy, r, steps) {
  steps = steps || 120;
  var d = '';
  for (var a = 0; a <= 360; a += 360 / steps) {
    var rad = a * Math.PI / 180;
    var p = polarPt(cx, cy, r, rad);
    d += (a === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
  }
  return d;
}

// Compute spoke stats per angular bucket (min, max, avg, mean across series)
function computeSpokeStats(series, nSpokes) {
  var stats = [];
  var svLen = series[0].values ? series[0].values.length : 0;
  for (var vi = 0; vi < nSpokes; vi++) {
    var vals = [];
    var startIdx = svLen > 0 ? Math.floor(vi * svLen / nSpokes) : 0;
    var endIdx = svLen > 0 ? Math.floor((vi + 1) * svLen / nSpokes) : 0;
    if (endIdx <= startIdx) endIdx = startIdx + 1;
    for (var si = 0; si < series.length; si++) {
      var sv = series[si].values || [];
      var sum = 0, cnt = 0;
      for (var di = startIdx; di < endIdx && di < sv.length; di++) {
        if (sv[di] != null) { sum += sv[di]; cnt++; }
      }
      if (cnt > 0) vals.push(sum / cnt);
    }
    if (vals.length === 0) {
      stats.push({ min: 0, max: 0, avg: 0, mean: 0 });
      continue;
    }
    vals.sort(function(a,b){return a-b;});
    var sum = 0;
    for (var i = 0; i < vals.length; i++) sum += vals[i];
    var avg = sum / vals.length;
    var mid = Math.floor(vals.length / 2);
    var mean = vals.length % 2 === 0 ? (vals[mid-1] + vals[mid]) / 2 : vals[mid];
    stats.push({ min: vals[0], max: vals[vals.length-1], avg: avg, mean: mean });
  }
  return stats;
}

// Generate color palette from two control points (cool→white→warm)
function generateColors(n, coolColor, warmColor) {
  if (n === 0) return [];
  var colors = [];
  var cc = coolColor || { r: 100, g: 180, b: 255 };
  var wc = warmColor || { r: 255, g: 180, b: 80 };
  for (var ci = 0; ci < n; ci++) {
    var t = n > 1 ? ci / (n - 1) : 0.5;
    var mid = 0.4;
    var mix, r, g, b;
    if (t <= mid) {
      mix = t / mid;
      r = Math.round(cc.r + (255 - cc.r) * mix);
      g = Math.round(cc.g + (255 - cc.g) * mix);
      b = Math.round(cc.b + (255 - cc.b) * mix);
    } else {
      mix = (t - mid) / (1 - mid);
      r = Math.round(255 + (wc.r - 255) * mix);
      g = Math.round(255 + (wc.g - 255) * mix);
      b = Math.round(255 + (wc.b - 255) * mix);
    }
    colors.push('rgb(' + r + ',' + g + ',' + b + ')');
  }
  return colors;
}

// Apply smoothing: moving-window average
function smoothValues(values, factor) {
  if (!factor || factor <= 0) return values.slice();
  var smoothed = values.slice();
  var windowSize = Math.round(factor * values.length);
  if (windowSize <= 0) return smoothed;
  // Window spans entire dataset: use overall average (perfect circle)
  if (windowSize >= values.length) {
    var sum = 0, cnt = 0;
    for (var tvi = 0; tvi < values.length; tvi++) {
      if (values[tvi] != null) { sum += values[tvi]; cnt++; }
    }
    var overallAvg = cnt > 0 ? sum / cnt : 0;
    for (var tvi = 0; tvi < values.length; tvi++) {
      if (values[tvi] != null) smoothed[tvi] = overallAvg;
    }
    return smoothed;
  }
  var halfWin = Math.floor(windowSize / 2);
  for (var tvi = 0; tvi < values.length; tvi++) {
    if (values[tvi] == null) continue;
    var sum = 0, cnt = 0;
    for (var wi = tvi - halfWin; wi <= tvi + halfWin; wi++) {
      if (wi >= 0 && wi < values.length && values[wi] != null) {
        sum += values[wi]; cnt++;
      }
    }
    if (cnt > 0) smoothed[tvi] = sum / cnt;
  }
  return smoothed;
}

// Find first rising crossing that stays above target for MIN_CROSS days
function findSpringCrossing(values, target) {
  var MIN_CROSS = 14;
  var i = 0;
  while (i < values.length - 1) {
    var p0 = values[i], p1 = values[i + 1];
    if (p0 != null && p1 != null && p0 <= target && p1 >= target) {
      var above = 0, j;
      for (j = i + 1; j < values.length && above < MIN_CROSS; j++) {
        if (values[j] != null && values[j] >= target) above++;
        else if (values[j] != null) break;
      }
      if (above >= MIN_CROSS) {
        var t = (target - p0) / (p1 - p0);
        return (i + t) / values.length * 360;
      }
      i = j;
      continue;
    }
    i++;
  }
  return null;
}

// Cluster a set of angles: find the tightest grouping
function clusterAngles(angles) {
  if (angles.length === 0) return { start: 0, end: 0, span: 0, gap: 0 };
  var s = angles.slice().sort(function(a,b){return a-b;});
  var uniq = [s[0]];
  for (var i = 1; i < s.length; i++) { if (s[i] !== s[i-1]) uniq.push(s[i]); }
  if (uniq.length === 1) {
    return { start: uniq[0] - 1, end: uniq[0] + 1, span: 2, gap: 358 };
  }
  var maxGap = 0, gapIdx = 0;
  for (var i = 0; i < uniq.length; i++) {
    var next = uniq[(i + 1) % uniq.length];
    var gap = (i === uniq.length - 1) ? (uniq[0] + 360 - uniq[i]) : (uniq[i+1] - uniq[i]);
    if (gap > maxGap) { maxGap = gap; gapIdx = i; }
  }
  var gapStart = uniq[gapIdx];
  var clusterStart = (gapStart + maxGap) % 360;
  var clusterEnd = gapStart;
  if (clusterEnd <= clusterStart) clusterEnd += 360;
  return { start: clusterStart, end: clusterEnd, span: clusterEnd - clusterStart, gap: maxGap };
}

// Compute per-year stat angles (min, max, avg, mean spring crossing)
function computeYearStats(series) {
  var minAngles = [], maxAngles = [], avgAngles = [], meanAnglesAll = [];
  var minVals = [], maxVals = [], avgVals = [], meanVals = [];
  for (var si = 0; si < series.length; si++) {
    var sv = series[si].values || [];
    var valid = [];
    for (var vi = 0; vi < sv.length; vi++) {
      if (sv[vi] != null) valid.push({ idx: vi, v: sv[vi] });
    }
    if (valid.length === 0) continue;

    var minV = Infinity, minA = 0;
    for (var i = 0; i < valid.length; i++) {
      if (valid[i].v < minV) { minV = valid[i].v; minA = valid[i].idx / sv.length * 360; }
    }
    minAngles.push(minA); minVals.push(minV);

    var maxV = -Infinity, maxA = 0;
    for (var i = 0; i < valid.length; i++) {
      if (valid[i].v > maxV) { maxV = valid[i].v; maxA = valid[i].idx / sv.length * 360; }
    }
    maxAngles.push(maxA); maxVals.push(maxV);

    var sum = 0;
    for (var i = 0; i < valid.length; i++) sum += valid[i].v;
    var avg = sum / valid.length;
    var avgCross = findSpringCrossing(sv, avg);
    if (avgCross != null) { avgAngles.push(avgCross); avgVals.push(avg); }

    var sorted = sv.filter(function(v){return v!=null;}).sort(function(a,b){return a-b;});
    var mid = Math.floor(sorted.length / 2);
    var median = sorted.length % 2 === 0 ? (sorted[mid-1] + sorted[mid]) / 2 : sorted[mid];
    var meanCross = findSpringCrossing(sv, median);
    if (meanCross != null) { meanAnglesAll.push(meanCross); meanVals.push(median); }
  }
  return { minAngles: minAngles, maxAngles: maxAngles, avgAngles: avgAngles, meanAnglesAll: meanAnglesAll,
           minVals: minVals, maxVals: maxVals, avgVals: avgVals, meanVals: meanVals };
}

// Build an SVG arc path (elliptical arc segment at radius arcR)
function buildArcPath(cx, cy, arcR, startAngleDeg, endAngleDeg) {
  var startAngle = startAngleDeg * Math.PI / 180;
  var endAngle = endAngleDeg * Math.PI / 180;
  var p = polarPt(cx, cy, arcR, startAngle);
  var q = polarPt(cx, cy, arcR, endAngle);
  var span = endAngle - startAngle;
  var large = (Math.abs(span) % (Math.PI * 2)) > Math.PI ? 1 : 0;
  return 'M' + p.x.toFixed(1) + ',' + p.y.toFixed(1) +
    ' A' + arcR.toFixed(1) + ',' + arcR.toFixed(1) + ' 0 ' +
    large + ',1 ' + q.x.toFixed(1) + ',' + q.y.toFixed(1);
}

// ── Renderer ──────────────────────────────────────────────────────────
window.HAL.cards['polar'] = {

  render: function(data, onDone) {
    var svgEl = window.HAL.svg.getContainer(data);
    window.HAL.svg.addGlowFilter(svgEl);
    var vis = window.HAL_CONFIG.visual || {};
    var vc = vis.chart || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var e = window.HAL.svg.el;
    var ns = window.HAL.svg.ns;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var groupsData = data.groups || [];
    var series = (groupsData.length > 0 && groupsData[0].series)
      ? groupsData[0].series : (data.series || []);
    if (series.length === 0) { if (onDone) onDone(); return; }

    // ── Layout ────────────────────────────────────────────────────
    var cx = data.cx || vc.cx || 500;
    var cy = data.cy || vc.cy || 400;
    var maxR = data.maxR || vc.maxR || 260;
    var minR = data.minR || vc.minR || 30;
    var radius = maxR - minR;
    var nSpokes = data.spokes || 12;
    if (nSpokes < 2) { if (onDone) onDone(); return; }

    var mOpts = data.markers || {};
    var showDataMin  = mOpts.min !== false;
    var showDataMax  = mOpts.max !== false;
    var showDataAvg  = mOpts.avg !== false;
    var showDataMean = mOpts.mean !== false;
    var showArcs     = mOpts.arcs !== false;
    var showConnectors = mOpts.connectors !== false;
    var smoothFactor = Math.max(0, Math.min(1, data.smooth || 0));
    var angleStep = (2 * Math.PI) / nSpokes;
    var spokeLabels = data.labels || [];

    // Value range
    var valMin = data.valMin, valMax = data.valMax;
    if (valMin == null || valMax == null) {
      valMin = Infinity; valMax = -Infinity;
      for (var si = 0; si < series.length; si++) {
        var sv = series[si].values || [];
        for (var vi = 0; vi < sv.length; vi++) {
          if (sv[vi] != null) {
            if (sv[vi] < valMin) valMin = sv[vi];
            if (sv[vi] > valMax) valMax = sv[vi];
          }
        }
      }
    }
    var pad = (valMax - valMin) * 0.15 || 1.5;
    valMin -= pad; valMax += pad;
    var valRange = valMax - valMin || 1;

    function valToR(v) {
      return minR + ((v - valMin) / valRange) * radius;
    }

    // Spoke-level stats
    var spokeStats = computeSpokeStats(series, nSpokes);
    var globalMin = Infinity, globalMax = -Infinity, globalAvgSum = 0, globalAvgN = 0;
    for (var vi = 0; vi < nSpokes; vi++) {
      if (spokeStats[vi].min < globalMin) globalMin = spokeStats[vi].min;
      if (spokeStats[vi].max > globalMax) globalMax = spokeStats[vi].max;
      globalAvgSum += spokeStats[vi].avg; globalAvgN++;
    }
    var globalAvg = globalAvgSum / globalAvgN;

    // ── Background ─────────────────────────────────────────────────
    svgEl.appendChild(e('rect', {
      x: 0, y: 0, width: data.w || 1000, height: data.h || 750, fill: data.color
    }));

    // ── Header / Footer ────────────────────────────────────────────
    var header = e('text', {
      filter: 'url(#txtGlow)',
      x: data.titleX || 15, y: data.titleY || 15,
      fill: fg('frame', 1.9), 'font-size': fs(data.titleSize || 14),
      'font-family': (vis.fonts || {}).title || labelFont,
      'text-rendering': 'optimizeLegibility',
    });
    header.textContent = (data.title || '') + '  ' + (data.label || '');
    header.style.opacity = '0';
    svgEl.appendChild(header);

    var subtitle = null;
    if (data.subtitle) {
      subtitle = e('text', {
        filter: 'url(#txtGlow)',
        x: (data.titleX || 20) + (data.titleSize || 14) * 5.5, y: data.titleY || 25,
        fill: fg('frame', 0.85), 'font-size': fs(data.subSize || 9),
        'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      });
      subtitle.textContent = data.subtitle;
      subtitle.style.opacity = '0';
      svgEl.appendChild(subtitle);
    }

    var footer = e('text', {
      filter: 'url(#txtGlow)',
      x: 20, y: 735, fill: fg('frame', 0.85), 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Rings ──────────────────────────────────────────────────────
    var ringElements = [];
    var scaleLabels = [];
    var nRings = data.rings || 5;
    for (var ri = 0; ri <= nRings; ri++) {
      var ringR = minR + (ri / nRings) * radius;
      var isOuter = ri === nRings;
      var ringColor = isOuter ? (data.outerRingColor || 'rgba(255,255,255,0.35)') : (data.ringColor || fg('frame', 0.08 + ri * 0.03));
      var ring = e('path', {
        d: ringPath(cx, cy, ringR),
        fill: 'none', stroke: ringColor,
        'stroke-width': ri === 0 ? (data.ringWidth0 || 0.3) : (data.ringWidth || 0.5),
      });
      svgEl.appendChild(ring);
      ringElements.push(ring);

      if (ri > 0 && data.scaleLabels !== false) {
        var ringVal = valMin + (ri / nRings) * valRange;
        var lblP = polarPt(cx, cy, ringR, 0);
        var sl = e('text', {
          filter: 'url(#txtGlow)',
          x: lblP.x + 4, y: lblP.y + 3,
          fill: fg('frame', 0.7), 'font-size': fs(data.scaleFontSize || 8),
          'font-family': labelFont,
        });
        sl.textContent = ringVal.toFixed(data.scalePrecision || 1);
        sl.style.opacity = '0';
        scaleLabels.push(sl);
      }
    }

    // ── Spokes ─────────────────────────────────────────────────────
    var spokeElements = [];
    var monthLabelElements = [];
    var prevLabelIdx = -1;
    for (var si = 0; si < nSpokes; si++) {
      var angle = si * angleStep;
      var p = polarPt(cx, cy, maxR, angle);
      var spoke = e('line', {
        x1: cx, y1: cy, x2: p.x, y2: p.y,
        stroke: data.spokeColor || fg('frame', 0.12),
        'stroke-width': data.spokeWidth || 0.3,
      });
      spoke.style.opacity = '0';
      svgEl.appendChild(spoke);
      spokeElements.push(spoke);

      var labelOffset = data.labelOffset || 22;
      var lp = polarPt(cx, cy, maxR + labelOffset, angle);
      var lblText = '';
      var labelIdx = 0;
      if (spokeLabels.length > 0 && spokeLabels.length !== nSpokes) {
        labelIdx = Math.round(si * (spokeLabels.length - 1) / (nSpokes - 1));
        lblText = spokeLabels[labelIdx] || '';
      } else {
        lblText = spokeLabels[si] || '';
        labelIdx = si;
      }
      if (lblText && labelIdx !== prevLabelIdx) {
        prevLabelIdx = labelIdx;
        var lbl = e('text', {
          filter: 'url(#txtGlow)',
          x: lp.x, y: lp.y + 3,
          fill: data.labelColor || fg('frame', 0.7),
          'font-size': fs(data.labelFontSize || 9),
          'font-family': labelFont, 'text-anchor': 'middle',
        });
        lbl.textContent = lblText;
        lbl.style.opacity = '0';
        spokeElements.push(lbl);
        monthLabelElements.push(lbl);
      }
    }
    for (var si = 0; si < scaleLabels.length; si++) svgEl.appendChild(scaleLabels[si]);
    for (var mi = 0; mi < monthLabelElements.length; mi++) svgEl.appendChild(monthLabelElements[mi]);

    // ── Colors ─────────────────────────────────────────────────────
    var colors = data.colors || generateColors(series.length, data.coolColor, data.warmColor);

    // ── Data polygons ──────────────────────────────────────────────
    var polygonElements = [];
    for (var si = 0; si < series.length; si++) {
      var sv = series[si].values || [];
      var smoothed = smoothValues(sv, smoothFactor);
      var pathD = '';
      var sColor = colors[si % colors.length];
      var baseAlpha = data.baseAlpha != null ? data.baseAlpha : 0.3;
      var alphaStep = series.length > 1 ? ((data.alphaMax || 0.8) - baseAlpha) / (series.length - 1) : 0;
      var sAlpha = baseAlpha + si * alphaStep;

      for (var vi = 0; vi < smoothed.length; vi++) {
        if (smoothed[vi] == null) continue;
        var r = valToR(smoothed[vi]);
        var a = (vi / smoothed.length) * 2 * Math.PI;
        var pt = polarPt(cx, cy, r, a);
        pathD += (pathD === '' ? 'M' : 'L') + pt.x.toFixed(1) + ',' + pt.y.toFixed(1);
      }
      if (pathD !== '') {
        var partial = series[si]._partial;
        if (!partial && smoothed.length > 10) {
          var nullTail = 0, threshold = Math.max(10, Math.floor(smoothed.length * 0.1));
          for (var ni = smoothed.length - 1; ni >= Math.max(0, smoothed.length - threshold); ni--) {
            if (smoothed[ni] == null) nullTail++;
          }
          partial = nullTail >= threshold;
        }
        if (!partial) {
          var firstR = valToR(smoothed[0]);
          var firstP = polarPt(cx, cy, firstR, 0);
          pathD += 'L' + firstP.x.toFixed(1) + ',' + firstP.y.toFixed(1) + 'Z';
        }
      }
      var lineW = data.lineWidth || 0.8;
      var lineA = data.lineAlpha != null ? data.lineAlpha : 1.0;
      var poly = e('path', {
        d: pathD, fill: 'none', stroke: sColor,
        'stroke-width': lineW,
        'stroke-opacity': (lineA * sAlpha).toFixed(2),
        filter: 'url(#gfxGlow)',
      });
      svgEl.appendChild(poly);
      polygonElements.push(poly);
    }
    for (var pdi = 0; pdi < polygonElements.length; pdi++) {
      polygonElements[pdi].style.opacity = '0';
    }

    // ── Year stats (min/max/avg/mean dots) ─────────────────────────
    var yearStats = computeYearStats(series);
    for (var mi = 0; mi < series.length; mi++) {
      var sv = series[mi].values || [];
      if (sv.length < 2) continue;
      var minIdx = -1, minVal = Infinity, maxIdx = -1, maxVal = -Infinity;
      for (var vi = 0; vi < sv.length; vi++) {
        if (sv[vi] == null) continue;
        if (showDataMin && sv[vi] < minVal) { minVal = sv[vi]; minIdx = vi; }
        if (showDataMax && sv[vi] > maxVal) { maxVal = sv[vi]; maxIdx = vi; }
      }
      if (showDataMin && minIdx >= 0) {
        var p = polarPt(cx, cy, valToR(minVal), (minIdx / sv.length) * 2 * Math.PI);
        var dot = e('circle', { cx: p.x, cy: p.y, r: 3, fill: '#ffffff', stroke: 'none', filter: 'url(#gfxGlow)' });
        dot.style.opacity = '0';
        svgEl.appendChild(dot);
        polygonElements.push(dot);
      }
      if (showDataMax && maxIdx >= 0) {
        var p = polarPt(cx, cy, valToR(maxVal), (maxIdx / sv.length) * 2 * Math.PI);
        var dot = e('circle', { cx: p.x, cy: p.y, r: 3, fill: '#ffffff', stroke: 'none', filter: 'url(#gfxGlow)' });
        dot.style.opacity = '0';
        svgEl.appendChild(dot);
        polygonElements.push(dot);
      }
      if (showDataAvg && mi < yearStats.avgAngles.length) {
        var angRad = yearStats.avgAngles[mi] * Math.PI / 180;
        var p = polarPt(cx, cy, valToR(yearStats.avgVals[mi] || 0), angRad);
        var dot = e('circle', { cx: p.x, cy: p.y, r: 3, fill: '#ffffff', stroke: 'none', filter: 'url(#gfxGlow)' });
        dot.style.opacity = '0';
        svgEl.appendChild(dot);
        polygonElements.push(dot);
      }
      if (showDataMean && mi < yearStats.meanAnglesAll.length) {
        var angRad = yearStats.meanAnglesAll[mi] * Math.PI / 180;
        var p = polarPt(cx, cy, valToR(yearStats.meanVals[mi] || 0), angRad);
        var dot = e('circle', { cx: p.x, cy: p.y, r: 3, fill: '#ffffff', stroke: 'none', filter: 'url(#gfxGlow)' });
        dot.style.opacity = '0';
        svgEl.appendChild(dot);
        polygonElements.push(dot);
      }
    }

    // ── Arc bands ──────────────────────────────────────────────────
    var arcElements = [];
    if (data.arcs && showArcs) {
      var clusters = {
        min: clusterAngles(yearStats.minAngles),
        max: clusterAngles(yearStats.maxAngles),
        avg: clusterAngles(yearStats.avgAngles),
        mean: clusterAngles(yearStats.meanAnglesAll)
      };
      var allAngles = {
        min: yearStats.minAngles,
        max: yearStats.maxAngles,
        avg: yearStats.avgAngles,
        mean: yearStats.meanAnglesAll
      };

      for (var ai = 0; ai < data.arcs.length; ai++) {
        var ac = data.arcs[ai];
        var statKey = ac.stat || 'avg';
        var arcR = maxR + (ac.rOff || 0);
        var arcColor = ac.color || '#ffffff';
        var arcW = ac.width || 2;
        var cluster = clusters[statKey];
        if (!cluster || cluster.span === 0) continue;

        var startAngleDeg = cluster.start;
        var endAngleDeg = cluster.end;

        // Draw arc(s) — wrap across 0 if needed
        function drawArc(sDeg, eDeg) {
          var d = buildArcPath(cx, cy, arcR, sDeg, eDeg);
          var arc = e('path', {
            d: d, fill: 'none', stroke: arcColor,
            'stroke-width': arcW,
            'stroke-opacity': ac.alpha != null ? ac.alpha : 0.6,
          });
          arc.style.opacity = '0';
          svgEl.appendChild(arc);
          arcElements.push(arc);
        }
        if (startAngleDeg > endAngleDeg) {
          drawArc(startAngleDeg, 360);
          drawArc(0, endAngleDeg);
        } else {
          drawArc(startAngleDeg, endAngleDeg);
        }

        // Ticks
        if (ac.ticks !== false) {
          var tickLen = ac.tickLen || 5;
          var tickW = ac.tickWidth || 1.0;
          var tickColor = ac.tickColor || arcColor;
          var tickAlpha = ac.tickAlpha != null ? ac.tickAlpha : (ac.alpha != null ? ac.alpha : 0.6);
          var yearAngles = allAngles[statKey] || [];
          for (var yi = 0; yi < yearAngles.length; yi++) {
            var angRad = yearAngles[yi] * Math.PI / 180;
            var inner = polarPt(cx, cy, arcR - tickLen, angRad);
            var outer = polarPt(cx, cy, arcR + tickLen, angRad);
            var tick = e('line', {
              x1: inner.x, y1: inner.y, x2: outer.x, y2: outer.y,
              stroke: tickColor, 'stroke-width': tickW, 'stroke-opacity': tickAlpha,
            });
            tick.style.opacity = '0';
            svgEl.appendChild(tick);
            arcElements.push(tick);
          }
        }

        // Connector lines
        if (showConnectors && ac.connectors !== false && ac.lineColor) {
          var yearAngles = allAngles[statKey] || [];
          for (var yi = 0; yi < yearAngles.length && yi < series.length; yi++) {
            var angDeg = yearAngles[yi];
            var sv = series[yi].values || [];
            var pos = (angDeg / 360) * sv.length;
            var idx = Math.floor(pos);
            var frac = pos - idx;
            var nextIdx = (idx + 1) % sv.length;
            if (sv[idx] == null || sv[nextIdx] == null) continue;
            var v = sv[idx] + (sv[nextIdx] - sv[idx]) * frac;
            var r = valToR(v);
            var angRad = angDeg * Math.PI / 180;
            var innerP = polarPt(cx, cy, r, angRad);
            var outerP = polarPt(cx, cy, arcR, angRad);
            var cl = e('line', {
              x1: innerP.x, y1: innerP.y, x2: outerP.x, y2: outerP.y,
              stroke: ac.lineColor, 'stroke-width': 0.75, 'stroke-opacity': 0.4,
            });
            cl.style.opacity = '0';
            svgEl.appendChild(cl);
            arcElements.push(cl);
          }
        }
      }
    }

    // ── Legend ─────────────────────────────────────────────────────
    var legendElements = [];
    if (data.legend !== false && series.length > 1) {
      var legendX = data.legendX || 20;
      var legendY = data.legendY || 660;
      var legendCols = data.legendCols || 2;
      var legendSpacing = data.legendSpacing || 14;
      var legendFontSize = data.legendFontSize || 8;
      var itemsPerCol = Math.ceil(series.length / legendCols);
      for (var si = 0; si < series.length; si++) {
        var col = Math.floor(si / itemsPerCol);
        var row = si % itemsPerCol;
        var lx = legendX + col * 100;
        var ly = legendY + row * legendSpacing;
        var dot = e('rect', {
          x: lx, y: ly - 3, width: 6, height: 6,
          fill: colors[si % colors.length],
          opacity: (0.35 + si * 0.06).toFixed(2),
        });
        svgEl.appendChild(dot);
        legendElements.push(dot);
        var lt = e('text', {
          filter: 'url(#txtGlow)',
          x: lx + 10, y: ly + 3,
          fill: fg('frame', 0.35 + si * 0.06), 'font-size': fs(legendFontSize),
          'font-family': labelFont,
        });
        lt.textContent = series[si].label || '';
        svgEl.appendChild(lt);
        legendElements.push(lt);
      }
    }
    if (legendElements.length && arcElements.length) {
      for (var li = 0; li < legendElements.length; li++) {
        svgEl.insertBefore(legendElements[li], arcElements[0]);
      }
    }

    // ── Group map ─────────────────────────────────────────────────
    var groupMap = {};
    groupMap.header = [header];
    if (subtitle) groupMap.header.push(subtitle);
    groupMap.footer = footer;
    groupMap.rings = ringElements;
    groupMap.scaleLabels = scaleLabels;
    groupMap.spokes = spokeElements;
    groupMap.monthLabels = monthLabelElements;
    groupMap.dataPolygons = polygonElements;
    groupMap.legend = legendElements;
    groupMap.arcs = arcElements;

    // ── Animation ─────────────────────────────────────────────────
    var defaults = [
      { action: 'appear',     groups: ['header', 'footer'] },
      { action: 'wait',       duration: 400 },
      { action: 'appear',     groups: ['rings'], order: 'sequential', gap: 80 },
      { action: 'appear',     groups: ['spokes'], order: 'simultaneous' },
      { action: 'appear',     groups: ['scaleLabels'], order: 'simultaneous' },
      { action: 'appear',     groups: ['monthLabels'], order: 'simultaneous' },
      { action: 'wait',       duration: 400 },
      { action: 'appear',     groups: ['dataPolygons', 'legend'], order: 'sequential', gap: 150 },
      { action: 'wait',       duration: 400 },
      { action: 'wait',       duration: 200 },
      { action: 'appear',     groups: ['arcs'], order: 'simultaneous' },
      { action: 'wait',       duration: 6000 },
      { action: 'disappear',  groups: ['legend'], order: 'sequential', gap: 40 },
      { action: 'disappear',  groups: ['arcs'], order: 'simultaneous' },
      { action: 'disappear',  groups: ['dataPolygons'], order: 'sequential', gap: 100 },
      { action: 'wait',       duration: 200 },
      { action: 'disappear',  groups: ['monthLabels'], order: 'simultaneous' },
      { action: 'disappear',  groups: ['scaleLabels'], order: 'simultaneous' },
      { action: 'disappear',  groups: ['spokes'], order: 'simultaneous' },
      { action: 'disappear',  groups: ['rings'], order: 'sequential', gap: 80 },
      { action: 'wait',       duration: 200 },
      { action: 'disappear',  groups: ['header', 'footer'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },
};
