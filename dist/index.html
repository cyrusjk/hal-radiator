<script>// ═══════════════════════════════════════════════════════════════════════
//  Wireframe 3D HUD Chart Card
//  — Perspective wireframe with orbital rings and data points
//  — Each object has 3D coordinates projected to 2D
//  — Connections draw lines between objects
//  — Animation groups: header, footer, grid, connections, dataPoints
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['wireframe'] = {

  render: function(data, onDone) {
    var svgEl = data._container || document.getElementById('card');
    var vis = window.HAL_CONFIG.visual || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var e = window.HAL.svg.el;
    var ns = window.HAL.svg.ns;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var objects = (data.objects || []);
    var connections = (data.connections || []);

    // ── Perspective projection helpers ─────────────────────────────────
    // Simple isometric-like projection: flatten 3D (x,y,z) to 2D (px,py)
    var cx = 500, cy = 380;  // vanishing / centre point
    var scale = 60;

    function project(x, y, z) {
      // Tilted perspective: x→right, y→depth (up on screen), z→up
      var px = cx + x * scale - y * scale * 0.3;
      var py = cy - z * scale + y * scale * 0.3;
      return { x: px, y: py, z: y };
    }

    // ── Card background ───────────────────────────────────────────────
    if (!data._container) svgEl.innerHTML = '';
    var bg = e('rect', { x: 0, y: 0, width: 1000, height: 750, fill: data.color });
    svgEl.appendChild(bg);

    // ── Header ────────────────────────────────────────────────────────
    var header = e('text', {
      x: 20, y: 25, fill: fg('frame', 1.9), 'font-size': fs(14),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    header.textContent = data.title || '';
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // ── Footer ────────────────────────────────────────────────────────
    var footer = e('text', {
      x: 20, y: 735, fill: fg('frame', 0.85), 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Perspective grid ──────────────────────────────────────────────
    var gridG = e('g');
    svgEl.appendChild(gridG);
    var gridLines = [];
    var clamp = 350;

    // Horizontal grid lines (depth bands)
    for (var d = -4; d <= 4; d++) {
      if (d === 0) continue;
      var p1 = project(-4, d, -3);
      var p2 = project(4, d, -3);
      if (p1.z < 0 || p2.z < 0) continue;
      gridLines.push(e('line', {
        x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
        stroke: fg('frame', 0.3), 'stroke-width': 0.5,
      }));
      p1 = project(-4, d, 3);
      p2 = project(4, d, 3);
      if (p1.z < 0 || p2.z < 0) continue;
      gridLines.push(e('line', {
        x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
        stroke: fg('frame', 0.2), 'stroke-width': 0.5,
      }));
    }

    // Vertical grid lines (depth rays from center)
    for (var a = 0; a < 360; a += 30) {
      var rad = a * Math.PI / 180;
      var dx = Math.cos(rad) * 4;
      var dy = Math.sin(rad) * 4;
      var p0 = project(0, 0, 0);
      var p1 = project(dx, dy, 0);
      if (p1.z < 0) continue;
      gridLines.push(e('line', {
        x1: p0.x, y1: p0.y, x2: p1.x, y2: p1.y,
        stroke: fg('frame', 0.15), 'stroke-width': 0.5,
      }));
    }

    // Orbital rings (ellipses in perspective)
    for (var r = 1; r <= 3; r++) {
      var pathD = '';
      for (var a = 0; a <= 360; a += 10) {
        var rad = a * Math.PI / 180;
        var dx = Math.cos(rad) * r;
        var dy = Math.sin(rad) * r;
        var p = project(dx, dy, 0);
        if (p.z < 0) continue;
        pathD += (a === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
      }
      if (pathD) {
        gridLines.push(e('path', {
          d: pathD, fill: 'none',
          stroke: fg('frame', 0.25), 'stroke-width': 0.5,
        }));
      }
    }

    gridG.style.opacity = '0';
    for (var gli = 0; gli < gridLines.length; gli++) {
      gridG.appendChild(gridLines[gli]);
    }

    // ── Connections (lines between objects) ────────────────────────────
    var connElements = [];
    var connG = e('g');
    svgEl.appendChild(connG);
    connG.style.opacity = '0';

    for (var ci = 0; ci < connections.length; ci++) {
      var fr = connections[ci].from;
      var to = connections[ci].to;
      if (fr >= objects.length || to >= objects.length) continue;
      var o1 = objects[fr];
      var o2 = objects[to];
      var p1 = project(o1.x, o1.y, o1.z);
      var p2 = project(o2.x, o2.y, o2.z);
      var line = e('line', {
        x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
        stroke: fg('data', 0.38), 'stroke-width': 0.8,
      });
      connG.appendChild(line);
      connElements.push(line);
    }

    // ── Data points ───────────────────────────────────────────────────
    var pointElements = [];
    var ptG = e('g');
    svgEl.appendChild(ptG);

    for (var oi = 0; oi < objects.length; oi++) {
      var obj = objects[oi];
      var p = project(obj.x, obj.y, obj.z);

      var grp = document.createElementNS(ns, 'g');
      grp.style.opacity = '0';

      // Point marker (crosshair/diamond)
      var size = 5;
      grp.appendChild(e('circle', {
        cx: p.x, cy: p.y, r: size, fill: fg('data', 0.88),
      }));

      // Glow ring
      grp.appendChild(e('circle', {
        cx: p.x, cy: p.y, r: size + 3, fill: 'none',
        stroke: fg('data', 0.32), 'stroke-width': 1,
      }));

      // Label
      var lbl = e('text', {
        x: p.x + 10, y: p.y + 3,
        fill: fg('frame', 1.5), 'font-size': fs(10),
        'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      });
      lbl.textContent = obj.label || '';
      grp.appendChild(lbl);

      ptG.appendChild(grp);
      pointElements.push(grp);
    }

    // ── Group map ─────────────────────────────────────────────────────
    var groupMap = {};
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.grid = gridG;
    groupMap.connections = connG;
    groupMap.dataPoints = pointElements;

    // ── Animation ─────────────────────────────────────────────────────
    var defaults = [
      { action: 'appear',     groups: ['header', 'footer', 'grid'] },
      { action: 'wait',       duration: 1000 },
      { action: 'appear',     groups: ['connections'], order: 'simultaneous' },
      { action: 'wait',       duration: 600 },
      { action: 'appear',     groups: ['dataPoints'], order: 'sequential', gap: 400 },
      { action: 'wait',       duration: 8000 },
      { action: 'disappear',  groups: ['dataPoints'], order: 'sequential', gap: 250 },
      { action: 'wait',       duration: 400 },
      { action: 'disappear',  groups: ['connections'], order: 'simultaneous' },
      { action: 'wait',       duration: 300 },
      { action: 'disappear',  groups: ['header', 'footer', 'grid'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },

};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Polar / Radar Chart Card
//  — Concentric rings with radial spokes and data polygons
//  — Each series defines values mapped to equal-angle spokes
//  — Animation groups: header, footer, rings, spokes, dataPolygons
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['polar'] = {

  render: function(data, onDone) {
    var svgEl = data._container || document.getElementById('card');
    var vis = window.HAL_CONFIG.visual || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var e = window.HAL.svg.el;
    var ns = window.HAL.svg.ns;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var series = (data.series || []);
    if (series.length === 0) { if (onDone) onDone(); return; }

    // ── Layout ────────────────────────────────────────────────────────
    var cx = 500, cy = 400;     // chart centre
    var radius = 260;           // max ring radius
    var nRings = 5;             // concentric rings
    var nSpokes = 8;            // radial divisions
    var angleStep = (2 * Math.PI) / nSpokes;

    // Max value across all series for normalisation
    var maxVal = 1;
    for (var si = 0; si < series.length; si++) {
      var sv = series[si].values || [];
      for (var vi = 0; vi < sv.length; vi++) {
        if (sv[vi] > maxVal) maxVal = sv[vi];
      }
    }

    // ── Card background ───────────────────────────────────────────────
    if (!data._container) svgEl.innerHTML = '';
    var bg = e('rect', { x: 0, y: 0, width: 1000, height: 750, fill: data.color });
    svgEl.appendChild(bg);

    // ── Text glow filter (HAL 9000 style) ──────────────────────────
    // ── Header (title) ────────────────────────────────────────────────
    var header = e('text', {
      x: 20, y: 25, fill: fg('frame', 1.9), 'font-size': fs(14),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    header.textContent = data.title || '';
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // ── Footer ────────────────────────────────────────────────────────
    var footer = e('text', {
      x: 20, y: 735, fill: fg('frame', 0.85), 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Helper: polar to cartesian ────────────────────────────────────
    function polar(r, angle) {
      return { x: cx + r * Math.sin(angle), y: cy - r * Math.cos(angle) };
    }

    // ── Rings ─────────────────────────────────────────────────────────
    var ringElements = [];

    for (var ri = 1; ri <= nRings; ri++) {
      var r = (ri / nRings) * radius;
      var pathD = '';
      for (var a = 0; a <= 360; a += 5) {
        var rad = a * Math.PI / 180;
        var p = polar(r, rad);
        pathD += (a === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
      }
      var ring = e('path', {
        d: pathD, fill: 'none',
        stroke: 'rgba(255,255,255,' + ((vis.frameBrightness||0.4) * (0.15 + ri * 0.05)).toFixed(2) + ')',
        'stroke-width': 0.5,
      });
      svgEl.appendChild(ring);
      ringElements.push(ring);

      // Ring value label (on the right side)
      if (ri < nRings) {
        var rl = polar(r, 0);
        var rv = e('text', {
          x: rl.x + 4, y: rl.y + 3,
          fill: fg('frame', 0.6), 'font-size': fs(9),
          'font-family': labelFont,
        });
        rv.textContent = Math.round((ri / nRings) * maxVal);
        rv.style.opacity = '0';
        svgEl.appendChild(rv);
        ringElements.push(rv);
      }
    }

    // ── Spokes ────────────────────────────────────────────────────────
    var spokeElements = [];

    for (var si = 0; si < nSpokes; si++) {
      var angle = si * angleStep;
      var p = polar(radius, angle);
      var spoke = e('line', {
        x1: cx, y1: cy, x2: p.x, y2: p.y,
        stroke: fg('frame', 0.2), 'stroke-width': 0.5,
      });
      spoke.style.opacity = '0';
      svgEl.appendChild(spoke);
      spokeElements.push(spoke);

      // Spoke label (at the outer edge)
      var lp = polar(radius + 22, angle);
      var lbl = e('text', {
        x: lp.x, y: lp.y + 3,
        fill: fg('frame', 0.75), 'font-size': fs(9),
        'font-family': labelFont, 'text-anchor': 'middle',
      });
      lbl.textContent = String(si + 1);
      lbl.style.opacity = '0';
      svgEl.appendChild(lbl);
      spokeElements.push(lbl);
    }

    // ── Data polygons ─────────────────────────────────────────────────
    var polygonElements = [];

    for (var si = 0; si < series.length; si++) {
      var sv = series[si].values || [];
      var pathD = '';
      var alpha = 0.3 + si * 0.2;

      for (var vi = 0; vi < sv.length && vi < nSpokes; vi++) {
        var r = (sv[vi] / maxVal) * radius;
        var angle = vi * angleStep;
        var p = polar(r, angle);
        pathD += (vi === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
      }
      // Close the polygon back to first point
      if (sv.length >= 2) {
        var p0 = polar((sv[0] / maxVal) * radius, 0);
        pathD += 'Z';
        // We need to include the closing part; rebuild with explicit close
        pathD = '';
        for (var vi = 0; vi < sv.length && vi < nSpokes; vi++) {
          var r = (sv[vi] / maxVal) * radius;
          var angle = vi * angleStep;
          var p = polar(r, angle);
          pathD += (vi === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
        }
        // Close
        var firstR = (sv[0] / maxVal) * radius;
        var firstP = polar(firstR, 0);
        pathD += 'L' + firstP.x.toFixed(1) + ',' + firstP.y.toFixed(1);
      }

      var poly = e('path', {
        d: pathD,
        fill: 'rgba(255,255,255,' + ((vis.dataBrightness||0.8) * (0.1 + si * 0.05)).toFixed(2) + ')',
        stroke: 'rgba(255,255,255,' + ((vis.dataBrightness||0.8) * (0.38 + si * 0.25)).toFixed(2) + ')',
        'stroke-width': 1.2,
      });
      svgEl.appendChild(poly);
      polygonElements.push(poly);
    }

    // ── Group map ─────────────────────────────────────────────────────
    var groupMap = {};
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.rings = ringElements;
    groupMap.spokes = spokeElements;
    groupMap.dataPolygons = polygonElements;

    // ── Animation ─────────────────────────────────────────────────────
    var defaults = [
      { action: 'appear',     groups: ['header', 'footer'] },
      { action: 'wait',       duration: 800 },
      { action: 'appear',     groups: ['rings'], order: 'sequential', gap: 150 },
      { action: 'appear',     groups: ['spokes'], order: 'simultaneous' },
      { action: 'wait',       duration: 600 },
      { action: 'appear',     groups: ['dataPolygons'], order: 'sequential', gap: 500 },
      { action: 'wait',       duration: 8000 },
      { action: 'disappear',  groups: ['dataPolygons'], order: 'sequential', gap: 300 },
      { action: 'wait',       duration: 300 },
      { action: 'disappear',  groups: ['spokes'], order: 'simultaneous' },
      { action: 'disappear',  groups: ['rings'], order: 'sequential', gap: 100 },
      { action: 'wait',       duration: 300 },
      { action: 'disappear',  groups: ['header', 'footer'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },

};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Sunburst Chart Card
//  — Concentric arc hierarchy: each ring is a depth level
//  — Arc angle = proportional value; colour dims with depth
//  — Animation groups: header, footer, rings
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['sunburst'] = {

  render: function(data, onDone) {
    var svgEl = data._container || document.getElementById('card');
    var vis = window.HAL_CONFIG.visual || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var dataFont = (vis.fonts || {}).data || labelFont;
    var e = window.HAL.svg.el;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var hierarchy = (data.hierarchy || []);
    if (hierarchy.length === 0) { if (onDone) onDone(); return; }

    var groupMap = {};
    var ringElements = [];     // one <g> per ring level

    // Layout
    var cx = 500, cy = 380;
    var maxRadius = 280;
    var ringPadding = 4;

    // Background
    if (!data._container) svgEl.innerHTML = '';
    svgEl.appendChild(e('rect', { x: 0, y: 0, width: 1000, height: 750, fill: data.color }));

    // ── Header ────────────────────────────────────────────────────────
    var header = e('text', {
      x: 20, y: 25, fill: fg('frame', 1.9), 'font-size': fs(14),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    header.textContent = data.title || '';
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // Footer
    var footer = e('text', {
      x: 15, y: 740, fill: fg('frame', 0.85), 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Flatten hierarchy into arc segments ─────────────────────────
    // Level 0 = children of root (the innermost ring)
    // Level 1 = grandchildren
    // Track max depth for radius calculation
    function flatten(node, depth, leaves) {
      leaves = leaves || [];
      var kids = node.children || [];
      if (kids.length === 0) {
        leaves.push({ name: node.name, value: node.value || 1, depth: depth, children: [] });
      } else {
        for (var i = 0; i < kids.length; i++) flatten(kids[i], depth + 1, leaves);
      }
      return leaves;
    }

    // Collect all leaf-level items per top-level group for angle proportion
    var allLeaves = [];
    var totalValue = 0;
    for (var gi = 0; gi < hierarchy.length; gi++) {
      var leaves = flatten(hierarchy[gi], 0);
      var groupValue = 0;
      for (var li = 0; li < leaves.length; li++) groupValue += leaves[li].value;
      // Store group-level info
      hierarchy[gi]._value = groupValue;
      hierarchy[gi]._depth = 0;
      hierarchy[gi]._leaves = leaves;
      totalValue += groupValue;
    }
    if (totalValue === 0) totalValue = 1;

    // Determine max depth for ring count
    var maxDepth = 0;
    for (var gi = 0; gi < hierarchy.length; gi++) {
      for (var li = 0; li < hierarchy[gi]._leaves.length; li++) {
        if (hierarchy[gi]._leaves[li].depth > maxDepth) maxDepth = hierarchy[gi]._leaves[li].depth;
      }
    }
    var levels = maxDepth + 2;  // group ring + children rings + leaf ring
    if (levels < 2) levels = 2;
    var ringH = maxRadius / levels;

    // Build arcs for each level
    // arcPath(cx, cy, innerR, outerR, startAngle, endAngle)
    function arcPath(ri, ro, a1, a2) {
      var large = (a2 - a1 > Math.PI) ? 1 : 0;
      var x1 = cx + ri * Math.sin(a1);
      var y1 = cy - ri * Math.cos(a1);
      var x2 = cx + ro * Math.sin(a1);
      var y2 = cy - ro * Math.cos(a1);
      var x3 = cx + ro * Math.sin(a2);
      var y3 = cy - ro * Math.cos(a2);
      var x4 = cx + ri * Math.sin(a2);
      var y4 = cy - ri * Math.cos(a2);
      return 'M ' + x1.toFixed(1) + ',' + y1.toFixed(1) +
             ' L ' + x2.toFixed(1) + ',' + y2.toFixed(1) +
             ' A ' + ro.toFixed(1) + ',' + ro.toFixed(1) +
             ' 0 ' + large + ' 1 ' +
             x3.toFixed(1) + ',' + y3.toFixed(1) +
             ' L ' + x4.toFixed(1) + ',' + y4.toFixed(1) +
             ' A ' + ri.toFixed(1) + ',' + ri.toFixed(1) +
             ' 0 ' + large + ' 0 ' +
             x1.toFixed(1) + ',' + y1.toFixed(1) + ' Z';
    }

    // For each ring level, collect all segments
    var ringGroups = []; // array per level: array of { el, name, value }

    // Level 0: top-level groups
    var l0 = [];
    var a0 = 0;
    for (var gi = 0; gi < hierarchy.length; gi++) {
      var frac = hierarchy[gi]._value / totalValue;
      var a1 = a0 + frac * 2 * Math.PI;
      var innerR = 0;
      var outerR = ringH - ringPadding;
      l0.push({
        el: e('path', { d: arcPath(innerR, outerR, a0, a1), fill: fg('frame', 0.8 - gi * 0.1), stroke: fg('frame', 0.05), 'stroke-width': 0.5 }),
        name: hierarchy[gi].name, value: hierarchy[gi]._value,
        startAngle: a0, endAngle: a1,
      });
      a0 = a1;
    }
    ringGroups.push(l0);

    // Deeper levels: distribute children within parent arc
    function buildLevel(level) {
      if (level > maxDepth) return;
      var prev = ringGroups[level - 1];
      var cur = [];
      for (var pi = 0; pi < prev.length; pi++) {
        var parentSeg = prev[pi];
        // Find items at this depth within the parent's arc
        var aStart = parentSeg.startAngle;
        var aRange = parentSeg.endAngle - parentSeg.startAngle;
        var innerR = level * ringH + ringPadding;
        var outerR = (level + 1) * ringH - ringPadding;
        // Identify items at this depth
        var items = [];
        for (var gi = 0; gi < hierarchy.length; gi++) {
          for (var li = 0; li < hierarchy[gi]._leaves.length; li++) {
            var leaf = hierarchy[gi]._leaves[li];
            if (leaf.depth === level) items.push(leaf);
          }
        }
        if (items.length === 0) continue;
        // Subdivide arc by leaf values
        var itemTotal = 0;
        for (var ii = 0; ii < items.length; ii++) itemTotal += items[ii].value;
        if (itemTotal === 0) itemTotal = 1;
        var aPos = aStart;
        for (var ii = 0; ii < items.length; ii++) {
          var frac2 = items[ii].value / itemTotal;
          var a2 = aPos + frac2 * aRange;
          cur.push({
            el: e('path', { d: arcPath(innerR, outerR, aPos, a2), fill: fg('frame', 0.5 - level * 0.05), stroke: fg('frame', 0.05), 'stroke-width': 0.3 }),
            name: items[ii].name, value: items[ii].value,
            startAngle: aPos, endAngle: a2,
          });
          aPos = a2;
        }
      }
      if (cur.length > 0) ringGroups.push(cur);
    }

    for (var lv = 1; lv <= maxDepth; lv++) buildLevel(lv);

    // If only 1 level, add a dummy inner ring for visual depth
    if (ringGroups.length === 1) {
      var inner = [];
      for (var pi = 0; pi < ringGroups[0].length; pi++) {
        var seg = ringGroups[0][pi];
        var ir = ringH * 0.4;
        inner.push({
          el: e('path', { d: arcPath(0, ir, seg.startAngle, seg.endAngle), fill: fg('frame', 0.9), stroke: 'none' }),
          name: '', value: 0,
          startAngle: seg.startAngle, endAngle: seg.endAngle,
        });
      }
      ringGroups.unshift(inner);
    }

    // Render ring groups
    for (var ri = 0; ri < ringGroups.length; ri++) {
      var ringG = e('g');
      ringG.style.opacity = '0';
      svgEl.appendChild(ringG);
      for (var si = 0; si < ringGroups[ri].length; si++) {
        ringG.appendChild(ringGroups[ri][si].el);
      }
      // Label most prominent segments
      if (ri === 0) {
        for (var si = 0; si < ringGroups[ri].length; si++) {
          var seg = ringGroups[ri][si];
          var midA = (seg.startAngle + seg.endAngle) / 2;
          var lr = ringH * 0.5;
          var lx = cx + lr * Math.sin(midA);
          var ly = cy - lr * Math.cos(midA);
          var label = e('text', {
            x: lx, y: ly + 3, fill: fg('frame', 1.5), 'font-size': fs(9),
            'font-family': labelFont, 'text-anchor': 'middle', 'text-rendering': 'optimizeLegibility',
          });
          label.textContent = seg.name;
          ringG.appendChild(label);
        }
      }
      ringElements.push(ringG);
    }

    // ── Animation ─────────────────────────────────────────────────
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.rings = ringElements;

    var defaults = [
      { action: 'appear',    groups: ['header', 'footer'] },
      { action: 'wait',      duration: 500 },
      { action: 'appear',    groups: ['rings'], order: 'sequential', gap: 300 },
      { action: 'wait',      duration: 8000 },
      { action: 'disappear', groups: ['rings'], order: 'reverse', gap: 200 },
      { action: 'wait',      duration: 300 },
      { action: 'disappear', groups: ['header', 'footer'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Streamgraph Chart Card
//  — Flowing stacked ribbons centred on a baseline
//  — Each series is a smooth filled ribbon
//  — Animation groups: header, footer, ribbons
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['streamgraph'] = {

  render: function(data, onDone) {
    var svgEl = data._container || document.getElementById('card');
    var vis = window.HAL_CONFIG.visual || {};
    var vc = vis.chart || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var e = window.HAL.svg.el;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var series = (data.series || []);
    if (series.length === 0) { if (onDone) onDone(); return; }

    // Use actual data point count from first series.
    var actualPts = series[0].values ? series[0].values.length : 20;
    if (actualPts < 2) { if (onDone) onDone(); return; }

    var groupMap = {};
    var ribbonGroups = [];

    // Layout
    var x0 = 80, y0 = 80, cw = 840, ch = 560;

    // Background
    if (!data._container) svgEl.innerHTML = '';
    svgEl.appendChild(e('rect', { x: 0, y: 0, width: 1000, height: 750, fill: data.color }));

    // Header
    var header = e('text', {
      x: 20, y: 25, fill: fg('frame', 1.9), 'font-size': fs(14),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    header.textContent = data.title || '';
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // Footer
    var footer = e('text', {
      x: 15, y: 740, fill: fg('frame', 0.85), 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Process data ──────────────────────────────────────────────
    // Extract and pad all series to actualPts
    var allVals = [];
    var maxVal = 0;
    for (var si = 0; si < series.length; si++) {
      var sv = series[si].values || [];
      var padded = [];
      for (var vi = 0; vi < actualPts; vi++) {
        var v = (vi < sv.length) ? Math.max(0, sv[vi]) : 0;
        padded.push(v);
        if (v > maxVal) maxVal = v;
      }
      allVals.push(padded);
    }
    if (maxVal === 0) maxVal = 1;

    // Stack values for centered baseline
    // Each layer: top = sum of all layers up to this one, bottom = sum of all layers below
    // Then shift everything so center = 0
    var layers = [];
    var totalStack = [];
    for (var vi = 0; vi < actualPts; vi++) {
      var t = 0;
      for (var si = 0; si < series.length; si++) t += allVals[si][vi];
      totalStack.push(t);
    }

    // Find global max stack for scaling
    var maxStack = 0;
    for (var vi = 0; vi < actualPts; vi++) {
      if (totalStack[vi] > maxStack) maxStack = totalStack[vi];
    }

    var yScale = (ch - 40) / (maxStack || 1);

    // Build layer paths
    // Each layer is a ribbon: top edge and bottom edge forming a closed path
    var layerPaths = [];
    for (var si = 0; si < series.length; si++) {
      var top = [];
      var bottom = [];
      // Calculate cumulative layers for this series
      var prevB = 0;
      for (var vi = 0; vi < actualPts; vi++) {
        var b = prevB;
        prevB += allVals[si][vi];
        // For centered streamgraph: bottom offset = b - totalStack[vi]/2
        var center = -totalStack[vi] / 2;
        var tb = (b + center) * yScale;
        var tt = (b + allVals[si][vi] + center) * yScale;
        var px = x0 + (vi / (actualPts - 1)) * cw;
        top.push({ x: px, y: y0 + ch / 2 + tt });
        bottom.push({ x: px, y: y0 + ch / 2 + tb });
      }

      // Layer data in correct order for polygon fill
      var pts = [];
      for (var pi = 0; pi < top.length; pi++) pts.push(top[pi]);
      for (var pi = top.length - 1; pi >= 0; pi--) pts.push(bottom[pi]);

      layerPaths.push({ points: pts, label: series[si].label || '' });
    }

    // ── Render ribbons ────────────────────────────────────────────
    // Draw in reverse (back to front) so first series is on top
    // applyOrder handles reversal
    for (var si = 0; si < series.length; si++) {
      var li = series.length - 1 - si;  // draw back layers first
      var layer = layerPaths[li];

      // Build SVG path with smooth (quadratic) curves
      // Use simple linear interpolation for now (fast, reliable)
      var pathD = '';
      for (var pi = 0; pi < layer.points.length; pi++) {
        var pt = layer.points[pi];
        pathD += (pi === 0 ? 'M ' : ' L ') + pt.x.toFixed(1) + ',' + pt.y.toFixed(1);
      }
      pathD += ' Z';

      var ribbonG = e('g');
      ribbonG.style.opacity = '0';
      var opacity = 0.55 + (li / series.length) * 0.35;
      var strokeOp = 0.2 + (li / series.length) * 0.3;
      ribbonG.appendChild(e('path', {
        d: pathD,
        fill: fg('data', opacity),
        stroke: fg('data', strokeOp),
        'stroke-width': 0.5,
      }));

      // End label
      var lastPt = layer.points[Math.floor(layer.points.length / 2)];
      var label = e('text', {
        x: lastPt.x + 8, y: lastPt.y + 3, fill: fg('data', 1.0),
        'font-size': fs(10), 'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      });
      label.textContent = layer.label;
      ribbonG.appendChild(label);

      svgEl.appendChild(ribbonG);
      ribbonGroups.push(ribbonG);
    }

    // ── Animation ─────────────────────────────────────────────────
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.ribbons = ribbonGroups;

    var defaults = [
      { action: 'appear',    groups: ['header', 'footer'] },
      { action: 'wait',      duration: 800 },
      { action: 'appear',    groups: ['ribbons'], order: 'sequential', gap: 400 },
      { action: 'wait',      duration: 8000 },
      { action: 'disappear', groups: ['ribbons'], order: 'reverse', gap: 250 },
      { action: 'wait',      duration: 300 },
      { action: 'disappear', groups: ['header', 'footer'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Hierarchical Edge Bundling Card
//  — Nodes arranged on a circle, curved connections bundled by hierarchy
//  — Connections between sibling sub-trees share more path = bundled
//  — Animation groups: header, footer, nodes, connections
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.cards = window.HAL.cards || {};

window.HAL.cards['edge-bundling'] = {

  render: function(data, onDone) {
    var svgEl = data._container || document.getElementById('card');
    var vis = window.HAL_CONFIG.visual || {};
    var labelFont = (vis.fonts || {}).label || 'monospace';
    var e = window.HAL.svg.el;
    var fg = window.HAL.svg.fg;
    var fs = window.HAL.svg.fs;

    var tree = data.tree;
    var connections = (data.connections || []);
    if (!tree || connections.length === 0) { if (onDone) onDone(); return; }

    var groupMap = {};
    var nodeElements = [];
    var connectionElements = [];

    // Layout
    var cx = 500, cy = 390;
    var nodeRadius = 250;  // circle radius for leaf nodes
    var bundleR = 120;     // inner radius for bundling (control point orbit)
    var dotR = 5;

    // Background
    if (!data._container) svgEl.innerHTML = '';
    svgEl.appendChild(e('rect', { x: 0, y: 0, width: 1000, height: 750, fill: data.color }));

    // Header
    var header = e('text', {
      x: 20, y: 25, fill: fg('frame', 1.9), 'font-size': fs(14),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    header.textContent = data.title || '';
    header.style.opacity = '0';
    svgEl.appendChild(header);

    // Footer
    var footer = e('text', {
      x: 15, y: 740, fill: fg('frame', 0.85), 'font-size': fs(10),
      'font-family': labelFont, 'text-rendering': 'optimizeLegibility',
      filter: 'url(#txtGlow)',
    });
    footer.textContent = data.label || '';
    footer.style.opacity = '0';
    svgEl.appendChild(footer);

    // ── Flatten hierarchy ─────────────────────────────────────────
    // Build node index with depth-first leaf order
    var leaves = [];
    var nodeById = {};

    function walk(node, depth, path) {
      var id = node.name;
      nodeById[id] = { node: node, depth: depth, path: path, children: [] };
      var kids = node.children || [];
      if (kids.length === 0) {
        leaves.push(id);
        return id;
      }
      for (var i = 0; i < kids.length; i++) {
        var childLeaf = walk(kids[i], depth + 1, path.concat(id));
        nodeById[id].children.push(childLeaf);
      }
      return nodeById[id].children[0]; // first leaf underneath
    }

    walk(tree, 0, []);
    var nLeaves = leaves.length;
    if (nLeaves === 0) { if (onDone) onDone(); return; }

    // Assign positions on the circle for each leaf
    var leafAngles = {};
    for (var li = 0; li < nLeaves; li++) {
      var angle = (li / nLeaves) * 2 * Math.PI - Math.PI / 2;
      leafAngles[leaves[li]] = angle;
    }

    function onCircle(angle, r) {
      return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
    }

    // Find deepest common ancestor depth for two leaves
    function commonDepth(a, b) {
      var infoA = nodeById[a];
      var infoB = nodeById[b];
      if (!infoA || !infoB) return 0;
      var pathA = infoA.path;
      var pathB = infoB.path;
      var depth = 0;
      var maxD = Math.min(pathA.length, pathB.length);
      for (var i = 0; i < maxD; i++) {
        if (pathA[i] === pathB[i]) depth = i + 1;
        else break;
      }
      return depth;
    }

    // ── Render nodes ──────────────────────────────────────────────
    var nodeG = e('g');
    nodeG.style.opacity = '0';
    svgEl.appendChild(nodeG);

    for (var li = 0; li < nLeaves; li++) {
      var angle = leafAngles[leaves[li]];
      var pos = onCircle(angle, nodeRadius);
      // Dot
      nodeG.appendChild(e('circle', {
        cx: pos.x, cy: pos.y, r: dotR,
        fill: fg('frame', 1.0), stroke: fg('frame', 0.3), 'stroke-width': 1,
      }));
      // Label
      var label = e('text', {
        x: pos.x + (Math.cos(angle) > 0 ? 10 : -10),
        y: pos.y + 4,
        fill: fg('frame', 1.0), 'font-size': fs(9),
        'font-family': labelFont,
        'text-anchor': Math.cos(angle) > 0 ? 'start' : 'end',
        'text-rendering': 'optimizeLegibility',
      });
      label.textContent = leaves[li];
      nodeG.appendChild(label);
      nodeElements.push({ dot: null, label: label });
    }

    // ── Render connections (bundled) ───────────────────────────────
    var connG = e('g');
    svgEl.appendChild(connG);

    for (var ci = 0; ci < connections.length; ci++) {
      var src = connections[ci].source;
      var tgt = connections[ci].target;
      if (!leafAngles[src] && leafAngles[tgt] === undefined) continue;

      var a1 = leafAngles[src];
      var a2 = leafAngles[tgt];

      // Control point radius based on common ancestor depth
      var depth = commonDepth(src, tgt);
      var maxDepth = 3;
      var bundleFrac = Math.min(1, depth / maxDepth);
      var cpR = bundleR + (nodeRadius - bundleR) * (1 - bundleFrac);
      if (cpR > nodeRadius - 10) cpR = nodeRadius - 10;

      // Control points at the bundle radius, midway between the two angles
      // Plus a radial offset to create the curve
      // Arc around the circle
      var midAngle = (a1 + a2) / 2;
      // Handle wrapping
      var diff = a2 - a1;
      if (diff > Math.PI) { a2 -= 2 * Math.PI; midAngle = (a1 + a2) / 2; }
      if (diff < -Math.PI) { a2 += 2 * Math.PI; midAngle = (a1 + a2) / 2; }
      diff = a2 - a1;

      // Control point 1: radial outward from source toward bundle
      var cp1x = cx + cpR * Math.cos(a1 + diff * 0.25);
      var cp1y = cy + cpR * Math.sin(a1 + diff * 0.25);
      // Control point 2: radial outward from target toward bundle
      var cp2x = cx + cpR * Math.cos(a2 - diff * 0.25);
      var cp2y = cy + cpR * Math.sin(a2 - diff * 0.25);

      var p1 = onCircle(a1, nodeRadius);
      var p2 = onCircle(a2, nodeRadius);

      var pathD = 'M ' + p1.x.toFixed(1) + ',' + p1.y.toFixed(1) +
                  ' C ' + cp1x.toFixed(1) + ',' + cp1y.toFixed(1) +
                  ' ' + cp2x.toFixed(1) + ',' + cp2y.toFixed(1) +
                  ' ' + p2.x.toFixed(1) + ',' + p2.y.toFixed(1);

      var op = 0.2 + (1 - bundleFrac) * 0.4;
      var line = e('path', {
        d: pathD,
        fill: 'none',
        stroke: fg('data', op),
        'stroke-width': 1.0 + (1 - bundleFrac) * 0.5,
      });
      connG.appendChild(line);
      connectionElements.push(line);
    }

    // ── Animation ─────────────────────────────────────────────────
    groupMap.header = header;
    groupMap.footer = footer;
    groupMap.nodes = nodeG;
    groupMap.connections = connectionElements;

    var defaults = [
      { action: 'appear',   groups: ['header', 'footer'] },
      { action: 'wait',     duration: 500 },
      { action: 'appear',   groups: ['nodes'] },
      { action: 'wait',     duration: 400 },
      { action: 'flickerIn', groups: ['connections'], order: 'sequential', gap: 200 },
      { action: 'wait',     duration: 8000 },
      { action: 'disappear', groups: ['connections'], order: 'reverse', gap: 150 },
      { action: 'wait',     duration: 300 },
      { action: 'disappear', groups: ['nodes'] },
      { action: 'wait',     duration: 300 },
      { action: 'disappear', groups: ['header', 'footer'] },
      { action: 'done' },
    ];
    window.HAL.anim.run(data, groupMap, onDone, defaults);
  },
};
</script>

      // Pass through orbital-specific fields
      if (dataSource.center) result.center = dataSource.center;
    }
    var hasData = Object.keys(result).length > 0;
    return hasData ? result : null;

          { label: 'avg', values: [950,900,820,750,700,720,780,860,920,980] },
          { label: 'min', values: [600,550,480,420,380,400,450,520,580,620] },
        ]},
        { name: 'AUTH-SVC', series: [
          { label: 'max', values: [1050,980,880,800,750,780,860,950,1020,1080] },

<script>// ═══════════════════════════════════════════════════════════════════════
//  VictoriaMetrics Data Source Plugin
//  — Fetches time-series data from VictoriaMetrics PromQL API
//  — Works from any HTTP server (VM has open CORS,
//    Access-Control-Allow-Origin: *)
//
//  Usage in config.js:
//    { type: 'chart', ...
//      dataSource: {
//        type: 'victoria',
//        url: 'http://192.168.50.9:8428',
//        range: 300,            // time window in seconds (default 300)
//        step: 30,              // [optional] seconds between points.
//                               // If set, ALL points from VM are accepted
//                               // and the renderer adapts its grid spacing
//                               // to match the actual number of points.
//                               // If omitted, falls back to 'points' (default 60)
//                               // which computes step = range / (points - 1)
//        points: 60,            // [optional, used only when step is not set]
//                               // Target number of points (VM downsamples).
//                               // Sets step = range / (points - 1)
//        promql: '...',
//        map: {
//          group:  'name',        // Prometheus label → group name (band)
//          series: 'le',          // Prometheus label → series label, or null
//        },
//        alias: {                 // [optional] rename series labels
//          node_load1: "1 MIN",   //   exact match
//          node_load5: "5 MIN",
//          strip: "node_load"     //   or strip prefix from all series
//        }
//      }
//    }
//
//  If map.series is null, each group gets a single curve labelled 'value'.
//  If map.series is set (e.g. 'le' for percentiles), series with the same
//  group label are merged into one band, differentiated by the series label.
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.data = window.HAL.data || {};
window.HAL.data.sources = window.HAL.data.sources || {};

(function() {

  var plugin = {

    // ── Fetch ─────────────────────────────────────────────────────────
    // Returns a Promise that resolves to { groups: [ { name, series } ] }
    // or null if the config is invalid.
    fetch: function(dataSource) {
      if (!dataSource || !dataSource.url || !dataSource.promql) return null;

      var url = dataSource.url.replace(/\/+$/, '') + '/api/v1/query_range';
      var query = dataSource.promql;
      var map = dataSource.map || {};
      var groupLabel = map.group || 'group';
      var seriesLabel = map.series || null;

      // Configurable time window: range in seconds (default 300 = 5 min)
      var windowSec = dataSource.range || 300;
      var step;
      if (dataSource.step) {
        // User specified exact step — use it. ALL points are returned.
        step = dataSource.step;
      } else {
        // Fall back to points-based step for backward compatibility.
        var nPoints = dataSource.points || 60;
        step = Math.max(Math.floor(windowSec / (nPoints - 1)), 1);
      }

      var now = Date.now() / 1000;
      var start = now - windowSec;

      return fetch(url + '?' + [
        'query=' + encodeURIComponent(query),
        'start=' + start,
        'end=' + now,
        'step=' + step
      ].join('&'))
        .then(function(r) { if (!r.ok) throw new Error('VM fetch failed: ' + r.status); return r.json(); })
        .then(function(json) { return plugin.transform(json, groupLabel, seriesLabel, dataSource); });
    },

    // ── Transform ─────────────────────────────────────────────────────
    // Parses a Prometheus query_range JSON response into the canonical
    // { groups: [ { name, series: [ { label, values } ] } ] } structure.
    transform: function(json, groupLabel, seriesLabel, dataSource) {
      if (!json || !json.data || !json.data.result) return null;

      var results = json.data.result;
      var groupMap = {};  // { groupName: { seriesName: [values] } }

      // Prepare alias map: exact matches take priority over strip
      var alias = (dataSource && dataSource.alias) || {};
      var strip = (typeof alias.strip === 'string') ? alias.strip : null;

      for (var i = 0; i < results.length; i++) {
        var metric = results[i].metric;
        var values = results[i].values;

        var grpName = metric[groupLabel] || 'unknown';
        var serName = seriesLabel ? (metric[seriesLabel] || 'value') : 'value';

        // Apply alias: exact match first, then strip prefix
        serName = alias[serName] || serName;
        if (strip && serName.indexOf(strip) === 0) {
          serName = serName.slice(strip.length);
        }

        var vals = [];
        for (var vi = 0; vi < values.length; vi++) {
          vals.push(parseFloat(values[vi][1]));
        }
        if (vals.length === 0) continue;

        if (!groupMap[grpName]) groupMap[grpName] = {};
        groupMap[grpName][serName] = vals;
      }

      // Flatten groupMap into the canonical array structure
      var groups = [];
      var grpNames = Object.keys(groupMap);
      for (var gi = 0; gi < grpNames.length; gi++) {
        var gn = grpNames[gi];
        var series = [];
        var serNames = Object.keys(groupMap[gn]);
        for (var si = 0; si < serNames.length; si++) {
          series.push({ label: serNames[si], values: groupMap[gn][serNames[si]] });
        }
        groups.push({ name: gn, series: series });
      }

      return { groups: groups };
    },

  };

  window.HAL.data.sources.victoria = plugin;
})();
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  Data Fetcher — Common API
//  — Routes fetch requests to the appropriate source plugin
//  — Fallback: returns inline demo data if no source resolves
// ═══════════════════════════════════════════════════════════════════════

window.HAL = window.HAL || {};
window.HAL.data = window.HAL.data || {};

// Fetch data for a card. Returns a Promise resolving to:
//   { groups: [ { name, series: [ { label, values } ] } ] }
window.HAL.data.fetchCardData = function(card) {
  var ds = card.dataSource || { type: 'inline' };
  var plugin = window.HAL.data.sources[ds.type];

  if (!plugin) {
    console.warn('Unknown data source type:', ds.type, '— falling back to inline');
    plugin = window.HAL.data.sources.inline;
  }

  var result = plugin.fetch(ds);

  if (result === null) {
    // No groups returned; try demo data
    var inline = window.HAL.data.sources.inline;
    var demo = inline.demo[card.title];
    if (demo) return Promise.resolve(demo);

    return Promise.resolve({ groups: [] });
  }

  // If the plugin returned a Promise (async fetch), wait for it
  if (result && typeof result.then === 'function') {
    return result;
  }

  // Synchronous result (inline static data)
  return Promise.resolve(result);
};
</script>
<script>// ═══════════════════════════════════════════════════════════════════════
//  App — Orchestrator
//  — Boots by fetching /api/config from the server
//  — Then cycles cards, handles keyboard controls
//  — Uses a generation counter to prevent stale callbacks from
//    racing with manual navigation
// ═══════════════════════════════════════════════════════════════════════

(function() {
  var svgEl = document.getElementById('card');

  // Fetch config from server, then boot the radiator
  fetch('/api/config').then(function(r) { return r.json(); }).then(function(cfg) {
    window.HAL_CONFIG = cfg;
    boot(cfg);
  }).catch(function(err) {
    // Fallback: use whatever config.js set if available
    if (window.HAL_CONFIG) {
      boot(window.HAL_CONFIG);
    } else {
      document.body.innerHTML += 'ERROR: cannot fetch config &ndash; ' + err;
    }
  });

  function boot(cfg) {
    if (!svgEl) { document.body.innerHTML += 'ERROR: no SVG element'; return; }
    if (!cfg || !cfg.cards || !cfg.cards.length) return;
    if (!window.HAL.cards || !window.HAL.cards.title) { document.body.innerHTML += 'ERROR: title renderer missing'; return; }

    var idx = 0, locked = false, autoTimer = null, zoom = 1.0;
    var wrap = document.getElementById('wrap');
    var gen = 0;  // incremented on every showCard → invalidates stale callbacks

    function clearAuto() {
      if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    }

    function clearCard(color) {
      if (color) document.body.style.background = color;
      svgEl.innerHTML = '';
    }

    // ── Guard: wraps a callback so it only fires if `myGen` still
    //     matches `gen`.  Prevents in-flight callbacks from a
    //     previous showCard from racing after a new transition.
    function guard(fn, myGen) {
      return function() {
        if (myGen !== gen) return;
        if (fn) fn.apply(this, arguments);
      };
    }

    // ── showCard: renders card at index i.  Increments gen so any
    //     pending callback from a previous render is atomically stale.
    //     Every navigation path (user arrows, auto-advance, locked
    //     replay, space toggle) ultimately calls showCard, so gen
    //     always advances.
    function showCard(i, onDone) {
      clearAuto();
      gen++;
      var myGen = gen;
      var c = cfg.cards[i % cfg.cards.length];
      clearCard(c.color);

      if (c.type !== 'title') {
        window.HAL.data.fetchCardData(c)
          .then(function(data) {
            if (myGen !== gen) return;  // stale: user navigated away
            if (data) for (var k in data) c[k] = data[k];
            try {
              var r = window.HAL.cards[c.type];
              var cb = guard(onDone, myGen);
              r && r.render ? r.render(c, cb) : cb && cb();
            } catch(e) { var cb = guard(onDone, myGen); cb && cb(); }
          })
          .catch(function() { var cb = guard(onDone, myGen); cb && cb(); });
      } else {
        window.HAL.cards.title.render(c);
        if (onDone) {
          autoTimer = setTimeout(guard(onDone, myGen), cfg.timing.titleCardDisplay * 1000);
        }
      }
    }

    function cardDone() {
      locked ? showCard(idx, cardDone) : scheduleNext();
    }

    function scheduleNext() {
      clearAuto();
      transitionTo((idx + 1) % cfg.cards.length);
    }

    function transitionTo(nextIdx) {
      idx = nextIdx;
      showCard(idx, cardDone);
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault(); locked = false;
        transitionTo((idx - 1 + cfg.cards.length) % cfg.cards.length);
      }
      else if (e.key === 'ArrowRight') {
        e.preventDefault(); locked = false;
        transitionTo((idx + 1) % cfg.cards.length);
      }
      else if (e.key === ' ') {
        e.preventDefault(); locked = !locked;
        locked ? showCard(idx, cardDone) : scheduleNext();
      }
      else if (e.key === '=' || e.key === '+') {
        e.preventDefault();
        zoom = Math.min(zoom + 0.25, 3.0);
        if (wrap) { wrap.style.transform = 'scale(' + zoom + ')'; wrap.classList.add('zoomed'); }
      }
      else if (e.key === '-') {
        e.preventDefault();
        zoom = Math.max(zoom - 0.25, 0.25);
        if (zoom === 1.0) {
          if (wrap) { wrap.style.transform = ''; wrap.classList.remove('zoomed'); }
        } else {
          if (wrap) { wrap.style.transform = 'scale(' + zoom + ')'; wrap.classList.add('zoomed'); }
        }
      }
    });

    // ── Boot sequence ──────────────────────────────────────────────────
    showCard(0);
    autoTimer = setTimeout(transitionTo, cfg.timing.titleCardDisplay * 1000, 1);
  }
})();
</script>
</body>
