<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAL 9000 — Metrics Radiator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; margin: 0; padding: 0; }
  body { display: flex; justify-content: center; align-items: center; }
  #wrap {
    width: 100vw; height: 100vh;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: 100%; }

  @keyframes blinkIn {
    0%   { opacity: 0; }  4%   { opacity: 1; }  8%   { opacity: 0; }
    12%  { opacity: 1; }  16%  { opacity: 0; }  20%  { opacity: 1; }
    24%  { opacity: 0; }  28%  { opacity: 1; }  32%  { opacity: 0; }
    36%  { opacity: 1; }  40%  { opacity: 0; }  44%  { opacity: 1; }
    48%  { opacity: 0; }  52%  { opacity: 1; }  56%  { opacity: 0; }
    60%  { opacity: 1; }  64%  { opacity: 0; }  68%  { opacity: 1; }
    72%  { opacity: 0; }  76%  { opacity: 1; }  80%  { opacity: 0; }
    84%  { opacity: 1; }  88%  { opacity: 0; }  92%  { opacity: 1; }
    96%  { opacity: 0; }  100% { opacity: 1; }
  }
  @keyframes blinkOut {
    0%   { opacity: 1; } 50%  { opacity: 0; } 100% { opacity: 0; }
  }

  @keyframes throb {
    0%   { opacity: 1; }
    50%  { opacity: 0; }
    100% { opacity: 1; }
  }
  .blink-in  { animation: blinkIn   1s ease-in-out forwards; }
  .blink-out { animation: blinkOut  1s ease-in-out forwards; }
  .throb { animation: throb 1s ease-in-out forwards; }

  @font-face { font-family: 'EurostileLocal'; src: url('assets/fonts/Eurostile-Bold-Extended.otf') format('opentype'); }
  @font-face { font-family: 'RajdhaniLightLocal'; src: url('assets/fonts/Rajdhani-Light.ttf') format('truetype'); }
</style>
</head>
<body>
<div id="wrap"><svg id="card" viewBox="-30 -30 1060 810" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
<!-- ── Application modules (loaded in dependency order) ─────────────── -->
<script src="src/config.js"></script>
<script src="src/svg-utils.js"></script>
<script src="src/animation-engine.js"></script>
<script src="src/cards/title.js"></script>
<script src="src/cards/curve-family.js"></script>
<script src="src/cards/curve-family-stacked.js"></script>
<script src="src/cards/curve-family-3d.js"></script>
<script src="src/cards/tabular.js"></script>
<script src="src/cards/telemetry-grid.js"></script>
<script src="src/cards/wireframe.js"></script>
<script src="src/cards/polar.js"></script>
<script src="src/data/sources/inline.js"></script>
<script src="src/data/sources/victoria.js"></script>
<script src="src/data/fetcher.js"></script>
<script src="src/app.js"></script>
</body>
</html>
