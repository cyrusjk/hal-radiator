# ═══════════════════════════════════════════════════════════════════════
#  HAL Metrics Radiator — Configuration
#
#  Edit this file to customise the radiator. Then run:
#    python build.py   → generates config.js + dist/index.html
#    python refresh.py → queries VictoriaMetrics for live data
# ═══════════════════════════════════════════════════════════════════════

timing:
  # How many seconds each title card stays visible before cutting to
  # its first chart card. Applied globally to all groups.
  titleCardDisplay: 8

# ── HAL 9000 colour palette ───────────────────────────────────────────
# Colours extracted from The HAL Project screensaver reference images.
# Reference by name in group/chart configs below. Any colour value that
# matches a key here resolves to its RGB value; otherwise treated as raw.
colors:
  blue:       "rgb(54,85,165)"
  plum:       "rgb(130,73,107)"
  amber:      "rgb(228,153,38)"
  teal:       "rgb(19,81,73)"
  pink:       "rgb(166,38,79)"
  green:      "rgb(78,118,84)"
  red:        "rgb(167,11,53)"
  navy:       "rgb(23,31,57)"
  dark-blue:  "rgb(39,72,100)"
  dark-navy:  "rgb(16,24,57)"
  purple:     "rgb(98,61,109)"
  blueprint:  "rgb(28,52,100)"
  dark-teal:  "rgb(16,45,70)"
  charcoal:   "rgb(20,20,30)"

# ── Visual settings ─────────────────────────────────────────────────────
# Fonts, chart dimensions, and line styles used by card renderers.
visual:
  fonts:
    title: "EurostileLocal, sans-serif"
    label: "RajdhaniLightLocal, Rajdhani, monospace"
  chart:
    x0: 80
    y0: 70
    w: 700
    h: 520
    dataPts: 9
    strokes: [1.5, 1.0, 0.7]
    dashes: [null, "4,3", "1,3"]

# ── Card sequence ─────────────────────────────────────────────────────
# Each group defines a title card followed by one or more chart cards.
# The radiator cycles: title (8s) → chart (animation) → chart → ...
#                             → next group's title (8s) → ...
#
# chartType determines the renderer used:
#   curve-family — multi-band curve chart (3 bands × 3 curves by default)
#
# dataSource determines where chart data comes from:
#   type: inline     — data is embedded in the config (demo/static)
#   type: victoria   — fetched from VictoriaMetrics at runtime
#
# For victoria sources, the map tells the plugin how Prometheus labels
# map to the chart's group and series structure:
#   group:  label name → becomes a chart band (e.g. 'service', 'job')
#   series: label name → becomes a curve within the band, or null

groups:

  - title: VEH
    subheading: "LIN: 86-QW"
    color: blue
    charts:
      - chartType: curve-family
        title: "LAT: PROD-01"
        label: "LATENCY PERCENTILES"
        color: blueprint
        dataSource:
          type: inline
          groups:
            - name: API-GATEWAY
              series:
                - { label: p99, values: [60,70,85,110,130,125,100,80,65,55] }
                - { label: p95, values: [30,35,42,55,60,58,50,40,32,28] }
                - { label: p50, values: [10,12,14,18,20,18,15,12,10,8] }
            - name: AUTH-SVC
              series:
                - { label: p99, values: [35,42,58,78,90,85,70,50,38,32] }
                - { label: p95, values: [15,18,25,35,40,38,30,22,16,14] }
                - { label: p50, values: [5,6,8,10,12,11,9,7,5,4] }
            - name: WORKER
              series:
                - { label: p99, values: [80,95,120,160,190,180,150,110,90,75] }
                - { label: p95, values: [50,60,75,95,110,105,85,65,55,48] }
                - { label: p50, values: [20,25,30,40,45,42,35,28,22,18] }

      - chartType: curve-family
        title: "THR: NODE-02"
        label: "THROUGHPUT"
        color: dark-blue
        dataSource:
          type: inline
          groups:
            - name: API-GATEWAY
              series:
                - { label: max, values: [1200,1150,1050,950,880,900,1000,1100,1180,1220] }
                - { label: avg, values: [950,900,820,750,700,720,780,860,920,980] }
                - { label: min, values: [600,550,480,420,380,400,450,520,580,620] }
            - name: AUTH-SVC
              series:
                - { label: max, values: [1050,980,880,800,750,780,860,950,1020,1080] }
                - { label: avg, values: [800,750,680,620,580,600,650,720,780,820] }
                - { label: min, values: [450,400,350,300,280,300,340,400,440,470] }

  - title: SYS
    subheading: "PAPPY HOMELAB"
    color: dark-teal
    charts:
      - chartType: curve-family
        title: "CPU: LOAD AVG"
        label: "CPU LOAD AVERAGES"
        color: dark-teal
        dataSource:
          type: victoria
          url: "http://192.168.50.9:8428"
          promql: '{__name__=~"node_load[0-9]+"}'
          map:
            group: job
            series: __name__

  - title: HAL
    subheading: "9000 COMPUTER"
    color: amber
    charts: []

  - title: COM
    subheading: "PMT: 26-07"
    color: plum
    charts: []

  - title: GDE
    subheading: "NAV: 94-KL"
    color: blue
    charts: []
