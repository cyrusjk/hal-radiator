# ── Chip badges can be added to composite card layouts:
#    layout:
#      zones:
#        - type: chip
#          x: 845  y: 12  w: 38  h: 38
#          label: Z
#          bg: "rgb(255,255,255)"
#          textColor: "rgb(45,75,99)"    # same as card background
#          fontSize: 26  padX: 10
#
# ── Timing — values measured from HAL 9000 reference video at 24fps ────
# flickerDuration: 200ms (reference: 125-250ms per element flicker cycle)
# groupGap: 167ms (reference: ~4 frames = 167ms between sequential elements)
# throb: count=3 cycles (reference: 3 cycles), duration=330ms (reference: 333ms per cycle = 42ms snap + 250ms fade + 42ms blank)
# Data screen holds reduced to 2000-5000ms (reference: data screens hold 8-15s total)
# ── Variable definitions (YAML anchors, referenced via *alias) ─────
vars:
  vm: &vm_url "http://192.168.50.9:8428"

colors:
  blue: rgb(51,82,164)
  cerulean: rgb(22,95,165)
  charcoal: rgb(20,20,30)
  dark-charcoal: rgb(43,43,43)
  dark-teal: rgb(16,45,70)
  deep-teal: rgb(45,90,94)
  dmg-red: rgb(125,27,36)
  gde-blue: rgb(43,69,141)
  hib-teal: rgb(7,74,66)
  main-blue: rgb(45,75,99)
  maroon: rgb(94,32,40)
  mem-blue: rgb(59,89,115)
  nav-red: rgb(139,26,50)
  navy: rgb(14,21,48)
  near-black: rgb(10,10,10)
  plum: rgb(73,42,63)
  purple-card: rgb(94,67,110)
fonts:
  EurostileLocal:
    format: opentype
    src: assets/fonts/Eurostile-Bold-Extended.otf
  FolioBoldLocal:
    format: truetype
    src: assets/fonts/Folio-Std-Bold.ttf
  FolioLocal:
    format: truetype
    src: assets/fonts/Folio-Std-Medium.ttf
  ManifoldLocal:
    format: truetype
    src: assets/fonts/IBM-Selectric-Manifold.ttf
  RajdhaniLightLocal:
    format: truetype
    src: assets/fonts/Rajdhani-Light.ttf

# ── Data fault handling (global default, overridable per card) ────────
#   mode: skip          — advance to next card immediately
#         hide          — show empty card for defaultDuration ms
#         non-function  — show flickering "NON FUNCTION" card + tooltip
#   defaultDuration: 5000   — how long to show the fault state before advancing
dataFault:
  mode: skip

groups:
- charts:
  - color: gde-blue
    dataSource:
      map:
        group: job
        series: mode
      promql: avg by (mode, job) (rate(node_cpu_seconds_total{mode=~"user|system|iowait"}[2m]))
      range: 3600
      step: 60
      type: victoria
      url: *vm_url
    label: CPU
    prototype: curve-family-lat
    title: AVG
  - color: main-blue
    dataSource:
      map:
        group: device
        series: direction
      promql: label_replace(rate(node_network_receive_bytes_total{device="eth0"}[2m]),
        "direction", "RX", "__name__", ".*") or label_replace(rate(node_network_transmit_bytes_total{device="eth0"}[2m]),
        "direction", "TX", "__name__", ".*")
      range: 3600
      step: 180
      type: victoria
      url: *vm_url
    label: ETH
    prototype: curve-family-default
    title: THR
  color: blue
  subheading: 'LIN: 86-QW'
  title: VEH
- charts:
  - color: dark-teal
    dataSource:
      map:
        group: job
        series: __name__
      promql: '{__name__=~"node_load[0-9]+", job="node"}'
      range: 3600
      step: 180
      type: victoria
      url: *vm_url
    label: LOAD AVG
    prototype: curve-family-default
    title: CPU
  - color: dark-teal
    dataSource:
      map:
        group: job
        series: __name__
      promql: '{__name__=~"node_load[0-9]+", job="node"}'
      range: 43200
      step: 180
      type: victoria
      url: *vm_url
    label: LOAD 1/5/15
    prototype: curve-family-stacked
    title: CPU
  - color: dark-teal
    dataSource:
      alias:
        strip: node_load
      map:
        group: job
        series: __name__
      promql: '{__name__=~"node_load[0-9]+", job="node"}'
      range: 43200
      step: 720
      type: victoria
      url: *vm_url
    label: LOAD
    prototype: curve-family-3d
    title: 1 / 5 / 15
  color: dark-teal
  subheading: 'PAPPY: 192.168.50.9'
  title: SYS
- charts:
  - color: plum
    dataSource:
      hierarchy:
      - children:
