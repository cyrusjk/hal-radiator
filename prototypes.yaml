  orbital-default:
    animation:
      phases:
      - action: appear
        groups:
        - header
        - footer
      - action: wait
        duration: 400
      - action: appear
        groups:
        - centerBody
      - action: appear
        groups:
        - centerLabel
      - action: appear
        groups:
        - axis
      - action: wait
        duration: 200
      # Graph appears complete — all orbit lines at once
      - action: appear
        groups:
        - line_0
        - line_1
        - line_2
        - line_3
        - line_4
        - line_5
        - line_6
        - line_7
      - action: wait
        duration: 300
      # Bold arcs + text pop in together
      - action: appear
        groups:
        - bold_0
        - bold_1
        - bold_2
        - bold_3
        - bold_4
        - bold_5
        - bold_6
        - bold_7
        - moon_0
        - moon_1
        - moon_2
        - moon_3
        - moon_4
        - moon_5
        - moon_6
        - moon_7
        - markers
        - labels
      - action: wait
        duration: 400
      # Glowing highlights appear sequentially
      - action: appear
        groups:
        - glow_0
        duration: 600
        order: sequential
      - action: wait
        duration: 200
      - action: appear
        groups:
        - glow_1
        duration: 600
        order: sequential
      - action: wait
        duration: 200
      - action: appear
        groups:
        - glow_2
        duration: 600
        order: sequential
      - action: wait
        duration: 200
      - action: appear
        groups:
        - glow_3
        duration: 600
        order: sequential
      - action: wait
        duration: 200
      - action: appear
        groups:
        - glow_4
        duration: 600
        order: sequential
      - action: wait
        duration: 200
      - action: appear
        groups:
        - glow_5
        duration: 600
        order: sequential
      - action: wait
        duration: 200
      - action: appear
        groups:
        - glow_6
        duration: 600
        order: sequential
      - action: wait
        duration: 200
      - action: appear
        groups:
        - glow_7
        duration: 600
        order: sequential
      - action: wait
        duration: 3000
      # Disappear in reverse
      - action: disappear
        gap: 60
        groups:
        - glow_7
        - glow_6
        - glow_5
        - glow_4
        - glow_3
        - glow_2
        - glow_1
        - glow_0
        order: reverse
      - action: disappear
        gap: 60
        groups:
        - labels
        order: reverse
      - action: disappear
        gap: 60
        groups:
        - markers
        order: reverse
      - action: disappear
        gap: 60
        groups:
        - moon_7
        - moon_6
        - moon_5
        - moon_4
        - moon_3
        - moon_2
        - moon_1
        - moon_0
        order: reverse
      - action: wait
        duration: 150
      - action: disappear
        gap: 60
        groups:
        - bold_7
        - bold_6
        - bold_5
        - bold_4
        - bold_3
        - bold_2
        - bold_1
        - bold_0
        order: reverse
      - action: disappear
        gap: 60
        groups:
        - line_7
        - line_6
        - line_5
        - line_4
        - line_3
        - line_2
        - line_1
        - line_0
        order: reverse
      - action: disappear
        groups:
        - axis
      - action: disappear
        groups:
        - centerLabel
      - action: disappear
        groups:
        - centerBody
      - action: wait
        duration: 150
      - action: disappear
        groups:
        - header
        - footer
      - action: done
    chartType: orbital
