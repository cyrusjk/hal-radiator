      - action: flickerIn
        gap: 167
        groups:
        - bands
        order: sequential
      - action: wait
        duration: 2000
      - action: appear
        groups:
        - minValues
      - action: appear
        groups:
        - maxValues
      - action: wait
        duration: 2000
      - action: throb
        count: 3
        duration: 330
        groups:
        - minValues
        order: simultaneous
      - action: wait
        duration: 500
      - action: throb
        count: 3
        duration: 330
        groups:
        - maxValues
        order: simultaneous
      - action: wait
        duration: 1000
      - action: flickerOut
        groups:
        - maxValues
      - action: flickerOut
        groups:
        - minValues
      - action: wait
        duration: 1000
      - action: flickerOut
        gap: 167
        groups:
        - bands
        order: sequential
      - action: wait
        duration: 300
      - action: disappear
        groups:
        - header
        - footer
        - grid
        - groupLabels
        - verticalLines
      - action: wait
        duration: 1000
      - action: done
    chartType: curve-family
  curve-family-stacked:
    animation:
      phases:
      - action: appear
        groups:
        - header
        - footer
      - action: wait
        duration: 1000
      - action: appear
        gap: 167
        groups:
        - bands
        order: sequential
      - action: wait
        duration: 5000
      - action: disappear
        gap: 100
        groups:
        - bands
        order: sequential
      - action: wait
        duration: 300
      - action: disappear
        groups:
        - header
        - footer
      - action: done
    chartType: curve-family-stacked
  edge-bundling-default:
