# ── Card Prototypes ── Named reusable templates ──────────────
# Chart entries reference a prototype and override title, label, color,
# dataSource, and optionally animation.phases.
cardPrototypes:
  curve-family-3d:
    animation:
      phases:
      - action: blank
      - action: wait
        duration: 1000
      - action: draw
        duration: 500
        groups:
        - radialLines
      - action: draw
        duration: 10
        gap: 20
        groups:
        - gridLines
        order: sequential
      - action: appear
        groups:
        - labels
      - action: wait
        duration: 1000
      - action: appear
        groups:
        - header
        - footer
      - action: wait
        duration: 1000
      - action: appear
        gap: 167
        groups:
        - bands
        order: sequential
      - action: wait
        duration: 5000
      - action: disappear
        gap: 167
        groups:
        - bands
        order: sequential
      - action: wait
        duration: 300
      - action: disappear
        groups:
        - radialLines
        - gridLines
        - labels
        - header
        - footer
      - action: done
    chartType: curve-family-3d
  curve-family-default:
    animation:
      phases:
      - action: blank
      - action: wait
        duration: 1000
      - action: draw
        duration: 5
        gap: 20
        groups:
        - verticalLines
        order: sequential
      - action: appear
        groups:
        - header
        - footer
        - grid
        - groupLabels
      - action: wait
        duration: 1000
      - action: flickerIn
        gap: 167
        groups:
        - bands
        order: sequential
      - action: wait
        duration: 2000
      - action: appear
        groups:
        - minValues
      - action: appear
        groups:
        - maxValues
      - action: wait
        duration: 2000
      - action: throb
        count: 3
        duration: 330
        groups:
        - minValues
        order: simultaneous
      - action: throb
        count: 3
        duration: 330
        groups:
        - maxValues
        order: simultaneous
      - action: wait
        duration: 1000
      - action: flickerOut
        gap: 167
        groups:
        - bands
        order: sequential
      - action: wait
        duration: 1000
      - action: disappear
        groups:
        - header
        - footer
        - grid
        - groupLabels
        - verticalLines
      - action: wait
        duration: 1000
      - action: done
    chartType: curve-family
  curve-family-lat:
    animation:
      phases:
      - action: blank
      - action: wait
        duration: 1000
      - action: draw
        duration: 2
        gap: 5
        groups:
        - verticalLines
        order: sequential
      - action: appear
        groups:
        - header
        - footer
        - grid
        - groupLabels
        - verticalLines
      - action: wait
